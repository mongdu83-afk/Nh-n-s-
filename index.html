_url: reportUrl,\n        to_email: emails\n      };\n\n      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params);\n      toast(\"\u0110\u00e3 g\u1eedi bi\u00ean b\u1ea3n ki\u1ec3m k\u00ea qua email th\u00e0nh c\u00f4ng.\", 3000);\n    }catch(err){\n      console.error(err);\n      toast(\"G\u1eedi th\u1ea5t b\u1ea1i. Ki\u1ec3m tra k\u1ebft n\u1ed1i m\u1ea1ng, c\u1ea5u h\u00ecnh EmailJS, ho\u1eb7c quy\u1ec1n Storage.\", 4000);\n    }\n    btn.disabled = false;\n    btn.textContent = \"\ud83d\udce7 Ch\u1ed1t ki\u1ec3m k\u00ea & G\u1eedi bi\u00ean b\u1ea3n\";\n  });\n\n  /* ================= SESSION MANAGER (C\u00e0i \u0111\u1eb7t) ================= */\n  function renderSessionManager(){\n    var box = $(\"sessionList\");\n    if(!box) return;\n    if(!state.sessions.length){\n      box.innerHTML = '<p class=\"sub\">Ch\u01b0a c\u00f3 \u0111\u1ee3t ki\u1ec3m k\u00ea n\u00e0o.</p>';\n      populateSummarySessionSelect();\n      return;\n    }\n    var sorted = state.sessions.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });\n    box.innerHTML = sorted.map(function(s){\n      var isActive = s.id === state.activeSessionId;\n      return '<div class=\"recent-row\">' +\n        '<div style=\"flex:1; min-width:0;\">' +\n          '<div class=\"rn\">'+escapeHtml(s.label)+(isActive ? ' <span style=\"color:var(--teal); font-weight:800;\">\u00b7 \u0110ang d\u00f9ng</span>' : '')+'</div>' +\n          '<div class=\"rc\">T\u1ea1o l\u00fac '+new Date(s.createdAt).toLocaleString(\"vi-VN\")+'</div>' +\n        '</div>' +\n        '<div class=\"recent-actions\">' +\n          (isActive ? '' : '<button data-usesession=\"'+s.id+'\">Ch\u1ecdn</button>') +\n          '<button data-delsession=\"'+s.id+'\">Xo\u00e1</button>' +\n        '</div>' +\n      '</div>';\n    }).join(\"\");\n    document.querySelectorAll(\"[data-usesession]\").forEach(function(btn){\n      btn.addEventListener(\"click\", async function(){\n        var sid = this.dataset.usesession;\n        this.disabled = true;\n        try{\n          await setActiveSession(state.shop, sid);\n          state.activeSessionId = sid;\n          state.totalsCache = {};\n          await loadStockForShop();\n          updateCtxChip();\n          renderSessionManager();\n          toast(\"\u0110\u00e3 chuy\u1ec3n sang \" + (state.sessions.find(function(s){return s.id===sid;})||{}).label);\n        }catch(e){ console.error(e); toast(\"L\u1ed7i, th\u1eed l\u1ea1i.\"); }\n        this.disabled = false;\n      });\n    });\n    document.querySelectorAll(\"[data-delsession]\").forEach(function(btn){\n      btn.addEventListener(\"click\", async function(){\n        var sid = this.dataset.delsession;\n        var sess = state.sessions.find(function(s){return s.id===sid;});\n        if(!confirm(\"Xo\u00e1 to\u00e0n b\u1ed9 s\u1ed1 li\u1ec7u c\u1ee7a \\\"\" + (sess?sess.label:\"\") + \"\\\"? Kh\u00f4ng th\u1ec3 ho\u00e0n t\u00e1c.\")) return;\n        this.disabled = true;\n        try{\n          var result = await deleteSession(state.shop, sid);\n          state.sessions = result.sessions;\n          state.activeSessionId = result.activeSessionId;\n          state.totalsCache = {};\n          state.summarySessionId = result.activeSessionId;\n          await loadStockForShop();\n          updateCtxChip();\n          renderSessionManager();\n          toast(\"\u0110\u00e3 xo\u00e1 \u0111\u1ee3t ki\u1ec3m k\u00ea.\");\n        }catch(e){ console.error(e); toast(\"Xo\u00e1 th\u1ea5t b\u1ea1i, th\u1eed l\u1ea1i.\"); }\n        this.disabled = false;\n      });\n    });\n    populateSummarySessionSelect();\n  }\n\n  $(\"btnNewSession\").addEventListener(\"click\", async function(){\n    var label = prompt(\"\u0110\u1eb7t t\u00ean cho \u0111\u1ee3t ki\u1ec3m k\u00ea m\u1edbi (VD: \u0110\u1ee3t th\u00e1ng 9):\", \"\u0110\u1ee3t \" + formatDateVN(new Date()));\n    if(label === null) return;\n    this.disabled = true;\n    try{\n      var result = await createSession(state.shop, label.trim() || undefined);\n      state.sessions = result.sessions;\n      state.activeSessionId = result.activeSessionId;\n      state.totalsCache = {};\n      state.summarySessionId = result.activeSessionId;\n      await loadStockForShop();\n      updateCtxChip();\n      renderSessionManager();\n      toast(\"\u0110\u00e3 t\u1ea1o v\u00e0 chuy\u1ec3n sang \u0111\u1ee3t m\u1edbi.\");\n    }catch(e){ console.error(e); toast(\"T\u1ea1o \u0111\u1ee3t th\u1ea5t b\u1ea1i, th\u1eed l\u1ea1i.\"); }\n    this.disabled = false;\n  });\n\n  function populateSummarySessionSelect(){\n    var sel = $(\"summarySessionSelect\");\n    if(!sel) return;\n    var sorted = state.sessions.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });\n    var opts = '<option value=\"__all__\">\u2014 T\u1ed5ng h\u1ee3p t\u1ea5t c\u1ea3 c\u00e1c \u0111\u1ee3t \u2014</option>' +\n      sorted.map(function(s){\n        return '<option value=\"'+s.id+'\">'+escapeHtml(s.label)+(s.id===state.activeSessionId ? \" (\u0111ang d\u00f9ng)\" : \"\")+'</option>';\n      }).join(\"\");\n    sel.innerHTML = opts;\n    sel.value = state.summarySessionId || state.activeSessionId;\n  }\n  $(\"summarySessionSelect\").addEventListener(\"change\", function(){\n    state.summarySessionId = this.value;\n    renderSummary();\n  });\n\n})();\n<\/script>\n</body>\n</html>\n";

function buildInventoryHtml(userName, userShop){
  // Tự động điền tên + cửa hàng lấy từ tài khoản đã đăng nhập (hoặc cửa hàng quản lý vừa chọn
  // ở màn hình đơn giản hoá bên ngoài), rồi bấm hộ nút "Bắt đầu" — nhờ vậy bỏ hẳn được màn hình
  // đăng nhập thủ công (card "UPHARMA / Kiểm Kê Nhà Thuốc") trong tab Kiểm kê.
  // Đồng thời:
  //  - ẩn thanh đầu trang + thanh điều hướng dưới CỦA RIÊNG app Kiểm kê (đã có sidebar/pill của
  //    app chính rồi, không cần lặp lại).
  //  - bỏ hẳn lớp mã PIN quản lý khi vào Tổng hợp/Cài đặt — mở khoá sẵn ngay từ đầu bằng cách đặt
  //    sessionStorage TRƯỚC KHI script gốc của app kiểm kê chạy (script này được chèn ngay đầu
  //    <body>, chạy trước script chính nằm ở cuối trang).
  var earlyUnlock =
    "<script>\n" +
    "try{ sessionStorage.setItem('kiemke_mgr_unlocked','1'); }catch(e){}\n" +
    "<\/script>\n";
  var injected =
    "<style>\n" +
    "  .topbar{ display:none !important; }\n" +
    "  .bottomnav{ display:none !important; }\n" +
    "  .view{ padding-bottom:24px !important; }\n" +
    "  #app{ max-width:640px; }\n" +
    "  #pinGate{ display:none !important; }\n" +
    "  #btnChangeUser{ display:none !important; }\n" +
    "<\/style>\n" +
    "<script>\n" +
    "(function(){\n" +
    "  function ready(fn){ if(document.readyState!=='loading'){ fn(); } else { document.addEventListener('DOMContentLoaded', fn); } }\n" +
    "  ready(function(){\n" +
    "    try{\n" +
    "      var nameEl = document.getElementById('gateName');\n" +
    "      var shopEl = document.getElementById('gateShop');\n" +
    "      var enterBtn = document.getElementById('gateEnter');\n" +
    "      if(!nameEl || !shopEl || !enterBtn) return;\n" +
    "      var presetName = " + JSON.stringify(userName || "") + ";\n" +
    "      var presetShop = " + JSON.stringify(userShop || "") + ";\n" +
    "      if(!presetName || !presetShop) return;\n" +
    "      nameEl.value = presetName;\n" +
    "      var found = Array.prototype.some.call(shopEl.options, function(o){ return o.value===presetShop; });\n" +
    "      if(!found){\n" +
    "        var opt = document.createElement('option');\n" +
    "        opt.value = presetShop; opt.textContent = presetShop;\n" +
    "        shopEl.insertBefore(opt, shopEl.lastElementChild);\n" +
    "      }\n" +
    "      shopEl.value = presetShop;\n" +
    "      enterBtn.click();\n" +
    "    }catch(e){ console.error('T\u1ef1 \u0111i\u1ec1n th\u00f4ng tin Ki\u1ec3m k\u00ea l\u1ed7i:', e); }\n" +
    "  });\n" +
    "})();\n" +
    "<\/script>\n";
  var html = INVENTORY_APP_HTML.replace("<body>", "<body>\n" + earlyUnlock);
  return html.replace("</body>\n</html>", injected + "</body>\n</html>");
}

const INVENTORY_SUBTABS = [
  { id:"scan", label:"Quét mã" },
  { id:"summary", label:"Tổng hợp" },
  { id:"settings", label:"Cài đặt" },
];

function InventoryView({ userName, userShop }){
  // Quản lý không gắn với 1 cửa hàng cố định, nên thay vì hiện lại màn hình chọn cửa hàng kiểu
  // "app con" của Kiểm kê, dùng luôn 1 ô chọn cửa hàng đơn giản, đúng kiểu field/select của app
  // Vận hành & Nhân sự — chọn xong là vào thẳng, không cần bấm thêm nút nào.
  const [manualShop, setManualShop] = useState("");
  const effectiveShop = userShop || manualShop;
  const effectiveName = userShop ? userName : "Quản lý";
  const srcDoc = useMemo(()=> effectiveShop ? buildInventoryHtml(effectiveName, effectiveShop) : "", [effectiveName, effectiveShop]);
  const iframeRef = useRef(null);
  const [subTab, setSubTab] = useState("scan");
  function goToSubView(view){
    setSubTab(view);
    try{
      const win = iframeRef.current && iframeRef.current.contentWindow;
      const btn = win && win.document.querySelector('.nav-btn[data-view="'+view+'"]');
      if(btn) btn.click();
    }catch(e){ console.error("Không chuyển được mục Kiểm kê:", e); }
  }

  if(!effectiveShop){
    return React.createElement("div", { className:"card", style:{ maxWidth:380 } }, [
      React.createElement("div", { key:"t", className:"cardTitle" }, "Chọn cửa hàng để kiểm kê"),
      React.createElement("div", { key:"f", className:"field" }, [
        React.createElement("label", { key:"l" }, "Cửa hàng"),
        React.createElement("select", { key:"s", value:manualShop, onChange:e=>setManualShop(e.target.value) }, [
          React.createElement("option", { key:"__empty__", value:"" }, "— Chọn cửa hàng —"),
          ...DEFAULT_SHOPS.map(s => React.createElement("option", { key:s, value:s }, s)),
        ]),
      ]),
    ]);
  }

  return React.createElement(React.Fragment, null, [
    React.createElement("div", { key:"subnav", className:"btnRow", style:{ marginBottom:12 } },
      INVENTORY_SUBTABS.map(t => React.createElement("button", {
        key:t.id, type:"button",
        className: "btn" + (subTab===t.id ? " btnPrimary" : ""),
        onClick: ()=>goToSubView(t.id),
      }, t.label))
    ),
    React.createElement("iframe", {
      key:"frame", ref:iframeRef,
      title: "Kiểm kê nhà thuốc",
      srcDoc: srcDoc,
      allow: "camera; microphone",
      style: { width:"100%", height:"calc(100vh - 210px)", minHeight:"580px", border:"none", background:"transparent" },
    }),
  ]);
}

const TEMGIA_APP_HTML = "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Upharma \u2014 In tem gi\u00e1 & tem khuy\u1ebfn m\u1ea1i</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Archivo:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<style>\n  :root{\n    --ink:#1A2421;\n    --paper:#FAFAF7;\n    --panel:#FFFFFF;\n    --line:#E4E1D8;\n    --teal:#0D5C4F;\n    --teal-dim:#E4EFEC;\n    --coral:#C8503A;\n    --coral-dim:#F7E7E2;\n    --muted:#6B7280;\n    --gold:#B08A3E;\n    --promo-bg:#F4CB3A;\n    --promo-red:#111111;\n    font-size:16px;\n  }\n  *{box-sizing:border-box;}\n  body{\n    margin:0;\n    font-family:'Be Vietnam Pro', system-ui, sans-serif;\n    background:var(--paper);\n    color:var(--ink);\n  }\n  .app{\n    display:grid;\n    grid-template-columns:380px 1fr;\n    min-height:calc(100vh - 46px);\n  }\n  .tabbar{\n    display:flex; gap:0; background:#fff; border-bottom:1px solid var(--line);\n    padding:0 22px;\n  }\n  .tabbar button{\n    font-family:inherit; font-size:13.5px; font-weight:700; color:var(--muted);\n    background:none; border:none; border-bottom:3px solid transparent;\n    padding:13px 16px; cursor:pointer; display:flex; align-items:center; gap:6px;\n  }\n  .tabbar button.active{ color:var(--teal); border-bottom-color:var(--teal); }\n  .tabbar button:hover{ color:var(--ink); }\n  /* ---------- LEFT PANEL ---------- */\n  .panel{\n    background:var(--panel);\n    border-right:1px solid var(--line);\n    padding:24px 22px 60px;\n    overflow-y:auto;\n    max-height:calc(100vh - 46px);\n  }\n  .brand{\n    display:flex; align-items:baseline; gap:8px; margin-bottom:2px;\n  }\n  .brand .mark{\n    width:10px;height:10px;border-radius:2px;background:var(--teal);\n    display:inline-block;\n  }\n  .brand h1{\n    font-size:15px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; margin:0;\n  }\n  .brand small{color:var(--muted); font-size:12px;}\n  .sub{color:var(--muted); font-size:13px; margin:2px 0 22px 18px;}\n\n  .section{margin-bottom:26px;}\n  .section h2{\n    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);\n    font-weight:700; margin:0 0 10px;\n  }\n\n  .btn{\n    display:inline-flex; align-items:center; justify-content:center; gap:6px;\n    font-family:inherit; font-size:13.5px; font-weight:600;\n    padding:9px 14px; border-radius:7px; border:1px solid var(--line);\n    background:#fff; color:var(--ink); cursor:pointer; width:100%;\n    transition:.12s border-color, .12s background;\n  }\n  .btn:hover{border-color:var(--teal);}\n  .btn-primary{background:var(--teal); border-color:var(--teal); color:#fff;}\n  .btn-primary:hover{background:#0a4a40;}\n  .btn-coral{background:var(--coral); border-color:var(--coral); color:#fff;}\n  .btn-coral:hover{background:#a83f2c;}\n  .btn-ghost{background:transparent;}\n  .btn-row{display:flex; gap:8px;}\n  .btn-sm{padding:6px 10px; font-size:12.5px; width:auto;}\n  input[type=file]{display:none;}\n\n  .field{margin-bottom:12px;}\n  .field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:#374151;}\n  .field input[type=number], .field input[type=text], .field select{\n    width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:6px;\n    font-family:inherit; font-size:13.5px; background:#fff;\n  }\n  .field-row{display:flex; gap:10px;}\n  .field-row .field{flex:1;}\n  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0;}\n  .toggle-row span{font-size:13px; font-weight:500;}\n  .switch{position:relative; width:38px; height:21px; flex:none;}\n  .switch input{opacity:0; width:0; height:0;}\n  .slider{position:absolute; inset:0; background:#D9D6CB; border-radius:20px; cursor:pointer; transition:.15s;}\n  .slider:before{content:\"\";position:absolute; height:15px; width:15px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s;}\n  .switch input:checked + .slider{background:var(--teal);}\n  .switch input:checked + .slider:before{transform:translateX(17px);}\n\n  .rowcount{font-size:12px; color:var(--muted); margin-top:6px;}\n\n  .helptext{font-size:12px; color:var(--muted); line-height:1.5; margin-top:8px;}\n  .helptext a{color:var(--teal); cursor:pointer; font-weight:600; text-decoration:none;}\n\n  /* ---------- MAIN / PREVIEW ---------- */\n  .main{padding:28px 32px 80px; overflow-y:auto; max-height:calc(100vh - 46px);}\n  .topbar{\n    display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;\n  }\n  .topbar h2{font-size:18px; margin:0; font-weight:800;}\n  .topbar .count{font-size:13px; color:var(--muted); margin-top:2px;}\n  .topbar .actions{display:flex; gap:10px;}\n  .topbar .actions .btn{width:auto;}\n\n  .datatable-wrap{\n    background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:30px;\n  }\n  table.data{width:100%; border-collapse:collapse; font-size:12.5px;}\n  table.data th{\n    text-align:left; background:#F5F3EC; padding:9px 10px; font-weight:700; color:#4B5563;\n    border-bottom:1px solid var(--line); white-space:nowrap; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;\n  }\n  table.data td{padding:5px 8px; border-bottom:1px solid #F0EEE6; vertical-align:middle;}\n  table.data tr:last-child td{border-bottom:none;}\n  table.data input, table.data select{\n    width:100%; border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:5px;\n    font-family:inherit; font-size:12.5px;\n  }\n  table.data input:hover, table.data select:hover{border-color:var(--line);}\n  table.data input:focus, table.data select:focus{border-color:var(--teal); background:#fff; outline:none;}\n  table.data .num{text-align:right;}\n  .del-btn{\n    border:none; background:none; color:#B0483A; cursor:pointer; font-size:15px; padding:2px 6px; border-radius:5px;\n  }\n  .del-btn:hover{background:var(--coral-dim);}\n  .pill{\n    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; letter-spacing:.02em;\n  }\n  .pill-km{background:var(--coral-dim); color:var(--coral);}\n  .pill-thuong{background:var(--teal-dim); color:var(--teal);}\n\n  /* ---------- PRINT SHEET ---------- */\n  .sheet{\n    width:210mm; height:297mm; background:#fff; margin:0 auto 24px;\n    box-shadow:0 1px 4px rgba(0,0,0,.15); position:relative;\n  }\n  .sheet-inner{\n    height:100%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(6,1fr);\n  }\n  .sheet-inner.grid-2x5{\n    grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(5,1fr);\n  }\n  .tag{\n    border:1px dashed #C9C5B8; position:relative; overflow:hidden;\n    display:flex; flex-direction:column; background:#fff;\n    -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;\n  }\n  .tag.empty{border-style:dashed; border-color:#EDEBE3;}\n  .tag-top{\n    flex:0 0 auto; display:flex; flex-direction:column; justify-content:center;\n    padding:2.2mm 3.5mm 0;\n  }\n  .tag .store{\n    font-size:10pt; font-weight:800; letter-spacing:.08em; color:#111; text-transform:uppercase; margin-bottom:.9mm;\n  }\n  .tag .name{\n    font-size:10.6pt; font-weight:800; line-height:1.18; color:#111;\n    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:.9mm;\n  }\n  .tag .code{\n    font-family:'Archivo',monospace; font-size:9.2pt; color:#111; letter-spacing:.02em; font-weight:700;\n  }\n  /* ---- price panel: shared block that makes the price the visual anchor ---- */\n  .price-panel{\n    flex:1; background:transparent; color:#111;\n    padding:1.8mm 3.5mm; display:flex; align-items:center; justify-content:center; gap:1.4mm;\n  }\n  .price-panel .price{\n    font-family:'Archivo',sans-serif; font-weight:800; font-size:46pt; line-height:.95; letter-spacing:-.02em; color:#111;\n    display:inline-block; transform:scaleX(.8); transform-origin:center;\n  }\n  .price-panel .unit{font-size:11pt; font-weight:700; opacity:.85;}\n\n  /* ---- promo variant: optimized for black & white printing \u2014 recognition via\n     solid black frame + solid black header bar instead of color ---- */\n  .tag.promo{\n    background:#fff; border:1.3pt solid #000;\n  }\n  .promo-header{\n    display:flex; align-items:center; justify-content:space-between;\n    background:transparent; padding:1.8mm 3mm 1.2mm; margin:0;\n    border-bottom:1.3pt solid #000;\n  }\n  .promo-title{\n    font-size:14.5pt; font-weight:800; color:#000; letter-spacing:.03em; text-transform:uppercase; line-height:1.05;\n  }\n  .tag.promo .badge{\n    background:#fff; color:#000; border:1pt solid #000; font-weight:800; font-size:10pt;\n    padding:.7mm 2.2mm; border-radius:2mm; line-height:1; flex:none;\n  }\n  .tag.promo .tag-top{\n    flex:0 0 auto; padding:.8mm 3mm 0; justify-content:flex-start;\n  }\n  .tag.promo .name{\n    font-size:9.4pt; font-weight:800; text-transform:uppercase; color:#1A1A1A; margin-bottom:0;\n    -webkit-line-clamp:2;\n  }\n  .promo-price-row{\n    flex:1; display:flex; flex-direction:row; align-items:center; justify-content:center;\n    padding:.5mm 3mm; gap:2mm;\n  }\n  .promo-price-row .old-price{\n    font-size:10pt; color:#3A3A3A; text-decoration:line-through; font-weight:600;\n  }\n  .promo-price-row .price-row{display:flex; align-items:center; gap:.4mm;}\n  .promo-price-row .price{\n    font-family:'Archivo',sans-serif; font-weight:800; font-size:33pt; color:var(--promo-red); line-height:.82; letter-spacing:-.01em;\n  }\n  .promo-price-row .unit{font-size:10pt; font-weight:700; color:var(--promo-red); text-transform:lowercase;}\n  .promo-footer{\n    display:flex; align-items:flex-end; justify-content:space-between; gap:2mm;\n    padding:0 3mm 1.8mm;\n  }\n  .promo-footer .code-box{\n    font-family:'Be Vietnam Pro',sans-serif; font-size:9pt; font-weight:700; color:#1A1A1A; flex:none;\n  }\n  .promo-footer .code-box .lbl{font-weight:600; color:#3A3A3A; margin-right:.6mm;}\n  .promo-footer .date-line{\n    font-size:7pt; color:#3A3A3A; text-align:right; line-height:1.3;\n  }\n\n  /* ---------- COMBO TAG ---------- */\n  .tag.combo{ background:#fff; border:1.3pt solid #000; }\n  .combo-header{\n    display:flex; align-items:center; justify-content:center;\n    padding:1.6mm 3mm 1mm; border-bottom:1.3pt solid #000;\n  }\n  .combo-title{ font-size:10.5pt; font-weight:800; color:#000; letter-spacing:.03em; text-transform:uppercase; -webkit-text-stroke:.3px #000; }\n  .combo-body{ flex:0 0 auto; padding:1mm 3mm 0; }\n  .combo-body .name{\n    font-size:9.6pt; font-weight:800; color:#000; line-height:1.15; margin-bottom:.7mm;\n    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;\n  }\n  .combo-items{ font-size:7.3pt; color:#2A2A2A; line-height:1.45; }\n  .combo-items .item-line{ display:flex; justify-content:space-between; gap:2mm; }\n  .combo-items .item-line .ip{ text-decoration:line-through; color:#555; flex:none; }\n  .combo-price-row{\n    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;\n    padding:.5mm 2.5mm; gap:.3mm;\n  }\n  .combo-price-row .price{\n    font-family:'Archivo',sans-serif; font-weight:800; font-size:50pt; color:#000; line-height:.9; letter-spacing:-.01em;\n  }\n  .combo-save{ font-size:7.5pt; font-weight:700; color:#000; margin-top:1.4mm; }\n  .combo-footer{\n    display:flex; align-items:flex-end; justify-content:space-between; gap:2mm;\n    padding:0 3mm 1.6mm; font-size:6.8pt; color:#3A3A3A;\n  }\n\n  /* ---------- GIFT-BY-INVOICE TAG ---------- */\n  .tag.gift{ background:#fff; border:1.3pt solid #000; }\n  .gift-header{\n    padding:1.6mm 3mm 1mm; border-bottom:1.3pt solid #000; text-align:center;\n  }\n  .gift-title{ font-size:11pt; font-weight:800; color:#000; letter-spacing:.05em; text-transform:uppercase; -webkit-text-stroke:.3px #000; }\n  .gift-body{\n    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;\n    padding:1mm 3mm; text-align:center; gap:.3mm;\n  }\n  .gift-label{ font-size:11pt; font-weight:600; color:#333; }\n  .gift-amount{\n    font-family:'Archivo',sans-serif; font-weight:800; font-size:47pt; color:#000; line-height:.95;\n  }\n  .gift-name{\n    font-size:12.5pt; font-weight:800; color:#000; text-transform:uppercase; margin-top:.5mm;\n    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;\n  }\n  .gift-footer{\n    display:flex; align-items:flex-end; justify-content:space-between; gap:2mm;\n    padding:0 3mm 1.6mm; font-size:6.8pt; color:#3A3A3A;\n  }\n  @media print{\n    .panel, .topbar, .datatable-wrap, .no-print{display:none !important;}\n    .app{display:block;}\n    .main{padding:0; overflow:visible; max-height:none;}\n    .sheet-scroll{overflow:visible; margin:0; padding:0;}\n    body{background:#fff;}\n    .sheet{box-shadow:none; margin:0; page-break-after:always;}\n    .sheet:last-child{page-break-after:auto;}\n  }\n  @page{ size:A4; margin:0; }\n\n  .empty-state{\n    text-align:center; padding:60px 20px; color:var(--muted); font-size:13.5px;\n  }\n  .group-label{\n    font-size:13px; font-weight:700; color:var(--ink); background:#F5F3EC; border:1px solid var(--line);\n    border-radius:8px; padding:9px 14px; margin:0 auto 14px; max-width:210mm; text-align:center;\n  }\n\n  /* ---------- RESPONSIVE / MOBILE ---------- */\n  .sheet-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }\n  @media (max-width: 900px){\n    html{ font-size:15px; }\n    .app{ display:block; }\n    .panel{\n      max-height:none; border-right:none; border-bottom:1px solid var(--line);\n      padding:18px 16px 24px;\n    }\n    .main{ max-height:none; padding:18px 14px 60px; }\n    .topbar{ flex-direction:column; align-items:flex-start; gap:10px; }\n    .topbar .actions{ width:100%; }\n    .topbar .actions .btn{ width:100%; }\n    .field-row{ flex-direction:column; gap:0; }\n    .datatable-wrap{ overflow-x:auto; }\n    table.data{ min-width:820px; }\n    table.data#dataTable2{ min-width:960px; }\n    .sheet{\n      margin:0 0 20px; box-shadow:0 1px 6px rgba(0,0,0,.18);\n    }\n    .sheet-scroll{ margin:0 -14px 16px; padding:0 14px; }\n  }\n  @media (max-width: 480px){\n    .brand h1{ font-size:14px; }\n    .btn{ font-size:13px; padding:10px 12px; }\n  }\n\n  /* ---------- IMPORT MODAL ---------- */\n  .modal-overlay{\n    position:fixed; inset:0; background:rgba(26,36,33,.45); display:flex; align-items:center; justify-content:center; z-index:50;\n  }\n  .modal{\n    background:#fff; border-radius:12px; width:560px; max-width:92vw; max-height:86vh; overflow-y:auto;\n    padding:26px 28px 24px;\n  }\n  .modal h3{margin:0 0 4px; font-size:16px; font-weight:800;}\n  .modal p.desc{margin:0 0 18px; font-size:13px; color:var(--muted);}\n  .map-row{display:grid; grid-template-columns:150px 1fr; align-items:center; gap:10px; margin-bottom:10px;}\n  .map-row label{font-size:13px; font-weight:600;}\n  .map-row .req{color:var(--coral); font-weight:700;}\n  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}\n  .modal-actions .btn{width:auto;}\n</style>\n</head>\n<body>\n<div class=\"tabbar no-print\">\n  <button class=\"active\" id=\"tabBtnTag\" onclick=\"switchTab('tag')\">\ud83c\udff7\ufe0f Tem gi\u00e1 / Khuy\u1ebfn m\u1ea1i</button>\n  <button id=\"tabBtnCombo\" onclick=\"switchTab('combo')\">\ud83c\udf81 Tem Combo &amp; Qu\u00e0 t\u1eb7ng</button>\n</div>\n<div class=\"app\">\n\n  <!-- ============ LEFT PANEL ============ -->\n  <div class=\"panel\">\n    <div class=\"brand\"><span class=\"mark\"></span><h1>Upharma</h1></div>\n    <div class=\"sub\">In tem gi\u00e1 &amp; tem khuy\u1ebfn m\u1ea1i</div>\n\n    <div id=\"panelData1\">\n      <div class=\"section\">\n        <h2>D\u1eef li\u1ec7u</h2>\n        <div class=\"btn-row\" style=\"margin-bottom:8px;\">\n          <label class=\"btn btn-primary\" for=\"fileInput\">\ud83d\udce5 Nh\u1eadp Excel / CSV</label>\n          <input type=\"file\" id=\"fileInput\" accept=\".xlsx,.xls,.csv\">\n        </div>\n        <div class=\"btn-row\">\n          <button class=\"btn\" id=\"addRowBtn\">\uff0b Th\u00eam d\u00f2ng tay</button>\n          <button class=\"btn btn-ghost\" id=\"clearBtn\">Xo\u00e1 h\u1ebft</button>\n        </div>\n        <div class=\"rowcount\" id=\"rowCount\">Ch\u01b0a c\u00f3 d\u1eef li\u1ec7u</div>\n        <div class=\"helptext\">Ch\u01b0a c\u00f3 file m\u1eabu? <a id=\"downloadTemplate\">T\u1ea3i file Excel m\u1eabu</a></div>\n      </div>\n    </div>\n\n    <div id=\"panelData2\" style=\"display:none;\">\n      <div class=\"section\">\n        <h2>D\u1eef li\u1ec7u Combo &amp; Qu\u00e0 t\u1eb7ng</h2>\n        <div class=\"btn-row\" style=\"margin-bottom:8px;\">\n          <label class=\"btn btn-primary\" for=\"fileInput2\">\ud83d\udce5 Nh\u1eadp Excel / CSV</label>\n          <input type=\"file\" id=\"fileInput2\" accept=\".xlsx,.xls,.csv\">\n        </div>\n        <div class=\"btn-row\">\n          <button class=\"btn\" id=\"addRowBtnCombo\">\uff0b Th\u00eam combo</button>\n          <button class=\"btn\" id=\"addRowBtnGift\">\uff0b Th\u00eam qu\u00e0 t\u1eb7ng</button>\n        </div>\n        <div class=\"btn-row\" style=\"margin-top:8px;\">\n          <button class=\"btn btn-ghost\" id=\"clearBtn2\">Xo\u00e1 h\u1ebft</button>\n        </div>\n        <div class=\"rowcount\" id=\"rowCount2\">Ch\u01b0a c\u00f3 d\u1eef li\u1ec7u</div>\n        <div class=\"helptext\">Ch\u01b0a c\u00f3 file m\u1eabu? <a id=\"downloadTemplate2\">T\u1ea3i file Excel m\u1eabu</a></div>\n        <div class=\"helptext\">Danh s\u00e1ch s\u1ea3n ph\u1ea9m trong combo nh\u1eadp theo \u0111\u1ecbnh d\u1ea1ng: <b>T\u00ean SP|Gi\u00e1</b>, m\u1ed7i s\u1ea3n ph\u1ea9m c\u00e1ch nhau b\u1eb1ng d\u1ea5u <b>;</b> \u2014 VD: <i>Vitamin C s\u1ee7i|89000; K\u1ebdm Zinc 15mg|65000</i></div>\n      </div>\n    </div>\n\n    <div class=\"section\">\n      <h2>B\u1ed1 c\u1ee5c t\u1edd in (A4 \u00b7 18 tem/t\u1edd)</h2>\n      <div class=\"field-row\">\n        <div class=\"field\">\n          <label>L\u1ec1 trang (mm)</label>\n          <input type=\"number\" id=\"marginInput\" value=\"5\" min=\"0\" max=\"20\" step=\"0.5\">\n        </div>\n        <div class=\"field\">\n          <label>Kho\u1ea3ng c\u00e1ch tem (mm)</label>\n          <input type=\"number\" id=\"gapInput\" value=\"1.5\" min=\"0\" max=\"8\" step=\"0.5\">\n        </div>\n      </div>\n      <div class=\"toggle-row\">\n        <span>Hi\u1ec7n t\u00ean \"UPHARMA\" tr\u00ean tem</span>\n        <label class=\"switch\"><input type=\"checkbox\" id=\"storeToggle\"><span class=\"slider\"></span></label>\n      </div>\n      <div class=\"toggle-row\">\n        <span>\u0110\u01b0\u1eddng vi\u1ec1n c\u1eaft (n\u00e9t \u0111\u1ee9t)</span>\n        <label class=\"switch\"><input type=\"checkbox\" id=\"borderToggle\" checked><span class=\"slider\"></span></label>\n      </div>\n    </div>\n\n    <div class=\"section\">\n      <h2>In</h2>\n      <button class=\"btn btn-coral\" id=\"printBtn\">\ud83d\udda8\ufe0f In tem (Ctrl+P)</button>\n      <div class=\"helptext\">Khi h\u1ed9p tho\u1ea1i in hi\u1ec7n ra, ch\u1ecdn kh\u1ed5 gi\u1ea5y <b>A4</b>, l\u1ec1 <b>None/Kh\u00f4ng</b>, t\u1eaft \"Fit to page\" \u0111\u1ec3 gi\u1eef \u0111\u00fang k\u00edch th\u01b0\u1edbc tem.</div>\n      <div class=\"helptext\">App t\u1ef1 x\u1ebfp <b>tem th\u01b0\u1eddng v\u00e0 tem khuy\u1ebfn m\u1ea1i th\u00e0nh c\u00e1c t\u1edd ri\u00eang bi\u1ec7t</b>. In xong ph\u1ea7n tem th\u01b0\u1eddng (gi\u1ea5y tr\u1eafng) tr\u01b0\u1edbc, sau \u0111\u00f3 n\u1ea1p gi\u1ea5y m\u00e0u v\u00e0ng v\u00e0o khay r\u1ed3i in ti\u1ebfp ph\u1ea7n tem khuy\u1ebfn m\u1ea1i \u2014 c\u00f3 th\u1ec3 ch\u1ecdn kho\u1ea3ng trang c\u1ea7n in trong h\u1ed9p tho\u1ea1i in n\u1ebfu ch\u1ec9 mu\u1ed1n in 1 ph\u1ea7n.</div>\n    </div>\n  </div>\n\n  <!-- ============ MAIN ============ -->\n  <div class=\"main\">\n    <div id=\"tab1Content\">\n      <div class=\"topbar no-print\">\n        <div>\n          <h2>Danh s\u00e1ch s\u1ea3n ph\u1ea9m</h2>\n          <div class=\"count\" id=\"topCount\">0 s\u1ea3n ph\u1ea9m \u00b7 0 t\u1edd A4</div>\n        </div>\n        <div class=\"actions\">\n          <button class=\"btn\" id=\"addRowBtn2\">\uff0b Th\u00eam d\u00f2ng</button>\n        </div>\n      </div>\n\n      <div class=\"datatable-wrap no-print\">\n        <table class=\"data\" id=\"dataTable\">\n          <thead>\n            <tr>\n              <th>Lo\u1ea1i tem</th>\n              <th>M\u00e3 SP</th>\n              <th>T\u00ean s\u1ea3n ph\u1ea9m</th>\n              <th>Gi\u00e1 th\u01b0\u1eddng</th>\n              <th>Gi\u00e1 KM</th>\n              <th>% gi\u1ea3m</th>\n              <th>Ti\u1ec1n gi\u1ea3m</th>\n              <th>T\u1eeb ng\u00e0y</th>\n              <th>\u0110\u1ebfn ng\u00e0y</th>\n              <th></th>\n            </tr>\n          </thead>\n          <tbody id=\"dataTbody\"></tbody>\n        </table>\n      </div>\n\n      <div class=\"sheet-scroll\" id=\"previewArea\"></div>\n    </div>\n\n    <div id=\"tab2Content\" style=\"display:none;\">\n      <div class=\"topbar no-print\">\n        <div>\n          <h2>Danh s\u00e1ch Combo &amp; Qu\u00e0 t\u1eb7ng</h2>\n          <div class=\"count\" id=\"topCount2\">0 ch\u01b0\u01a1ng tr\u00ecnh \u00b7 0 t\u1edd A4</div>\n        </div>\n        <div class=\"actions\">\n          <button class=\"btn\" id=\"addRowBtnCombo2\">\uff0b Th\u00eam combo</button>\n          <button class=\"btn\" id=\"addRowBtnGift2\">\uff0b Th\u00eam qu\u00e0 t\u1eb7ng</button>\n        </div>\n      </div>\n\n      <div class=\"datatable-wrap no-print\">\n        <table class=\"data\" id=\"dataTable2\">\n          <thead>\n            <tr>\n              <th>Lo\u1ea1i</th>\n              <th>M\u00e3</th>\n              <th>T\u00ean combo / M\u00f4 t\u1ea3 CT</th>\n              <th>Danh s\u00e1ch SP (combo)</th>\n              <th>Gi\u00e1 combo</th>\n              <th>Ho\u00e1 \u0111\u01a1n t\u1eeb (qu\u00e0 t\u1eb7ng)</th>\n              <th>Qu\u00e0 t\u1eb7ng</th>\n              <th>T\u1eeb ng\u00e0y</th>\n              <th>\u0110\u1ebfn ng\u00e0y</th>\n              <th></th>\n            </tr>\n          </thead>\n          <tbody id=\"dataTbody2\"></tbody>\n        </table>\n      </div>\n\n      <div class=\"sheet-scroll\" id=\"previewArea2\"></div>\n    </div>\n  </div>\n</div>\n\n<!-- ============ IMPORT MAPPING MODAL ============ -->\n<div class=\"modal-overlay no-print\" id=\"mapModal\" style=\"display:none;\">\n  <div class=\"modal\">\n    <h3>\u00c1nh x\u1ea1 c\u1ed9t d\u1eef li\u1ec7u</h3>\n    <p class=\"desc\">Ch\u1ecdn c\u1ed9t trong file Excel/CSV t\u01b0\u01a1ng \u1ee9ng v\u1edbi t\u1eebng tr\u01b0\u1eddng tr\u00ean tem. C\u00e1c tr\u01b0\u1eddng c\u00f3 <span class=\"req\">*</span> l\u00e0 b\u1eaft bu\u1ed9c.</p>\n    <div id=\"mapFields\"></div>\n    <div class=\"modal-actions\">\n      <button class=\"btn btn-ghost\" id=\"mapCancel\" style=\"width:auto;\">Hu\u1ef7</button>\n      <button class=\"btn btn-primary\" id=\"mapConfirm\" style=\"width:auto;\">Nh\u1eadp d\u1eef li\u1ec7u</button>\n    </div>\n  </div>\n</div>\n\n<script>\n// ---------------- STATE ----------------\nlet rows = []; // {id, type:'thuong'|'km', code, name, price, promoPrice, percent, startDate, endDate}\nlet rowSeq = 1;\nlet importedRaw = null; // parsed rows from file, array of objects (header:value)\nlet importedHeaders = [];\n\nconst FIELD_DEFS = [\n  {key:'code', label:'M\u00e3 s\u1ea3n ph\u1ea9m', required:true},\n  {key:'name', label:'T\u00ean s\u1ea3n ph\u1ea9m', required:true},\n  {key:'price', label:'Gi\u00e1 th\u01b0\u1eddng', required:true},\n  {key:'promoPrice', label:'Gi\u00e1 khuy\u1ebfn m\u1ea1i', required:false},\n  {key:'percent', label:'% gi\u1ea3m gi\u00e1', required:false},\n  {key:'startDate', label:'Ng\u00e0y b\u1eaft \u0111\u1ea7u KM', required:false},\n  {key:'endDate', label:'Ng\u00e0y k\u1ebft th\u00fac KM', required:false},\n  {key:'type', label:'Lo\u1ea1i tem (Th\u01b0\u1eddng/Khuy\u1ebfn m\u1ea1i)', required:false},\n];\n\n// ---- TAB 2: COMBO & QU\u00c0 T\u1eb6NG ----\nlet rows2 = []; // {id, type:'combo'|'gift', code, name, items, comboPrice, minInvoice, giftName, startDate, endDate}\nlet activeTab = 'tag';\nconst FIELD_DEFS2 = [\n  {key:'type', label:'Lo\u1ea1i (Combo/Qu\u00e0 t\u1eb7ng)', required:false},\n  {key:'code', label:'M\u00e3', required:false},\n  {key:'name', label:'T\u00ean combo / M\u00f4 t\u1ea3 CT', required:true},\n  {key:'items', label:'Danh s\u00e1ch SP (combo) \u2014 d\u1ea1ng T\u00ean|Gi\u00e1;T\u00ean|Gi\u00e1', required:false},\n  {key:'comboPrice', label:'Gi\u00e1 combo', required:false},\n  {key:'minInvoice', label:'Ho\u00e1 \u0111\u01a1n t\u1eeb (qu\u00e0 t\u1eb7ng)', required:false},\n  {key:'giftName', label:'Qu\u00e0 t\u1eb7ng', required:false},\n  {key:'startDate', label:'Ng\u00e0y b\u1eaft \u0111\u1ea7u', required:false},\n  {key:'endDate', label:'Ng\u00e0y k\u1ebft th\u00fac', required:false},\n];\nfunction newRow2(data={}){\n  return {\n    id: rowSeq++,\n    type: data.type || 'combo',\n    code: data.code || '',\n    name: data.name || '',\n    items: data.items ?? '',\n    comboPrice: data.comboPrice ?? '',\n    minInvoice: data.minInvoice ?? '',\n    giftName: data.giftName ?? '',\n    startDate: data.startDate ?? '',\n    endDate: data.endDate ?? '',\n  };\n}\nfunction parseItems(str){\n  if(!str) return [];\n  return String(str).split(';').map(s=>s.trim()).filter(Boolean).map(part=>{\n    const [name, price] = part.split('|').map(x=>x?x.trim():'');\n    return { name: name||'', price: toNumber(price) };\n  });\n}\nfunction computeCombo(r){\n  const items = parseItems(r.items);\n  const total = items.length ? items.reduce((sum,it)=> sum + (it.price||0), 0) : null;\n  const comboPrice = toNumber(r.comboPrice);\n  const saving = (total!=null && comboPrice!=null) ? (total - comboPrice) : null;\n  return { items, total, comboPrice, saving };\n}\n\n// ---------------- HELPERS ----------------\nfunction fmtMoney(n){\n  if(n===null||n===undefined||isNaN(n)) return '';\n  return Math.round(n).toLocaleString('vi-VN');\n}\nfunction toNumber(v){\n  if(v===null||v===undefined||v==='') return null;\n  if(typeof v==='number') return v;\n  const cleaned = String(v).replace(/[^\\d.,-]/g,'').replace(/\\./g,'').replace(',', '.');\n  const n = parseFloat(cleaned);\n  return isNaN(n) ? null : n;\n}\nfunction fmtDate(v){\n  if(!v) return '';\n  if(typeof v === 'string') return v;\n  try{\n    const d = new Date(v);\n    if(isNaN(d)) return String(v);\n    return d.toLocaleDateString('vi-VN');\n  }catch(e){ return String(v); }\n}\nfunction computeRow(r){\n  const price = toNumber(r.price);\n  let promoPrice = toNumber(r.promoPrice);\n  let percent = toNumber(r.percent);\n  if(price!=null){\n    if(promoPrice!=null && percent==null){\n      percent = Math.round((price - promoPrice)/price*100);\n    } else if(percent!=null && promoPrice==null){\n      promoPrice = Math.round(price * (1 - percent/100));\n    } else if(promoPrice!=null && percent!=null){\n      // both given, trust both as-is\n    }\n  }\n  const discount = (price!=null && promoPrice!=null) ? (price - promoPrice) : null;\n  return {price, promoPrice, percent, discount};\n}\nfunction newRow(data={}){\n  const r = {\n    id: rowSeq++,\n    type: data.type || (data.promoPrice || data.percent ? 'km' : 'thuong'),\n    code: data.code || '',\n    name: data.name || '',\n    price: data.price ?? '',\n    promoPrice: data.promoPrice ?? '',\n    percent: data.percent ?? '',\n    startDate: data.startDate ?? '',\n    endDate: data.endDate ?? '',\n  };\n  return r;\n}\n\n// ---------------- TABLE RENDER ----------------\nfunction renderTable(){\n  const tbody = document.getElementById('dataTbody');\n  tbody.innerHTML = '';\n  rows.forEach(r=>{\n    const c = computeRow(r);\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      <td>\n        <select data-id=\"${r.id}\" data-field=\"type\">\n          <option value=\"thuong\" ${r.type==='thuong'?'selected':''}>Th\u01b0\u1eddng</option>\n          <option value=\"km\" ${r.type==='km'?'selected':''}>Khuy\u1ebfn m\u1ea1i</option>\n        </select>\n      </td>\n      <td><input data-id=\"${r.id}\" data-field=\"code\" value=\"${r.code}\" style=\"width:80px\"></td>\n      <td><input data-id=\"${r.id}\" data-field=\"name\" value=\"${r.name}\" style=\"min-width:160px\"></td>\n      <td class=\"num\"><input data-id=\"${r.id}\" data-field=\"price\" value=\"${r.price}\" style=\"width:80px;text-align:right\"></td>\n      <td class=\"num\"><input data-id=\"${r.id}\" data-field=\"promoPrice\" value=\"${r.promoPrice}\" style=\"width:80px;text-align:right\"></td>\n      <td class=\"num\"><input data-id=\"${r.id}\" data-field=\"percent\" value=\"${r.percent}\" style=\"width:55px;text-align:right\"></td>\n      <td class=\"num\" style=\"color:#6B7280\">${c.discount!=null ? fmtMoney(c.discount) : ''}</td>\n      <td><input data-id=\"${r.id}\" data-field=\"startDate\" value=\"${r.startDate}\" style=\"width:75px\" placeholder=\"dd/mm/yyyy\"></td>\n      <td><input data-id=\"${r.id}\" data-field=\"endDate\" value=\"${r.endDate}\" style=\"width:75px\" placeholder=\"dd/mm/yyyy\"></td>\n      <td><button class=\"del-btn\" data-id=\"${r.id}\">\u2715</button></td>\n    `;\n    tbody.appendChild(tr);\n  });\n  tbody.querySelectorAll('input,select').forEach(el=>{\n    el.addEventListener('input', onCellEdit);\n    el.addEventListener('change', onCellEdit);\n  });\n  tbody.querySelectorAll('.del-btn').forEach(el=>{\n    el.addEventListener('click', ()=>{\n      rows = rows.filter(r=>r.id != el.dataset.id);\n      renderAll();\n    });\n  });\n  const n = rows.length;\n  const regCount = rows.filter(r=>r.type!=='km').length;\n  const kmCount = rows.filter(r=>r.type==='km').length;\n  const pages = (regCount?Math.ceil(regCount/18):0) + (kmCount?Math.ceil(kmCount/18):0);\n  document.getElementById('rowCount').textContent = n===0 ? 'Ch\u01b0a c\u00f3 d\u1eef li\u1ec7u' : `${n} s\u1ea3n ph\u1ea9m`;\n  document.getElementById('topCount').textContent = `${n} s\u1ea3n ph\u1ea9m \u00b7 ${pages} t\u1edd A4`;\n}\nfunction onCellEdit(e){\n  const id = e.target.dataset.id, field = e.target.dataset.field;\n  const row = rows.find(r=>r.id == id);\n  if(!row) return;\n  row[field] = e.target.value;\n  renderPreview();\n  // update discount column without full rerender (avoid losing focus)\n  const c = computeRow(row);\n  const tr = e.target.closest('tr');\n  tr.children[6].textContent = c.discount!=null ? fmtMoney(c.discount) : '';\n}\n\n// ---------------- PREVIEW RENDER ----------------\nfunction tagHTML(row){\n  if(!row) return `<div class=\"tag empty\"></div>`;\n  const c = computeRow(row);\n  const showStore = document.getElementById('storeToggle').checked;\n  const storeLine = showStore ? `<div class=\"store\">Upharma</div>` : '';\n  if(row.type === 'km' && c.promoPrice!=null){\n    const dateLine = (row.startDate || row.endDate)\n      ? `<div class=\"date-line\">\u00c1p d\u1ee5ng t\u1eeb: ${row.startDate||'\u2026'}<br>\u0111\u1ebfn ${row.endDate||'\u2026'}</div>`\n      : '';\n    const badge = c.percent!=null ? `<div class=\"badge\">-${Math.round(c.percent)}%</div>` : '';\n    return `\n      <div class=\"tag promo\">\n        <div class=\"promo-header\">\n          <div class=\"promo-title\">Khuy\u1ebfn m\u00e3i</div>\n          ${badge}\n        </div>\n        <div class=\"tag-top\">\n          <div class=\"name\">${row.name||''}</div>\n        </div>\n        <div class=\"promo-price-row\">\n          <div class=\"old-price\">${fmtMoney(c.price)}\u0111</div>\n          <div class=\"price-row\"><span class=\"price\">${fmtMoney(c.promoPrice)}</span></div>\n        </div>\n        <div class=\"promo-footer\">\n          <div class=\"code-box\"><span class=\"lbl\">M\u00e3 SP:</span>${row.code||''}</div>\n          ${dateLine}\n        </div>\n      </div>`;\n  }\n  return `\n    <div class=\"tag\">\n      <div class=\"tag-top\">\n        ${storeLine}\n        <div class=\"name\">${row.name||''}</div>\n        <div class=\"code\">M\u00e3 SP: ${row.code||''}</div>\n      </div>\n      <div class=\"price-panel\">\n        <span class=\"price\">${fmtMoney(c.price)}</span>\n      </div>\n    </div>`;\n}\nfunction renderPreview(){\n  const area = document.getElementById('previewArea');\n  const margin = parseFloat(document.getElementById('marginInput').value)||0;\n  const gap = parseFloat(document.getElementById('gapInput').value)||0;\n  const borderOn = document.getElementById('borderToggle').checked;\n\n  document.documentElement.style.setProperty('--sheet-margin', margin+'mm');\n\n  if(rows.length===0){\n    area.innerHTML = `<div class=\"empty-state\">Ch\u01b0a c\u00f3 s\u1ea3n ph\u1ea9m n\u00e0o. Nh\u1eadp file Excel ho\u1eb7c th\u00eam d\u00f2ng \u0111\u1ec3 xem tr\u01b0\u1edbc tem.</div>`;\n    return;\n  }\n\n  const regularRows = rows.filter(r=>r.type!=='km');\n  const promoRows = rows.filter(r=>r.type==='km');\n\n  function chunk18(list){\n    const pages = [];\n    for(let i=0;i<list.length;i+=18) pages.push(list.slice(i,i+18));\n    return pages;\n  }\n  function sheetHTML(pageRows){\n    const cells = [];\n    for(let i=0;i<18;i++) cells.push(tagHTML(pageRows[i]));\n    return `<div class=\"sheet\" style=\"padding:${margin}mm;\">\n      <div class=\"sheet-inner\" style=\"gap:${gap}mm;\">${cells.join('')}</div>\n    </div>`;\n  }\n  function groupLabel(text, count){\n    return `<div class=\"group-label no-print\">${text} \u2014 ${count} s\u1ea3n ph\u1ea9m</div>`;\n  }\n\n  let html = '';\n  const regularPages = chunk18(regularRows);\n  const promoPages = chunk18(promoRows);\n\n  if(regularPages.length){\n    html += groupLabel('\ud83e\uddfe Tem gi\u00e1 th\u01b0\u1eddng \u2014 in tr\u00ean gi\u1ea5y tr\u1eafng b\u00ecnh th\u01b0\u1eddng', regularRows.length);\n    html += regularPages.map(sheetHTML).join('');\n  }\n  if(promoPages.length){\n    html += groupLabel('\ud83d\udfe8 Tem khuy\u1ebfn m\u1ea1i \u2014 \u0111\u1ed5i sang gi\u1ea5y m\u00e0u v\u00e0ng tr\u01b0\u1edbc khi in ph\u1ea7n n\u00e0y', promoRows.length);\n    html += promoPages.map(sheetHTML).join('');\n  }\n  area.innerHTML = html;\n\n  // border toggle\n  document.querySelectorAll('.tag').forEach(t=>{\n    if(t.classList.contains('promo')) return; // promo tag keeps its solid black frame always\n    t.style.borderStyle = borderOn ? 'dashed' : 'none';\n  });\n}\nfunction renderAll(){ renderTable(); renderPreview(); }\n\n// ================= TAB 2: COMBO & QU\u00c0 T\u1eb6NG =================\nfunction renderTable2(){\n  const tbody = document.getElementById('dataTbody2');\n  tbody.innerHTML = '';\n  rows2.forEach(r=>{\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      <td>\n        <select data-id2=\"${r.id}\" data-field=\"type\">\n          <option value=\"combo\" ${r.type==='combo'?'selected':''}>Combo</option>\n          <option value=\"gift\" ${r.type==='gift'?'selected':''}>Qu\u00e0 t\u1eb7ng</option>\n        </select>\n      </td>\n      <td><input data-id2=\"${r.id}\" data-field=\"code\" value=\"${r.code}\" style=\"width:70px\"></td>\n      <td><input data-id2=\"${r.id}\" data-field=\"name\" value=\"${r.name}\" style=\"min-width:150px\"></td>\n      <td><input data-id2=\"${r.id}\" data-field=\"items\" value=\"${r.items}\" style=\"min-width:220px\" placeholder=\"T\u00ean SP|Gi\u00e1; T\u00ean SP|Gi\u00e1\"></td>\n      <td class=\"num\"><input data-id2=\"${r.id}\" data-field=\"comboPrice\" value=\"${r.comboPrice}\" style=\"width:80px;text-align:right\"></td>\n      <td class=\"num\"><input data-id2=\"${r.id}\" data-field=\"minInvoice\" value=\"${r.minInvoice}\" style=\"width:80px;text-align:right\"></td>\n      <td><input data-id2=\"${r.id}\" data-field=\"giftName\" value=\"${r.giftName}\" style=\"min-width:120px\"></td>\n      <td><input data-id2=\"${r.id}\" data-field=\"startDate\" value=\"${r.startDate}\" style=\"width:75px\" placeholder=\"dd/mm/yyyy\"></td>\n      <td><input data-id2=\"${r.id}\" data-field=\"endDate\" value=\"${r.endDate}\" style=\"width:75px\" placeholder=\"dd/mm/yyyy\"></td>\n      <td><button class=\"del-btn\" data-id2=\"${r.id}\">\u2715</button></td>\n    `;\n    tbody.appendChild(tr);\n  });\n  tbody.querySelectorAll('input,select').forEach(el=>{\n    el.addEventListener('input', onCellEdit2);\n    el.addEventListener('change', onCellEdit2);\n  });\n  tbody.querySelectorAll('.del-btn').forEach(el=>{\n    el.addEventListener('click', ()=>{\n      rows2 = rows2.filter(r=>r.id != el.dataset.id2);\n      renderAll2();\n    });\n  });\n  const n = rows2.length;\n  const comboCount = rows2.filter(r=>r.type==='combo').length;\n  const giftCount = rows2.filter(r=>r.type==='gift').length;\n  const pages = (comboCount?Math.ceil(comboCount/10):0) + (giftCount?Math.ceil(giftCount/10):0);\n  document.getElementById('rowCount2').textContent = n===0 ? 'Ch\u01b0a c\u00f3 d\u1eef li\u1ec7u' : `${n} ch\u01b0\u01a1ng tr\u00ecnh`;\n  document.getElementById('topCount2').textContent = `${n} ch\u01b0\u01a1ng tr\u00ecnh \u00b7 ${pages} t\u1edd A4`;\n}\nfunction onCellEdit2(e){\n  const id = e.target.dataset.id2, field = e.target.dataset.field;\n  const row = rows2.find(r=>r.id == id);\n  if(!row) return;\n  row[field] = e.target.value;\n  renderPreview2();\n}\nfunction tagHTML2(row){\n  if(!row) return `<div class=\"tag empty\"></div>`;\n  if(row.type === 'gift'){\n    const dateLine = (row.startDate || row.endDate)\n      ? `<div>\u00c1p d\u1ee5ng: ${row.startDate||'\u2026'} \u2013 ${row.endDate||'\u2026'}</div>`\n      : '';\n    return `\n      <div class=\"tag gift\">\n        <div class=\"gift-header\"><div class=\"gift-title\">Qu\u00e0 t\u1eb7ng ho\u00e1 \u0111\u01a1n</div></div>\n        <div class=\"gift-body\">\n          <div class=\"gift-label\">Ho\u00e1 \u0111\u01a1n t\u1eeb</div>\n          <div class=\"gift-amount\">${fmtMoney(toNumber(row.minInvoice))}</div>\n          <div class=\"gift-label\">t\u1eb7ng ngay</div>\n          <div class=\"gift-name\">${row.giftName||''}</div>\n        </div>\n        <div class=\"gift-footer\" style=\"justify-content:center;\">\n          ${dateLine}\n        </div>\n      </div>`;\n  }\n  // combo\n  const c = computeCombo(row);\n  const itemLines = c.items.map(it=>`<div class=\"item-line\"><span>${it.name}</span><span class=\"ip\">${it.price!=null?fmtMoney(it.price)+'\u0111':''}</span></div>`).join('');\n  const saveLine = c.saving!=null ? `<div class=\"combo-save\">Ti\u1ebft ki\u1ec7m ${fmtMoney(c.saving)}\u0111</div>` : '';\n  const dateLine = (row.startDate || row.endDate)\n    ? `<div>${row.startDate||'\u2026'} \u2013 ${row.endDate||'\u2026'}</div>` : '';\n  return `\n    <div class=\"tag combo\">\n      <div class=\"combo-header\"><div class=\"combo-title\">Combo \u01b0u \u0111\u00e3i</div></div>\n      <div class=\"combo-body\">\n        <div class=\"name\">${row.name||''}</div>\n        <div class=\"combo-items\">${itemLines}</div>\n      </div>\n      <div class=\"combo-price-row\">\n        <div class=\"price\">${fmtMoney(c.comboPrice)}</div>\n        ${saveLine}\n      </div>\n      <div class=\"combo-footer\" style=\"justify-content:center;\">\n        ${dateLine}\n      </div>\n    </div>`;\n}\nfunction renderPreview2(){\n  const area = document.getElementById('previewArea2');\n  const margin = parseFloat(document.getElementById('marginInput').value)||0;\n  const gap = parseFloat(document.getElementById('gapInput').value)||0;\n\n  if(rows2.length===0){\n    area.innerHTML = `<div class=\"empty-state\">Ch\u01b0a c\u00f3 combo / ch\u01b0\u01a1ng tr\u00ecnh qu\u00e0 t\u1eb7ng n\u00e0o. Nh\u1eadp file Excel ho\u1eb7c th\u00eam d\u00f2ng \u0111\u1ec3 xem tr\u01b0\u1edbc tem.</div>`;\n    return;\n  }\n  const comboRows = rows2.filter(r=>r.type==='combo');\n  const giftRows = rows2.filter(r=>r.type==='gift');\n  function chunkN(list, n){\n    const pages = [];\n    for(let i=0;i<list.length;i+=n) pages.push(list.slice(i,i+n));\n    return pages;\n  }\n  function sheetHTML(pageRows, perPage, gridClass){\n    const cells = [];\n    for(let i=0;i<perPage;i++) cells.push(tagHTML2(pageRows[i]));\n    return `<div class=\"sheet\" style=\"padding:${margin}mm;\">\n      <div class=\"sheet-inner ${gridClass||''}\" style=\"gap:${gap}mm;\">${cells.join('')}</div>\n    </div>`;\n  }\n  function groupLabel(text, count){\n    return `<div class=\"group-label no-print\">${text} \u2014 ${count} ch\u01b0\u01a1ng tr\u00ecnh</div>`;\n  }\n  let html = '';\n  const comboPages = chunkN(comboRows, 10);\n  const giftPages = chunkN(giftRows, 10);\n  if(comboPages.length){\n    html += groupLabel('\ud83c\udf81 Tem combo \u2014 kh\u1ed5 A4, 2 tem m\u1ed7i d\u00f2ng (10 tem/t\u1edd)', comboRows.length);\n    html += comboPages.map(p=>sheetHTML(p, 10, 'grid-2x5')).join('');\n  }\n  if(giftPages.length){\n    html += groupLabel('\ud83e\udde7 Tem qu\u00e0 t\u1eb7ng theo ho\u00e1 \u0111\u01a1n \u2014 kh\u1ed5 A4, 2 tem m\u1ed7i d\u00f2ng (10 tem/t\u1edd)', giftRows.length);\n    html += giftPages.map(p=>sheetHTML(p, 10, 'grid-2x5')).join('');\n  }\n  area.innerHTML = html;\n}\nfunction renderAll2(){ renderTable2(); renderPreview2(); }\n\n// ---- tab switching ----\nfunction switchTab(name){\n  activeTab = name;\n  document.getElementById('tabBtnTag').classList.toggle('active', name==='tag');\n  document.getElementById('tabBtnCombo').classList.toggle('active', name==='combo');\n  document.getElementById('panelData1').style.display = name=== ', (e)=>{\n  const file = e.target.files[0];\n  if(!file) return;\n  const reader = new FileReader();\n  reader.onload = (evt)=>{\n    const data = new Uint8Array(evt.target.result);\n    const wb = XLSX.read(data, {type:'array', cellDates:true});\n    const firstSheet = wb.Sheets[wb.SheetNames[0]];\n    const json = XLSX.utils.sheet_to_json(firstSheet, {defval:''});\n    if(json.length===0){ alert('Kh\u00f4ng \u0111\u1ecdc \u0111\u01b0\u1ee3c d\u1eef li\u1ec7u t\u1eeb file.'); return; }\n    importedRaw2 = json;\n    importedHeaders2 = Object.keys(json[0]);\n    openMapModal2();\n  };\n  reader.readAsArrayBuffer(file);\n  e.target.value = '';\n});\nfunction guessHeader2(fieldKey){\n  const guesses = {\n    type:['lo\u1ea1i','loai','type'],\n    code:['m\u00e3','ma','code'],\n    name:['t\u00ean combo','ten combo','m\u00f4 t\u1ea3','mo ta','t\u00ean','name'],\n    items:['danh s\u00e1ch sp','danh sach sp','s\u1ea3n ph\u1ea9m trong combo','items'],\n    comboPrice:['gi\u00e1 combo','gia combo','combo price'],\n    minInvoice:['ho\u00e1 \u0111\u01a1n','hoa don','minimum','t\u1ed1i thi\u1ec3u'],\n    giftName:['qu\u00e0 t\u1eb7ng','qua tang','gift'],\n    startDate:['ng\u00e0y b\u1eaft \u0111\u1ea7u','tu ngay','t\u1eeb ng\u00e0y','start'],\n    endDate:['ng\u00e0y k\u1ebft th\u00fac','den ngay','\u0111\u1ebfn ng\u00e0y','end'],\n  };\n  const list = guesses[fieldKey]||[];\n  return importedHeaders2.find(h => list.some(g => h.toLowerCase().trim().includes(g))) || '';\n}\nfunction openMapModal2(){\n  const wrap = document.getElementById('mapFields');\n  wrap.innerHTML = FIELD_DEFS2.map(f=>{\n    const guess = guessHeader2(f.key);\n    const opts = ['<option value=\"\">\u2014 Kh\u00f4ng d\u00f9ng \u2014</option>']\n      .concat(importedHeaders2.map(h=>`<option value=\"${h}\" ${h===guess?'selected':''}>${h}</option>`));\n    return `<div class=\"map-row\">\n      <label>${f.label}${f.required?' <span class=\"req\">*</span>':''}</label>\n      <select data-field=\"${f.key}\">${opts.join('')}</select>\n    </div>`;\n  }).join('');\n  document.getElementById('mapModal').dataset.target = 'tab2';\n  document.getElementById('mapModal').style.display = 'flex';\n}\n\n// ---------------- ADD / CLEAR ----------------\ndocument.getElementById('addRowBtn').addEventListener('click', ()=>{ rows.push(newRow()); renderAll(); });\ndocument.getElementById('addRowBtn2').addEventListener('click', ()=>{ rows.push(newRow()); renderAll(); });\ndocument.getElementById('clearBtn').addEventListener('click', ()=>{\n  if(rows.length && !confirm('Xo\u00e1 to\u00e0n b\u1ed9 danh s\u00e1ch hi\u1ec7n t\u1ea1i?')) return;\n  rows = []; renderAll();\n});\n['marginInput','gapInput','storeToggle','borderToggle'].forEach(id=>{\n  document.getElementById(id).addEventListener('input', renderPreview);\n});\ndocument.getElementById('printBtn').addEventListener('click', ()=> window.print());\n\n// ---------------- TEMPLATE DOWNLOAD ----------------\ndocument.getElementById('downloadTemplate').addEventListener('click', ()=>{\n  const wsData = [\n    ['M\u00e3 SP','T\u00ean s\u1ea3n ph\u1ea9m','Lo\u1ea1i tem','Gi\u00e1 th\u01b0\u1eddng','Gi\u00e1 khuy\u1ebfn m\u1ea1i','% gi\u1ea3m gi\u00e1','Ng\u00e0y b\u1eaft \u0111\u1ea7u','Ng\u00e0y k\u1ebft th\u00fac'],\n    ['SP001','Paracetamol 500mg h\u1ed9p 10 v\u1ec9','Th\u01b0\u1eddng',35000,'','','',''],\n    ['SP002','Vitamin C s\u1ee7i 1000mg','Khuy\u1ebfn m\u1ea1i',89000,69000,'','01/08/2026','31/08/2026'],\n    ['SP003','D\u1ea7u g\u1ed9i d\u01b0\u1ee3c li\u1ec7u 400ml','Khuy\u1ebfn m\u1ea1i',125000,'',20,'01/08/2026','15/08/2026'],\n    ['SP004','Kh\u1ea9u trang y t\u1ebf h\u1ed9p 50 c\u00e1i','Th\u01b0\u1eddng',45000,'','','',''],\n  ];\n  const ws = XLSX.utils.aoa_to_sheet(wsData);\n  const wb = XLSX.utils.book_new();\n  XLSX.utils.book_append_sheet(wb, ws, 'Mau_tem');\n  XLSX.writeFile(wb, 'mau_du_lieu_tem.xlsx');\n});\n\n// ---------------- IMPORT FILE ----------------\ndocument.getElementById('fileInput').addEventListener tion>`));\n    return `<div class=\"map-row\">\n      <label>${f.label}${f.required?' <span class=\"req\">*</span>':''}</label>\n      <select data-field=\"${f.key}\">${opts.join('')}</select>\n    </div>`;\n  }).join('');\n  document.getElementById('mapModal').dataset.target = 'tab1';\n  document.getElementById('mapModal').style.display = 'flex';\n}\ndocument.getElementById('mapCancel').addEventListener('click', ()=>{\n  document.getElementById('mapModal').style.display = 'none';\n});\ndocument.getElementById('mapConfirm').addEventListener('click', ()=>{\n  const target = document.getElementById('mapModal').dataset.target;\n  const selects = document.querySelectorAll('#mapFields select');\n  const mapping = {};\n  selects.forEach(s=> mapping[s.dataset.field] = s.value);\n\n  if(target === 'tab2'){\n    if(!mapping.name){\n      alert('Vui l\u00f2ng \u00e1nh x\u1ea1 tr\u01b0\u1eddng b\u1eaft bu\u1ed9c: T\u00ean combo / M\u00f4 t\u1ea3 CT.');\n      return;\n    }\n    const newRows2 = importedRaw2.map(raw=>{\n      const get = (k)=> mapping[k] ? raw[mapping[k]] : '';\n      let explicitType = 'combo';\n      const v = String(get('type')||'').toLowerCase();\n      if(v.includes('qu\u00e0') || v.includes('qua') || v.includes('gift')) explicitType = 'gift';\n      else if(v.includes('combo')) explicitType = 'combo';\n      else if(!mapping.type){\n        // no type column mapped \u2014 infer from which fields are filled\n        if(get('minInvoice') || get('giftName')) explicitType = 'gift';\n      }\n      return newRow2({\n        type: explicitType,\n        code: String(get('code')||'').trim(),\n        name: String(get('name')||'').trim(),\n        items: mapping.items ? String(get('items')||'').trim() : '',\n        comboPrice: mapping.comboPrice ? toNumber(get('comboPrice')) : '',\n        minInvoice: mapping.minInvoice ? toNumber(get('minInvoice')) : '',\n        giftName: mapping.giftName ? String(get('giftName')||'').trim() : '',\n        startDate: mapping. function buildTemGiaHtml(){
  // App gốc được thiết kế giả định chiếm trọn 100vh (panel/main tự cuộn bên trong). Khi nhúng
  // vào 1 khung có chiều cao cố định, việc này tạo ra 2 thanh cuộn lồng nhau (trang chính + bên
  // trong khung) khiến bảng dữ liệu bị cắt bớt, khó dùng. Ở đây chỉ cần tắt hẳn cuộn nội bộ —
  // việc đo & tự giãn chiều cao khung làm ở phía component TemGiaView bên ngoài (đáng tin cậy
  // hơn cách cũ là gửi tin nhắn từ bên trong ra, vì bắt được cả các thay đổi do thêm dòng, tải
  // font web xong đổi cỡ chữ, thêm ảnh xem trước...).
  var injected =
    "<style>\n" +
    "  html, body{ height:auto !important; }\n" +
    "  .panel{ max-height:none !important; overflow-y:visible !important; }\n" +
    "  .main{ max-height:none !important; overflow-y:visible !important; }\n" +
    // Bảng dữ liệu bị .datatable-wrap{overflow:hidden} cắt cứng các cột bên phải (Từ ngày, Đến
    // ngày...) trên màn hình lớn — CSS gốc chỉ bật cuộn ngang ở khung nhỏ (@media max-width:900px).
    // Bật cuộn ngang luôn ở mọi kích thước và đặt bề rộng tối thiểu cho bảng để không bị bóp cột.
    "  .datatable-wrap{ overflow-x:auto !important; overflow-y:visible !important; }\n" +
    "  table.data{ min-width:900px; }\n" +
    "  table.data#dataTable2{ min-width:1020px; }\n" +
    "<\/style>\n";
  return TEMGIA_APP_HTML.replace("</body>\n</html>", injected + "</body>\n</html>");
}
function TemGiaView(){
  const [height, setHeight] = useState(2200);
  const srcDoc = useMemo(()=> buildTemGiaHtml(), []);
  const iframeRef = useRef(null);
  useEffect(()=>{
    let ro = null;
    let cancelled = false;
    let timers = [];
    function measure(){
      try{
        const win = iframeRef.current && iframeRef.current.contentWindow;
        const doc = win && win.document;
        if(!doc || !doc.documentElement) return;
        const h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0) + 30;
        if(h > 0) setHeight(prev => Math.max(prev, h));
      }catch(e){ /* ignore — đo lại ở lần sau */ }
    }
    function onLoad(){
      if(cancelled) return;
      measure();
      try{
        const doc = iframeRef.current.contentWindow.document;
        if(window.ResizeObserver && doc.documentElement){
          ro = new ResizeObserver(()=> measure());
          ro.observe(doc.documentElement);
        }
      }catch(e){}
      // Bắt các thay đổi trễ (web font tải xong đổi cỡ chữ, ảnh xem trước load xong...)
      [200, 500, 1000, 2000].forEach(ms => timers.push(setTimeout(measure, ms)));
    }
    const el = iframeRef.current;
    if(el) el.addEventListener("load", onLoad);
    return ()=>{
      cancelled = true;
      if(el) el.removeEventListener("load", onLoad);
      if(ro) ro.disconnect();
      timers.forEach(t => clearTimeout(t));
    };
  }, [srcDoc]);
  return React.createElement("iframe", {
    ref: iframeRef,
    title: "In tem giá & tem khuyến mại",
    srcDoc: srcDoc,
    style: { width:"100%", height: height + "px", border:"none", background:"transparent", display:"block" },
  });
}

              renderTabIcon(t.id, 26, { key:"svg" }),
              unreadCount[t.id]>0 && React.createElement("span", { key:"badge", className:"mobileTileBadge", style:{ color:style.color } }, unreadCount[t.id]>99 ? "99+" : unreadCount[t.id]),
            ]),
            React.createElement("span", { key:"l", className:"mobileTileLabel" }, t.label),
          ]);
        })
      ),
      // ===== Thanh quay lại Trang chủ — chỉ hiện trên điện thoại khi đang xem 1 tab cụ thể =====
      React.createElement("div", { key:"backbar", className:"mobileBackBar" + (!showMobileHome ? " isShown" : ""), onClick:()=>setShowMobileHome(true) }, [
        React.createElement("span", { key:"a", className:"arrow" }, "‹"),
        React.createElement("span", { key:"l" }, activeTabInfo ? activeTabInfo.label : "Trang chủ"),
      ]),
      React.createElement(TaskLiveNotifier, { key:"livenotify", myStaff, isAdmin }),
      !isAdmin && React.createElement(TaskReminderBanner, { key:"reminder", myStaff, onOpenTasks:()=>setActiveTab("tasks") }),
      !isAdmin && React.createElement(CustomerOrderReminderBanner, { key:"custreminder", myStaff, onOpen:()=>setActiveTab("customerOrders") }),
      React.createElement("div", { key:"wrap", className:"wrap mobileContentArea" + (showMobileHome ? " isHiddenMobile" : "") }, [
        activeTab==="checklist" && React.createElement(DailyChecklistView, { key:"v", isAdmin, myStaff }),
        activeTab==="photos" && React.createElement(ImageReportView, { key:"v", isAdmin, myStaff }),
        activeTab==="inventory" && React.createElement(InventoryView, { key:"v", userName: (myStaff && myStaff.name) || "", userShop: (myStaff && myStaff.shop) || "" }),
        activeTab==="customerOrders" && React.createElement(CustomerOrderView, { key:"v", isAdmin, myStaff }),
        activeTab==="sales" && React.createElement(SalesReportView, { key:"v", isAdmin, myStaff }),
        activeTab==="weekly" && React.createElement(WeeklyReportView, { key:"v", isAdmin, myStaff }),
        activeTab==="tasks" && React.createElement(TaskAssignView, { key:"v", isAdmin, myStaff }),
        activeTab==="kpi" && React.createElement(KpiView, { key:"v", isAdmin, myStaff }),
        activeTab==="performance" && isAdmin && React.createElement(PerformanceView, { key:"v" }),
        activeTab==="training" && React.createElement(TrainingView, { key:"v", isAdmin, myStaff }),
        activeTab==="kudos" && React.createElement(KudosView, { key:"v", isAdmin, myStaff }),
        activeTab==="staff" && isAdmin && React.createElement(StaffView, { key:"v" }),
        activeTab==="temgia" && React.createElement(TemGiaView, { key:"v" }),
      ]),
    ]),
  ]);
}

function App(){
  const [authState, setAuthState] = useState({ status:"loading" }); // loading | out | in
  const [staff, setStaff] = useState([]);
  const [staffLoaded, setStaffLoaded] = useState(false);
  const [, setShopTick] = useState(0);

  useEffect(()=>{
    const unsub = auth.onAuthStateChanged(user => {
      setAuthState(user ? { status:"in", user } : { status:"out" });
    });
    return unsub;
  }, []);

  // Danh sách cửa hàng giờ có thể chỉnh trực tiếp trong app (tab Nhân viên → Quản lý cửa hàng)
  // thay vì cố định trong code — cập nhật mảng DEFAULT_SHOPS tại chỗ rồi ép toàn app render lại.
  useEffect(()=>{
    const unsub = subscribeConfigDoc("shopList", (d) => {
      if(d && Array.isArray(d.shops) && d.shops.length>0){
        DEFAULT_SHOPS.length = 0;
        DEFAULT_SHOPS.push(...d.shops);
        setShopTick(n=>n+1);
      }
    });
    return unsub;
  }, []);

  useEffect(()=>{
    if(authState.status!=="in") return;
    const isAdmin = ADMIN_EMAILS.includes(authState.user.email);
    if(isAdmin){ setStaffLoaded(true); return; } // admin không cần danh sách staff để vào app
    const unsub = subscribeCol("staff", rows => { setStaff(rows); setStaffLoaded(true); });
    return unsub;
  }, [authState.status, authState.user && authState.user.uid]);

  if(authState.status==="loading") return React.createElement("div", { style:{ padding:40, textAlign:"center", color:"var(--inkSoft)" } }, "Đang tải...");
  if(authState.status==="out") return React.createElement(LoginScreen, null);

  const user = authState.user;
  const isAdmin = ADMIN_EMAILS.includes(user.email);
  if(!isAdmin && !staffLoaded) return React.createElement("div", { style:{ padding:40, textAlign:"center", color:"var(--inkSoft)" } }, "Đang tải...");
  const myStaff = isAdmin ? null : staff.find(s => s.uid===user.uid);
  if(!isAdmin && !myStaff) return React.createElement(NoStaffLinkedScreen, { user });
  return React.createElement(Dashboard, { user, isAdmin, myStaff });
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>
</body>
</html>
