function daysBetween(a, b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000); }

// ================= FIRESTORE HELPERS =================
function subscribeCol(name, cb, orderField){
  let q = db.collection(name);
  if(orderField) q = q.orderBy(orderField, "desc");
  return q.onSnapshot(snap => cb(snap.docs.map(d => ({ id:d.id, ...d.data() }))), err => console.error(name, err));
}
async function addDoc(name, data){ return db.collection(name).add({ ...data, createdAtTs: firebase.firestore.FieldValue.serverTimestamp() }); }
async function updateDoc(name, id, data){ return db.collection(name).doc(id).update(data); }
async function deleteDoc(name, id){ return db.collection(name).doc(id).delete(); }
function subscribeConfigDoc(docId, cb){
  return db.collection("opsConfig").doc(docId).onSnapshot(doc => cb(doc.exists ? doc.data() : {}));
}
async function saveConfigDoc(docId, data){
  return db.collection("opsConfig").doc(docId).set(data, { merge:false });
}

// ================= MODULE 1: ĐẶT HÀNG & NHẬN HÀNG =================
function orderStatus(o){
  const today = todayISO();
  if(o.ngayNhanThucTe){
    const diff = daysBetween(o.ngayHenGiao, o.ngayNhanThucTe);
    if(diff > 0) return { text:`Về trễ ${diff} ngày`, tone:"warn" };
    return { text:"Đã nhận đúng/sớm hẹn", tone:"good" };
  }
  const diffToday = daysBetween(o.ngayHenGiao, today);
  if(diffToday > 0) return { text:`Quá hẹn ${diffToday} ngày, chưa nhận`, tone:"warn" };
  if(diffToday === 0) return { text:"Hẹn giao hôm nay", tone:"warn" };
  return { text:`Còn ${Math.abs(diffToday)} ngày tới hẹn`, tone:"neutral" };
}
function supplyStatus(o){
  if(!o.nhuCau) return null;
  const nhan = o.ngayNhanThucTe ? (o.slNhanThucTe||0) : (o.slDat||0);
  const diff = nhan - o.nhuCau;
  if(diff < 0) return { text:`Thiếu ${Math.abs(diff)} so với nhu cầu`, tone:"warn" };
  if(diff > 0) return { text:`Dư ${diff} so với nhu cầu`, tone:"neutral" };
  return { text:"Đủ nhu cầu", tone:"good" };
}
const TONE_COLOR = {
  warn:{ fg:"var(--clay)", bg:"var(--claySoft)" }, good:{ fg:"var(--pine)", bg:"var(--pineSoft)" }, neutral:{ fg:"var(--inkSoft)", bg:"#F0EEE2" },
};
function StatusPill(text, tone){
  const c = TONE_COLOR[tone] || TONE_COLOR.neutral;
  return React.createElement("span", { className:"pill", style:{ color:c.fg, background:c.bg } }, text);
}
