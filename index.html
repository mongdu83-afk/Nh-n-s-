<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #FBE7D4; color: #20241F; }
  button { cursor: pointer; font-family: inherit; }
  select, input { font-family: inherit; }
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 20px !important; border: none !important; }
    .no-print { display: none !important; }
    #print-area input, #print-area select, #print-area textarea { border: none !important; background: transparent !important; padding: 2px 0 !important; }
  }

  /* ---- Các class dùng cho "Kế hoạch tuần" — theo format của app Nhân sự (Ops) ---- */
  :root{
    --wpInk:#20241F; --wpInkSoft:#5B5A50; --wpPaper:#F7F4EC; --wpLine:#E4DFD1;
    --wpPine:#2E8B4F; --wpClay:#A8483C;
  }
  .card{ background:#fff; border:1px solid var(--wpLine); border-radius:12px; padding:16px 18px; }
  .btn{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:9px 15px; border-radius:8px; border:1px solid var(--wpLine); background:#fff; color:var(--wpInk); cursor:pointer; }
  .btn:hover{ border-color:var(--wpPine); }
  .weeklyCatBlock{ margin-bottom:20px; }
  .weeklyCatTitle{ font-weight:700; font-size:13.5px; margin-bottom:9px; color:var(--wpInk); display:flex; align-items:center; gap:8px; }
  .weeklyCatTitle .dot{ width:8px; height:8px; border-radius:50%; background:var(--wpPine); flex:none; }
  .weeklyRow{ border:1px solid var(--wpLine); border-radius:10px; padding:10px 12px; margin-bottom:8px; background:#fff; }
  .weeklyRowGrid{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .weeklyRowGrid > div{ flex:1 1 220px; min-width:0; }
  .weeklyRowLbl{ font-size:11px; font-weight:600; color:var(--wpInkSoft); margin-bottom:4px; display:block; }
  .weeklyRowRemove{ border:none; background:none; color:var(--wpClay); cursor:pointer; font-size:11.5px; font-weight:600; padding:2px 4px; }
  .taskResultInput{ padding:7px 9px; border:1px solid var(--wpLine); border-radius:6px; font-size:13px; width:100%; resize:vertical; font-family:inherit; min-height:34px; }
  .autoGrow{ resize:none; overflow:hidden; min-height:38px; line-height:1.4; }
  @media (max-width:720px){
    .weeklyRowGrid{ flex-direction:column; gap:8px; }
    .weeklyRowGrid textarea, .weeklyRowGrid input{ font-size:16px !important; padding:10px 10px; }
    .weeklyRow{ padding:10px; }
  }
</style>
