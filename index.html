const INVENTORY_APP_HTML = "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no\">\n<title>Ki\u1ec3m K\u00ea Nh\u00e0 Thu\u1ed1c</title>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<script src=\"https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js\"><\/script>\n<script src=\"https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js\"><\/script>\n<script src=\"https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js\"><\/script>\n<style>\n  :root{\n    --ink:#0f2a2b;\n    --ink-soft:#4b6664;\n    --paper:#f4f7f5;\n    --card:#ffffff;\n    --line:#dbe6e1;\n    --teal:#0f6b5c;\n    --teal-deep:#0a4a41;\n    --teal-tint:#e3f1ec;\n    --amber:#b4720a;\n    --amber-tint:#fdf1de;\n    --red:#b3261e;\n    --red-tint:#fbe9e7;\n    --green:#1e7d46;\n    --green-tint:#e6f4ea;\n    --radius:14px;\n    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;\n  }\n  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}\n  html,body{margin:0;padding:0;height:100%;}\n  body{\n    background:var(--paper);\n    color:var(--ink);\n    font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;\n    display:flex;\n    flex-direction:column;\n    min-height:100vh;\n  }\n  #app{display:flex; flex-direction:column; flex:1; max-width:560px; margin:0 auto; width:100%; position:relative;}\n\n  /* ---- Top bar ---- */\n  .topbar{\n    background:var(--teal-deep);\n    color:#fff;\n    padding:14px 16px 12px;\n    position:sticky; top:0; z-index:30;\n  }\n  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}\n  .brand{display:flex; flex-direction:column; line-height:1.15;}\n  .brand .mark{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#8fd0bf; font-weight:700;}\n  .brand .title{font-size:19px; font-weight:800; letter-spacing:-.01em;}\n  .ctx-chip{\n    display:flex; gap:8px; align-items:center;\n    background:rgba(255,255,255,.1);\n    border:1px solid rgba(255,255,255,.18);\n    border-radius:999px;\n    padding:6px 12px;\n    font-size:12.5px;\n    cursor:pointer;\n  }\n  .ctx-chip .dot{width:6px;height:6px;border-radius:50%;background:#8fd0bf;}\n  .ctx-chip b{font-weight:700;}\n\n  /* ---- content ---- */\n  .view{padding:16px 16px 90px; flex:1;}\n  .hide{display:none !important;}\n\n  .card{\n    background:var(--card);\n    border:1px solid var(--line);\n    border-radius:var(--radius);\n    padding:16px;\n    margin-bottom:14px;\n  }\n  .card h2{margin:0 0 4px; font-size:15px; font-weight:800;}\n  .card p.sub{margin:0 0 12px; color:var(--ink-soft); font-size:12.5px; line-height:1.5;}\n\n  label.field-label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;}\n  input[type=text], input[type=number], select, textarea{\n    width:100%;\n    font-size:16px;\n    padding:12px 13px;\n    border-radius:10px;\n    border:1.5px solid var(--line);\n    background:#fff;\n    color:var(--ink);\n    font-family:inherit;\n  }\n  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--teal);}\n  .stack{display:flex; flex-direction:column; gap:12px;}\n  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}\n\n  button{font-family:inherit; cursor:pointer;}\n  .btn{\n    border:none; border-radius:11px; padding:13px 16px;\n    font-size:14.5px; font-weight:700;\n    display:flex; align-items:center; justify-content:center; gap:8px;\n    width:100%;\n  }\n  .btn-primary{background:var(--teal); color:#fff;}\n  .btn-primary:active{background:var(--teal-deep);}\n  .btn-outline{background:#fff; color:var(--teal-deep); border:1.5px solid var(--teal);}\n  .btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px dashed var(--line);}\n  .btn-danger{background:var(--red-tint); color:var(--red); border:1.5px solid #f0c7c3;}\n  .btn:disabled{opacity:.45; pointer-events:none;}\n  .btn-sm{padding:9px 12px; font-size:13px; width:auto;}\n\n  /* ---- Scan / manual ---- */\n  .scan-launch{\n    display:flex; flex-direction:column; align-items:center; justify-content:center;\n    gap:14px; padding:30px 16px; text-align:center;\n    background:linear-gradient(180deg, var(--teal-tint), #fff);\n    border:1.5px dashed #9fcabe;\n    border-radius:16px;\n  }\n  .scan-icon{width:56px; height:56px;}\n  #camWrap{position:relative; border-radius:14px; overflow:hidden; background:#000; margin-bottom:12px;}\n  #camContainer{width:100%; min-height:280px; max-height:56vh; position:relative;}\n  #camContainer video, #camContainer canvas{width:100% !important; height:100% !important; position:absolute; top:0; left:0; object-fit:cover;}\n  .cam-frame{position:absolute; inset:14%; border:2.5px solid #8fd0bf; border-radius:12px; box-shadow:0 0 0 999px rgba(0,0,0,.28);}\n  .cam-hint{position:absolute; bottom:10px; left:0; right:0; text-align:center; color:#fff; font-size:12px; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.6);}\n\n  .divider-or{display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:12px; margin:14px 0; font-weight:700;}\n  .divider-or::before, .divider-or::after{content:\"\"; flex:1; height:1px; background:var(--line);}\n\n  /* ---- product match card ---- */\n  .prod-card{\n    border-radius:16px; padding:18px;\n    background:var(--card); border:1.5px solid var(--line);\n  }\n  .prod-code{font-family:var(--mono); font-size:12px; color:var(--ink-soft); letter-spacing:.02em;}\n  .prod-name{font-size:19px; font-weight:800; margin:4px 0 10px; line-height:1.3;}\n  .unit-flag{\n    display:flex; align-items:center; gap:10px;\n    background:var(--amber-tint); border:1.5px solid #f0d9a8;\n    border-radius:11px; padding:10px 12px; margin-bottom:14px;\n  }\n  .unit-flag .u-label{font-size:11px; color:var(--amber); font-weight:800; text-transform:uppercase; letter-spacing:.05em;}\n  .unit-flag .u-value{font-size:18px; font-weight:800; color:#7a5108;}\n  .unit-flag .u-note{font-size:11.5px; color:#8a6414; margin-top:1px;}\n\n  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}\n  .stat{background:var(--paper); border-radius:10px; padding:10px 12px;}\n  .stat .k{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}\n  .stat .v{font-size:20px; font-weight:800; margin-top:2px;}\n\n  .qty-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}\n  .qty-btn{width:46px; height:46px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-size:22px; font-weight:700; color:var(--teal-deep); flex-shrink:0;}\n  .qty-input{flex:1; text-align:center; font-size:22px; font-weight:800; padding:11px 8px;}\n\n  .status-banner{border-radius:10px; padding:10px 12px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:14px;}\n  .status-ok{background:var(--green-tint); color:var(--green);}\n  .status-under{background:var(--amber-tint); color:var(--amber);}\n  .status-over{background:var(--red-tint); color:var(--red);}\n\n  .match-list{display:flex; flex-direction:column; gap:8px;}\n  .match-item{border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:10px;}\n  .match-item .mi-name{font-weight:700; font-size:13.5px;}\n  .match-item .mi-code{font-family:var(--mono); font-size:11px; color:var(--ink-soft);}\n\n  .toast{\n    position:fixed; left:16px; right:16px; bottom:86px; max-width:528px; margin:0 auto;\n    background:var(--ink); color:#fff; padding:12px 16px; border-radius:11px;\n    font-size:13.5px; font-weight:600; z-index:60; text-align:center;\n    box-shadow:0 8px 24px rgba(0,0,0,.25);\n  }\n\n  /* ---- summary table ---- */\n  .sum-toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}\n  .filter-pill{\n    border:1.5px solid var(--line); background:#fff; border-radius:999px;\n    padding:7px 13px; font-size:12.5px; font-weight:700; color:var(--ink-soft);\n  }\n  .filter-pill.active{background:var(--teal); border-color:var(--teal); color:#fff;}\n  .sum-row{\n    border:1px solid var(--line); border-radius:11px; padding:11px 13px; margin-bottom:8px; background:#fff;\n  }\n  .sum-row .sr-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}\n  .sum-row .sr-name{font-weight:700; font-size:13.5px; line-height:1.3;}\n  .sum-row .sr-code{font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); margin-top:2px;}\n  .sum-badge{font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; white-space:nowrap;}\n  .badge-ok{background:var(--green-tint); color:var(--green);}\n  .badge-under{background:var(--amber-tint); color:var(--amber);}\n  .badge-over{background:var(--red-tint); color:var(--red);}\n  .badge-none{background:#eee; color:#777;}\n  .sr-nums{display:flex; gap:16px; margin-top:8px; font-size:12.5px; color:var(--ink-soft);}\n  .sr-nums b{color:var(--ink); font-size:13.5px;}\n  .sr-detail{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:11.5px; color:var(--ink-soft); display:none;}\n  .sr-detail.open{display:block;}\n  .sr-detail div{display:flex; justify-content:space-between; padding:2px 0;}\n\n  .mode-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px;}\n  .mode-row .mt{font-weight:700; font-size:13.5px;}\n  .mode-row .ms{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}\n  .switch{position:relative; display:inline-block; width:46px; height:27px; flex-shrink:0;}\n  .switch input{opacity:0; width:0; height:0;}\n  .switch-slider{position:absolute; cursor:pointer; inset:0; background:#ccd9d5; border-radius:999px; transition:.15s;}\n  .switch-slider:before{position:absolute; content:\"\"; height:21px; width:21px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.15s;}\n  .switch input:checked + .switch-slider{background:var(--teal);}\n  .switch input:checked + .switch-slider:before{transform:translateX(19px);}\n\n  .recent-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}\n  .recent-row:last-child{border-bottom:none;}\n  .recent-row .rn{font-weight:700; font-size:13px; line-height:1.3;}\n  .recent-row .rc{font-family:var(--mono); font-size:10.5px; color:var(--ink-soft);}\n  .recent-row .rq{font-weight:800; font-size:16px; color:var(--teal-deep); min-width:34px; text-align:center;}\n  .recent-actions{display:flex; gap:6px; flex-shrink:0;}\n  .recent-actions button{border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:6px 9px; font-size:11.5px; font-weight:700; color:var(--ink-soft);}\n  .recent-edit{display:flex; gap:6px; align-items:center; flex-shrink:0;}\n  .recent-edit input{width:56px; padding:6px 4px; text-align:center; font-size:14px;}\n\n  .empty{text-align:center; padding:40px 16px; color:var(--ink-soft);}\n  .empty .em-icon{font-size:34px; margin-bottom:8px;}\n\n  .stat-tile{border-radius:11px; padding:12px 14px; border:1px solid var(--line); background:var(--paper);}\n  .stat-tile .k{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}\n  .stat-tile .v{font-size:22px; font-weight:800; margin-top:2px;}\n  .stat-tile.wide{grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;}\n  .stat-tile.t-ok{background:var(--green-tint); border-color:#bfe3c8;}\n  .stat-tile.t-under{background:var(--amber-tint); border-color:#f0d9a8;}\n  .stat-tile.t-over{background:var(--red-tint); border-color:#f0c7c3;}\n\n  /* ---- bottom nav ---- */\n  .bottomnav{\n    position:fixed; bottom:0; left:0; right:0; z-index:40;\n    background:#fff; border-top:1px solid var(--line);\n    display:flex; max-width:560px; margin:0 auto;\n    padding-bottom:env(safe-area-inset-bottom);\n  }\n  .nav-btn{\n    flex:1; border:none; background:none; padding:10px 4px 8px;\n    display:flex; flex-direction:column; align-items:center; gap:3px;\n    color:var(--ink-soft); font-size:11px; font-weight:700;\n  }\n  .nav-btn.active{color:var(--teal);}\n  .nav-btn svg{width:22px; height:22px;}\n\n  /* ---- setup / settings ---- */\n  .chip-grid{display:flex; flex-wrap:wrap; gap:8px;}\n  .shop-chip{\n    border:1.5px solid var(--line); border-radius:10px; padding:9px 13px; font-size:13px; font-weight:700; background:#fff; color:var(--ink-soft);\n  }\n  .shop-chip.active{background:var(--teal); border-color:var(--teal); color:#fff;}\n\n  .stock-status{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--teal-tint); border-radius:10px; margin-top:10px; font-size:12.5px; color:var(--teal-deep); font-weight:700;}\n  .col-map-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:12.5px; border-bottom:1px dashed var(--line);}\n  .col-map-row select{width:auto; padding:6px 8px; font-size:12.5px;}\n\n  .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}\n  @keyframes spin{to{transform:rotate(360deg);}}\n\n  .gate{\n    position:fixed; inset:0; background:var(--paper); z-index:100;\n    display:flex; flex-direction:column; align-items:center; justify-content:center;\n    padding:24px;\n  }\n  .gate-card{max-width:400px; width:100%;}\n  .gate .mark{text-align:center; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--teal); font-weight:800; margin-bottom:6px;}\n  .gate h1{text-align:center; font-size:23px; margin:0 0 6px; font-weight:800; color:var(--ink);}\n  .gate p{text-align:center; color:var(--ink-soft); font-size:13.5px; margin:0 0 22px;}\n</style>\n</head>\n<body>\n<div id=\"app\">\n\n  <!-- ============ GATE (name + shop selection) ============ -->\n  <div id=\"gate\" class=\"gate\">\n    <div class=\"gate-card card\">\n      <div class=\"mark\">Upharma</div>\n      <h1>Ki\u1ec3m K\u00ea Nh\u00e0 Thu\u1ed1c</h1>\n      <p>Nh\u1eadp t\u00ean v\u00e0 ch\u1ecdn c\u1eeda h\u00e0ng \u0111\u1ec3 b\u1eaft \u0111\u1ea7u ki\u1ec3m k\u00ea</p>\n      <div class=\"stack\">\n        <div>\n          <label class=\"field-label\">T\u00ean ng\u01b0\u1eddi ki\u1ec3m</label>\n          <input type=\"text\" id=\"gateName\" placeholder=\"VD: Lan, Minh, H\u01b0\u01a1ng...\">\n        </div>\n        <div>\n          <label class=\"field-label\">C\u1eeda h\u00e0ng</label>\n          <select id=\"gateShop\">\n            <option value=\"\">\u2014 Ch\u1ecdn c\u1eeda h\u00e0ng \u2014</option>\n          </select>\n        </div>\n        <button class=\"btn btn-primary\" id=\"gateEnter\">B\u1eaft \u0111\u1ea7u</button>\n      </div>\n    </div>\n  </div>\n\n  <!-- ============ MANAGER PIN GATE ============ -->\n  <div id=\"pinGate\" class=\"gate hide\">\n    <div class=\"gate-card card\">\n      <div class=\"mark\">Upharma</div>\n      <h1>Khu v\u1ef1c qu\u1ea3n l\u00fd</h1>\n      <p>Nh\u1eadp m\u00e3 PIN qu\u1ea3n l\u00fd \u0111\u1ec3 xem T\u1ed5ng h\u1ee3p / C\u00e0i \u0111\u1eb7t</p>\n      <div class=\"stack\">\n        <input type=\"password\" id=\"pinInput\" placeholder=\"M\u00e3 PIN\" inputmode=\"numeric\" autocomplete=\"off\">\n        <button class=\"btn btn-primary\" id=\"pinSubmit\">X\u00e1c nh\u1eadn</button>\n        <button class=\"btn btn-ghost\" id=\"pinCancel\">Hu\u1ef7, quay l\u1ea1i Ki\u1ec3m k\u00ea</button>\n      </div>\n    </div>\n  </div>\n\n  <!-- ============ TOP BAR ============ -->\n  <div class=\"topbar\">\n    <div class=\"topbar-row\">\n      <div class=\"brand\">\n        <span class=\"mark\">Upharma</span>\n        <span class=\"title\">Ki\u1ec3m K\u00ea</span>\n      </div>\n      <div class=\"ctx-chip\" id=\"ctxChip\">\n        <span class=\"dot\"></span>\n        <span id=\"ctxText\">\u2014</span>\n      </div>\n    </div>\n  </div>\n\n  <!-- ============ VIEW: SCAN ============ -->\n  <div id=\"view-scan\" class=\"view\">\n\n    <div class=\"card mode-row\" style=\"padding:0 16px;\">\n      <div>\n        <div class=\"mt\">Ch\u1ebf \u0111\u1ed9 qu\u00e9t li\u00ean t\u1ee5c</div>\n        <div class=\"ms\">M\u1ed7i l\u1ea7n qu\u00e9t t\u1ef1 ghi nh\u1eadn SL = 1, kh\u00f4ng c\u1ea7n x\u00e1c nh\u1eadn t\u1eebng l\u1ea7n</div>\n      </div>\n      <label class=\"switch\">\n        <input type=\"checkbox\" id=\"continuousToggle\">\n        <span class=\"switch-slider\"></span>\n      </label>\n    </div>\n\n    <div id=\"scanIdle\" class=\"card\" style=\"padding:0; overflow:hidden;\">\n      <div class=\"scan-launch\">\n        <svg class=\"scan-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0f6b5c\" stroke-width=\"1.6\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><path d=\"M3 12h18\" stroke-dasharray=\"2 2\"/></svg>\n        <div>\n          <div style=\"font-weight:800; font-size:15px; margin-bottom:4px;\">Qu\u00e9t m\u00e3 s\u1ea3n ph\u1ea9m</div>\n          <div style=\"font-size:12.5px; color:var(--ink-soft); max-width:280px;\">M\u1edf camera \u0111\u1ec3 qu\u00e9t m\u00e3 v\u1ea1ch, ho\u1eb7c nh\u1eadp m\u00e3 b\u1eb1ng tay b\u00ean d\u01b0\u1edbi</div>\n        </div>\n        <button class=\"btn btn-primary\" id=\"btnOpenCam\" style=\"max-width:220px;\">\ud83d\udcf7 M\u1edf camera qu\u00e9t m\u00e3</button>\n      </div>\n    </div>\n\n    <div id=\"camWrap\" class=\"hide\">\n      <div id=\"camContainer\"></div>\n      <div class=\"cam-frame\"></div>\n      <div class=\"cam-hint\">Gi\u1eef c\u00e1ch m\u00e3 v\u1ea1ch 10-15cm, \u0111\u1ee7 s\u00e1ng, gi\u1eef y\u00ean tay</div>\n    </div>\n    <button class=\"btn btn-ghost hide\" id=\"btnCloseCam\" style=\"margin-bottom:14px;\">\u0110\u00f3ng camera</button>\n\n    <div id=\"recentFeed\" class=\"card hide\">\n      <h2>V\u1eeba ghi nh\u1eadn</h2>\n      <p class=\"sub\">B\u1ea5m S\u1eeda n\u1ebfu l\u1ee1 \u0111i\u1ec1n sai s\u1ed1 l\u01b0\u1ee3ng, ho\u1eb7c Xo\u00e1 n\u1ebfu ghi nh\u1eadn nh\u1ea7m.</p>\n      <div id=\"recentList\"></div>\n    </div>\n\n    <div class=\"divider-or\">HO\u1eb6C NH\u1eacP M\u00c3 TAY</div>\n\n    <div class=\"card\">\n      <label class=\"field-label\">M\u00e3 s\u1ea3n ph\u1ea9m / m\u00e3 v\u1ea1ch</label>\n      <div style=\"display:flex; gap:8px;\">\n        <input type=\"text\" id=\"manualCode\" placeholder=\"Nh\u1eadp m\u00e3...\" inputmode=\"numeric\" autocomplete=\"off\">\n        <button class=\"btn btn-primary btn-sm\" id=\"btnManualSearch\">T\u00ecm</button>\n      </div>\n    </div>\n\n    <!-- multiple match candidates -->\n    <div id=\"matchChooser\" class=\"card hide\">\n      <h2>C\u00f3 nhi\u1ec1u m\u00e3 kh\u1edbp \u2014 ch\u1ecdn \u0111\u00fang s\u1ea3n ph\u1ea9m</h2>\n      <div class=\"match-list\" id=\"matchList\"></div>\n    </div>\n\n    <!-- no match -->\n    <div id=\"noMatch\" class=\"card hide\" style=\"text-align:center; padding:26px 16px;\">\n      <div style=\"font-size:28px; margin-bottom:6px;\">\ud83d\udd0e</div>\n      <div style=\"font-weight:700; margin-bottom:4px;\">Kh\u00f4ng t\u00ecm th\u1ea5y s\u1ea3n ph\u1ea9m</div>\n      <div style=\"font-size:12.5px; color:var(--ink-soft);\">M\u00e3 qu\u00e9t kh\u00f4ng kh\u1edbp v\u1edbi file t\u1ed3n kho c\u1ee7a c\u1eeda h\u00e0ng n\u00e0y. Ki\u1ec3m tra l\u1ea1i m\u00e3 ho\u1eb7c file t\u1ed3n \u0111\u00e3 t\u1ea3i l\u00ean ch\u01b0a.</div>\n    </div>\n\n    <!-- matched product -->\n    <div id=\"prodCard\" class=\"prod-card hide\">\n      <div class=\"prod-code\" id=\"pcCode\">\u2014</div>\n      <div class=\"prod-name\" id=\"pcName\">\u2014</div>\n\n      <div class=\"unit-flag\">\n        <div style=\"flex:1;\">\n          <div class=\"u-label\">\u0110\u01a1n v\u1ecb t\u00ednh \u2014 ki\u1ec3m tra k\u1ef9 tr\u00e1nh nh\u1ea7m bao b\u00ec</div>\n          <div class=\"u-value\" id=\"pcUnit\">\u2014</div>\n        </div>\n      </div>\n\n      <div class=\"stat-grid\" style=\"grid-template-columns:1fr;\">\n        <div class=\"stat\">\n          <div class=\"k\">\u0110\u00e3 ki\u1ec3m (t\u1ea5t c\u1ea3 ng\u01b0\u1eddi ki\u1ec3m)</div>\n          <div class=\"v\" id=\"pcCounted\">0</div>\n        </div>\n      </div>\n\n      <div id=\"pcYouCounted\" class=\"stock-status hide\" style=\"background:var(--paper); color:var(--ink-soft);\"></div>\n\n      <label class=\"field-label\" style=\"margin-top:14px;\">S\u1ed1 l\u01b0\u1ee3ng ki\u1ec3m l\u1ea7n n\u00e0y</label>\n      <div class=\"qty-row\">\n        <button class=\"qty-btn\" id=\"qtyMinus\">\u2212</button>\n        <input type=\"number\" id=\"qtyInput\" class=\"qty-input\" value=\"1\" min=\"0\" inputmode=\"numeric\">\n        <button class=\"qty-btn\" id=\"qtyPlus\">+</button>\n      </div>\n\n      <div id=\"pcStatusBanner\" class=\"status-banner hide\"></div>\n\n      <input type=\"text\" id=\"pcNote\" placeholder=\"Ghi ch\u00fa (tu\u1ef3 ch\u1ecdn, VD: l\u1ebb bao, r\u00e1ch nh\u00e3n...)\" style=\"margin-bottom:12px;\">\n\n      <button class=\"btn btn-primary\" id=\"btnConfirmCount\">\u2713 X\u00e1c nh\u1eadn c\u1ed9ng v\u00e0o ki\u1ec3m k\u00ea</button>\n      <button class=\"btn btn-ghost\" id=\"btnCancelCount\" style=\"margin-top:8px;\">Hu\u1ef7, qu\u00e9t m\u00e3 kh\u00e1c</button>\n    </div>\n\n  </div>\n\n  <!-- ============ VIEW: SUMMARY ============ -->\n  <div id=\"view-summary\" class=\"view hide\">\n    <div class=\"card\">\n      <h2>T\u1ed5ng h\u1ee3p ki\u1ec3m k\u00ea</h2>\n      <p class=\"sub\">K\u1ebft qu\u1ea3 c\u1ed9ng d\u1ed3n t\u1eeb t\u1ea5t c\u1ea3 ng\u01b0\u1eddi ki\u1ec3m, theo t\u1eebng \u0111\u1ee3t ki\u1ec3m k\u00ea.</p>\n      <label class=\"field-label\">Xem \u0111\u1ee3t ki\u1ec3m k\u00ea</label>\n      <select id=\"summarySessionSelect\" style=\"margin-bottom:12px;\"></select>\n      <div id=\"summaryStats\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;\"></div>\n      <div class=\"sum-toolbar\">\n        <button class=\"filter-pill active\" data-f=\"all\">T\u1ea5t c\u1ea3</button>\n        <button class=\"filter-pill\" data-f=\"counted\">\u0110\u00e3 ki\u1ec3m</button>\n        <button class=\"filter-pill\" data-f=\"uncounted\">Ch\u01b0a ki\u1ec3m</button>\n        <button class=\"filter-pill\" data-f=\"mismatch\">L\u1ec7ch t\u1ed3n</button>\n      </div>\n      <button class=\"btn btn-outline btn-sm\" id=\"btnRefreshSummary\">\u21bb L\u00e0m m\u1edbi d\u1eef li\u1ec7u</button>\n    </div>\n    <div id=\"summaryList\"></div>\n    <button class=\"btn btn-primary\" id=\"btnExportExcel\" style=\"margin-top:6px;\">\u2b07 Xu\u1ea5t k\u1ebft qu\u1ea3 ra Excel</button>\n    <button class=\"btn btn-outline\" id=\"btnFinalizeReport\" style=\"margin-top:8px;\">\ud83d\udce7 Ch\u1ed1t ki\u1ec3m k\u00ea & G\u1eedi bi\u00ean b\u1ea3n</button>\n  </div>\n\n  <!-- ============ VIEW: SETTINGS ============ -->\n  <div id=\"view-settings\" class=\"view hide\">\n\n    <div class=\"card\">\n      <h2>Ng\u01b0\u1eddi ki\u1ec3m hi\u1ec7n t\u1ea1i</h2>\n      <p class=\"sub\" id=\"curUserLine\">\u2014</p>\n      <button class=\"btn btn-outline btn-sm\" id=\"btnChangeUser\">\u0110\u1ed5i t\u00ean / \u0111\u1ed5i c\u1eeda h\u00e0ng</button>\n    </div>\n\n    <div class=\"card\">\n      <h2>File t\u1ed3n kho c\u1eeda h\u00e0ng</h2>\n      <p class=\"sub\">T\u1ea3i file Excel t\u1ed3n kho \u0111\u1ec3 l\u00e0m d\u1eef li\u1ec7u tham chi\u1ebfu (m\u00e3, t\u00ean, \u0110VT, t\u1ed3n) \u2014 file n\u00e0y s\u1ebd g\u1eafn ri\u00eang cho <b>\u0111\u1ee3t ki\u1ec3m k\u00ea \u0111ang d\u00f9ng</b> (m\u1ed7i \u0111\u1ee3t/ng\u00e0y c\u00f3 th\u1ec3 c\u00f3 t\u1ed3n kh\u00e1c nhau). N\u1ebfu file c\u00f3 nhi\u1ec1u d\u00f2ng c\u00f9ng m\u00e3 (do kh\u00e1c l\u00f4/h\u1ea1n d\u00f9ng), h\u1ec7 th\u1ed1ng t\u1ef1 c\u1ed9ng d\u1ed3n t\u1ed3n th\u00e0nh 1 d\u00f2ng cho m\u1ed7i m\u00e3. \u0110\u1ee3t m\u1edbi t\u1ea1o s\u1ebd t\u1ea1m d\u00f9ng t\u1ed3n c\u1ee7a \u0111\u1ee3t g\u1ea7n nh\u1ea5t cho \u0111\u1ebfn khi Ph\u01b0\u01a1ng t\u1ea3i file ri\u00eang.</p>\n      <input type=\"file\" id=\"stockFile\" accept=\".xlsx,.xls,.csv\" style=\"margin-bottom:10px;\">\n      <button class=\"btn btn-primary\" id=\"btnUploadStock\">T\u1ea3i l\u00ean & x\u1eed l\u00fd file</button>\n      <div id=\"stockStatus\" class=\"stock-status hide\"></div>\n      <div id=\"colMapBox\" class=\"hide\" style=\"margin-top:12px;\"></div>\n    </div>\n\n    <div class=\"card\">\n      <h2>\u0110\u1ee3t ki\u1ec3m k\u00ea</h2>\n      <p class=\"sub\">M\u1ed7i \u0111\u1ee3t l\u01b0u s\u1ed1 li\u1ec7u ri\u00eang bi\u1ec7t \u2014 d\u00f9ng khi ki\u1ec3m k\u00ea nhi\u1ec1u l\u1ea7n v\u00e0o c\u00e1c ng\u00e0y kh\u00e1c nhau. Nh\u00e2n vi\u00ean lu\u00f4n ghi v\u00e0o \u0111\u1ee3t \u0111ang ch\u1ecdn l\u00e0m hi\u1ec7n t\u1ea1i.</p>\n      <div id=\"sessionList\" style=\"margin-bottom:12px;\"></div>\n      <button class=\"btn btn-primary btn-sm\" id=\"btnNewSession\">+ T\u1ea1o \u0111\u1ee3t ki\u1ec3m k\u00ea m\u1edbi</button>\n    </div>\n\n    <div class=\"card\">\n      <h2>Email nh\u1eadn bi\u00ean b\u1ea3n ki\u1ec3m k\u00ea</h2>\n      <p class=\"sub\">Danh s\u00e1ch email c\u00e1c b\u1ed9 ph\u1eadn li\u00ean quan s\u1ebd nh\u1eadn bi\u00ean b\u1ea3n khi b\u1ea5m \"Ch\u1ed1t ki\u1ec3m k\u00ea\" \u1edf tab T\u1ed5ng h\u1ee3p. Nhi\u1ec1u email c\u00e1ch nhau b\u1eb1ng d\u1ea5u ph\u1ea9y.</p>\n      <input type=\"text\" id=\"reportEmailsInput\" placeholder=\"vd: quanly@upharma.vn, ketoan@upharma.vn\" style=\"margin-bottom:10px;\">\n      <button class=\"btn btn-outline btn-sm\" id=\"btnSaveReportEmails\">L\u01b0u danh s\u00e1ch email</button>\n    </div>\n\n    <div class=\"card\" style=\"background:var(--teal-tint); border-color:#bfe0d6;\">\n      <h2 style=\"color:var(--teal-deep);\">Ghi ch\u00fa s\u1eed d\u1ee5ng</h2>\n      <p class=\"sub\" style=\"color:var(--teal-deep);\">\n        \u2022 Qu\u00e9t m\u00e3 ho\u1ea1t \u0111\u1ed9ng tr\u00ean c\u1ea3 iPhone (Safari) v\u00e0 Android (Chrome) \u2014 l\u1ea7n \u0111\u1ea7u m\u1edf camera tr\u00ecnh duy\u1ec7t s\u1ebd xin quy\u1ec1n, b\u1ea5m Cho ph\u00e9p.<br>\n        \u2022 Tab T\u1ed5ng h\u1ee3p v\u00e0 C\u00e0i \u0111\u1eb7t c\u1ea7n m\u00e3 PIN qu\u1ea3n l\u00fd \u0111\u1ec3 v\u00e0o, tr\u00e1nh nh\u00e2n vi\u00ean xem t\u1ed3n h\u1ec7 th\u1ed1ng ho\u1eb7c t\u1ef1 s\u1eeda d\u1eef li\u1ec7u.<br>\n        \u2022 \u1ee8ng d\u1ee5ng \u0111\u1ed1i chi\u1ebfu 5 s\u1ed1 \u0111\u1ea7u c\u1ee7a m\u00e3 qu\u00e9t v\u1edbi 5 s\u1ed1 cu\u1ed1i c\u1ee7a m\u00e3 trong file t\u1ed3n \u0111\u1ec3 \u0111\u1ecbnh danh s\u1ea3n ph\u1ea9m.<br>\n        \u2022 Nhi\u1ec1u ng\u01b0\u1eddi c\u00f3 th\u1ec3 ki\u1ec3m c\u00f9ng l\u00fac tr\u00ean c\u00f9ng c\u1eeda h\u00e0ng \u2014 k\u1ebft qu\u1ea3 t\u1ef1 c\u1ed9ng d\u1ed3n \u1edf m\u1ee5c T\u1ed5ng h\u1ee3p.\n      </p>\n    </div>\n  </div>\n\n  <!-- ============ BOTTOM NAV ============ -->\n  <div class=\"bottomnav\">\n    <button class=\"nav-btn active\" data-view=\"scan\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><path d=\"M14 14h3v3h-3zM19 14v3M14 19h3M19 19h.01\"/></svg>\n      Ki\u1ec3m k\u00ea\n    </button>\n    <button class=\"nav-btn\" data-view=\"summary\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 19V5M9 19v-8M14 19V9M19 19V4\"/></svg>\n      T\u1ed5ng h\u1ee3p\n    </button>\n    <button class=\"nav-btn\" data-view=\"settings\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"/></svg>\n      C\u00e0i \u0111\u1eb7t\n    </button>\n  </div>\n\n</div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  /* ---------------- Firebase (shared with Upharma dashboard project) ---------------- */\n  var FIREBASE_CONFIG = {\n    apiKey: \"AIzaSyDUi5PEjF59RD1AZ4AhTQE_f0-00BZLQ08\",\n    authDomain: \"upharma-176d5.firebaseapp.com\",\n    projectId: \"upharma-176d5\",\n    storageBucket: \"upharma-176d5.firebasestorage.app\",\n    messagingSenderId: \"913487072756\",\n    appId: \"1:913487072756:web:40d0c94547e1246be27da1\"\n  };\n  firebase.initializeApp(FIREBASE_CONFIG);\n  var db = firebase.firestore();\n  var storage = firebase.storage();\n  // Separate collections from the dashboard's own data (namespaced with kiemke_ prefix)\n  var colMeta = db.collection(\"kiemke_meta\");\n  var colStock = db.collection(\"kiemke_stock\");\n  var colEntries = db.collection(\"kiemke_entries\");\n  var colIndex = db.collection(\"kiemke_index\");\n  var colSessions = db.collection(\"kiemke_sessions\");\n  var colSettings = db.collection(\"kiemke_settings\");\n\n  /* ---------------- EmailJS (bi\u00ean b\u1ea3n ki\u1ec3m k\u00ea t\u1ef1 \u0111\u1ed9ng) ----------------\n     \u0110i\u1ec1n 3 gi\u00e1 tr\u1ecb n\u00e0y sau khi Ph\u01b0\u01a1ng t\u1ea1o xong t\u00e0i kho\u1ea3n EmailJS (Email Services \u2192 Service ID,\n     Email Templates \u2192 Template ID, Account \u2192 API Keys \u2192 Public Key), r\u1ed3i t\u1ea3i l\u1ea1i file l\u00ean Netlify. */\n  var EMAILJS_SERVICE_ID = \"\";\n  var EMAILJS_TEMPLATE_ID = \"\";\n  var EMAILJS_PUBLIC_KEY = \"\";\n  if(EMAILJS_PUBLIC_KEY && typeof emailjs !== \"undefined\"){\n    emailjs.init({publicKey: EMAILJS_PUBLIC_KEY});\n  }\n\n  /* ---------------- constants ---------------- */\n  var DEFAULT_SHOPS = [\"SHOP0058\",\"SHOP0059\",\"SHOP0072\",\"SHOP0074\",\"SHOP0089\",\"SHOP0095\",\"SHOP0121\",\"SHOP0122\",\"SHOP0163\"];\n\n  var state = {\n    user: \"\",\n    shop: \"\",\n    stock: [],           // [{code,name,unit,stock}]\n    stockRaw: null,       // parsed sheet rows for column mapping\n    currentMatch: null,   // matched product object\n    candidates: [],\n    chooserContext: \"manual\", // \"manual\" | \"continuous\"\n    continuousMode: false,\n    lastCodeTime: {},     // raw scanned code -> ts, debounce repeat frames\n    recentScans: [],      // [{product, entry}] most recent first, continuous-mode feed\n    sessions: [],          // [{id,label,createdAt}] counting sessions for the current shop\n    activeSessionId: null, // session staff are currently contributing counts to\n    summarySessionId: null,// session being viewed in T\u1ed5ng h\u1ee3p (defaults to active)\n    summaryFilter: \"all\",\n    entriesCache: {},     // code -> entries array (for current summary render)\n    totalsCache: {}       // code -> running total counted in the active session (local cache, avoids re-fetching every scan)\n  };\n\n  /* ---------------- helpers ---------------- */\n  function $(id){ return document.getElementById(id); }\n  function removeDiacritics(str){\n    return (str||\"\").normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g,\"\").replace(/\u0111/g,\"d\").replace(/\u0110/g,\"D\");\n  }\n  function extractDigits(s){ return ((s||\"\").match(/\\d/g)||[]).join(\"\"); }\n  function toast(msg, ms){\n    var t = document.createElement(\"div\");\n    t.className = \"toast\";\n    t.textContent = msg;\n    document.getElementById(\"app\").appendChild(t);\n    setTimeout(function(){ t.remove(); }, ms||2200);\n  }\n  function fmtNum(n){ return Number(n||0).toLocaleString(\"vi-VN\"); }\n  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }\n\n  /* ---------------- audio feedback (vibration doesn't work on iPhone Safari, so sound is the main signal) ---------------- */\n  var audioCtx = null;\n  function ensureAudio(){\n    try{\n      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n      if(audioCtx.state === \"suspended\") audioCtx.resume();\n      // Prime playback with a near-silent blip \u2014 some iOS Safari versions need an actual\n      // oscillator start/stop during the user gesture to fully unlock audio, not just resume().\n      var primer = audioCtx.createOscillator();\n      var primerGain = audioCtx.createGain();\n      primer.connect(primerGain); primerGain.connect(audioCtx.destination);\n      primerGain.gain.value = 0.0001;\n      primer.frequency.value = 440;\n      primer.start();\n      primer.stop(audioCtx.currentTime + 0.02);\n    }catch(e){ /* ignore \u2014 non-critical */ }\n  }\n  function playTone(freq, duration, vol, waveType){\n    try{\n      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n      if(audioCtx.state === \"suspended\") audioCtx.resume();\n      var osc = audioCtx.createOscillator();\n      var gain = audioCtx.createGain();\n      osc.connect(gain); gain.connect(audioCtx.destination);\n      osc.type = waveType || \"sine\";\n      osc.frequency.value = freq;\n      gain.gain.setValueAtTime(vol||0.5, audioCtx.currentTime);\n      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);\n      osc.start();\n      osc.stop(audioCtx.currentTime + duration + 0.03);\n    }catch(e){ /* ignore \u2014 non-critical */ }\n  }\n  function beepSuccess(){\n    playTone(1200, 0.13, 1.0, \"square\");\n    setTimeout(function(){ playTone(1600, 0.13, 1.0, \"square\"); }, 130);\n  }\n  function beepNotFound(){ playTone(240, 0.28, 0.9, \"square\"); }\n\n  /* ---------------- Firestore helpers ---------------- */\n  var STOCK_CHUNK_SIZE = 1500; // keeps each stock document safely under the 1MB Firestore limit\n\n  function stockMetaId(shop, sessionId){ return shop + \"__\" + sessionId; }\n  function stockChunkId(shop, sessionId, idx){ return shop + \"__\" + sessionId + \"_\" + idx; }\n\n  // Save a stock reference list tied to a specific counting session (each day's t\u1ed3n snapshot).\n  async function saveStock(shop, sessionId, list){\n    var chunks = [];\n    for(var i=0;i<list.length;i+=STOCK_CHUNK_SIZE){\n      chunks.push(list.slice(i, i+STOCK_CHUNK_SIZE));\n    }\n    var metaId = stockMetaId(shop, sessionId);\n    var metaSnap = await colMeta.doc(metaId).get();\n    var oldCount = metaSnap.exists ? (metaSnap.data().chunkCount||0) : 0;\n\n    var batch = db.batch();\n    chunks.forEach(function(chunk, idx){\n      batch.set(colStock.doc(stockChunkId(shop, sessionId, idx)), {items: chunk});\n    });\n    await batch.commit();\n\n    if(oldCount > chunks.length){\n      var delBatch = db.batch();\n      for(var j=chunks.length;j<oldCount;j++){\n        delBatch.delete(colStock.doc(stockChunkId(shop, sessionId, j)));\n      }\n      await delBatch.commit();\n    }\n    await colMeta.doc(metaId).set({chunkCount: chunks.length, totalItems: list.length, updatedAt: Date.now()});\n    return true;\n  }\n\n  async function loadStockChunks(shop, sessionId, count){\n    var promises = [];\n    for(var i=0;i<count;i++){ promises.push(colStock.doc(stockChunkId(shop, sessionId, i)).get()); }\n    var snaps = await Promise.all(promises);\n    var list = [];\n    snaps.forEach(function(s){ if(s.exists){ list = list.concat(s.data().items||[]); } });\n    return list;\n  }\n\n  // Loads a session's own t\u1ed3n snapshot. If that session never had its own file uploaded,\n  // falls back to whichever other session's snapshot for this shop was uploaded most recently \u2014\n  // so a brand-new session isn't empty before its first upload.\n  async function loadStockForSession(shop, sessionId){\n    var metaSnap = await colMeta.doc(stockMetaId(shop, sessionId)).get();\n    if(metaSnap.exists){\n      return await loadStockChunks(shop, sessionId, metaSnap.data().chunkCount||0);\n    }\n    var candidates = [];\n    for(var i=0;i<state.sessions.length;i++){\n      var sid = state.sessions[i].id;\n      if(sid === sessionId) continue;\n      var snap = await colMeta.doc(stockMetaId(shop, sid)).get();\n      if(snap.exists) candidates.push({sessionId: sid, updatedAt: snap.data().updatedAt||0, chunkCount: snap.data().chunkCount||0});\n    }\n    if(!candidates.length) return [];\n    candidates.sort(function(a,b){ return b.updatedAt - a.updatedAt; });\n    var best = candidates[0];\n    return await loadStockChunks(shop, best.sessionId, best.chunkCount);\n  }\n\n  function entryDocId(shop, sessionId, code){ return shop + \"__\" + sessionId + \"__\" + code; }\n\n  async function getEntries(shop, sessionId, code){\n    var snap = await colEntries.doc(entryDocId(shop, sessionId, code)).get();\n    return snap.exists ? (snap.data().entries||[]) : [];\n  }\n  async function addEntryFs(shop, sessionId, code, entry){\n    await Promise.all([\n      colEntries.doc(entryDocId(shop, sessionId, code)).set(\n        {entries: firebase.firestore.FieldValue.arrayUnion(entry)},\n        {merge:true}\n      ),\n      colIndex.doc(shop+\"__\"+sessionId).set(\n        {codes: firebase.firestore.FieldValue.arrayUnion(code)},\n        {merge:true}\n      )\n    ]);\n  }\n  async function getIndexFs(shop, sessionId){\n    var snap = await colIndex.doc(shop+\"__\"+sessionId).get();\n    return snap.exists ? (snap.data().codes||[]) : [];\n  }\n\n  /* ---------------- counting sessions (multiple dated ki\u1ec3m k\u00ea rounds per shop) ---------------- */\n  function newSessionId(){ return \"s\" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }\n  function formatDateVN(d){\n    var dd = String(d.getDate()).padStart(2,\"0\");\n    var mm = String(d.getMonth()+1).padStart(2,\"0\");\n    return dd + \"/\" + mm + \"/\" + d.getFullYear();\n  }\n\n  async function getSessions(shop){\n    var snap = await colSessions.doc(shop).get();\n    if(!snap.exists) return {sessions:[], activeSessionId:null};\n    var d = snap.data();\n    return {sessions: d.sessions||[], activeSessionId: d.activeSessionId||null};\n  }\n\n  // Called whenever a shop is loaded \u2014 creates a first session automatically if none exist yet.\n  async function ensureActiveSession(shop){\n    var data = await getSessions(shop);\n    if(data.sessions.length && data.activeSessionId) return data;\n    var sess = {id:newSessionId(), label:\"\u0110\u1ee3t \" + formatDateVN(new Date()), createdAt: Date.now()};\n    var sessions = data.sessions.concat([sess]);\n    await colSessions.doc(shop).set({sessions: sessions, activeSessionId: sess.id}, {merge:true});\n    return {sessions: sessions, activeSessionId: sess.id};\n  }\n\n  async function createSession(shop, label){\n    var data = await getSessions(shop);\n    var sess = {id:newSessionId(), label: label || (\"\u0110\u1ee3t \" + formatDateVN(new Date())), createdAt: Date.now()};\n    var sessions = data.sessions.concat([sess]);\n    await colSessions.doc(shop).set({sessions: sessions, activeSessionId: sess.id}, {merge:true});\n    return {sessions: sessions, activeSessionId: sess.id};\n  }\n\n  async function setActiveSession(shop, sessionId){\n    await colSessions.doc(shop).set({activeSessionId: sessionId}, {merge:true});\n  }\n\n  async function deleteSession(shop, sessionId){\n    var codes = await getIndexFs(shop, sessionId);\n    for(var i=0;i<codes.length;i+=450){\n      var batch = db.batch();\n      codes.slice(i, i+450).forEach(function(code){\n        batch.delete(colEntries.doc(entryDocId(shop, sessionId, code)));\n      });\n      await batch.commit();\n    }\n    await colIndex.doc(shop+\"__\"+sessionId).delete();\n\n    var data = await getSessions(shop);\n    var remaining = data.sessions.filter(function(s){ return s.id !== sessionId; });\n    var newActive = data.activeSessionId;\n    if(newActive === sessionId){\n      newActive = remaining.length ? remaining[remaining.length-1].id : null;\n    }\n    if(!remaining.length){\n      var fresh = {id:newSessionId(), label:\"\u0110\u1ee3t \" + formatDateVN(new Date()), createdAt: Date.now()};\n      remaining = [fresh];\n      newActive = fresh.id;\n    }\n    await colSessions.doc(shop).set({sessions: remaining, activeSessionId: newActive}, {merge:true});\n    return {sessions: remaining, activeSessionId: newActive};\n  }\n\n  /* ---------------- report recipient list (shared per shop) ---------------- */\n  async function getReportEmails(shop){\n    var snap = await colSettings.doc(shop).get();\n    return snap.exists ? (snap.data().reportEmails || \"\") : \"\";\n  }\n  async function saveReportEmails(shop, emails){\n    await colSettings.doc(shop).set({reportEmails: emails, updatedAt: Date.now()}, {merge:true});\n  }\n\n  /* ================= GATE ================= */\n  function populateShopSelect(){\n    var sel = $(\"gateShop\");\n    DEFAULT_SHOPS.forEach(function(s){\n      var o = document.createElement(\"option\");\n      o.value = s; o.textContent = s;\n      sel.appendChild(o);\n    });\n    var o2 = document.createElement(\"option\");\n    o2.value = \"__custom__\"; o2.textContent = \"C\u1eeda h\u00e0ng kh\u00e1c...\";\n    sel.appendChild(o2);\n  }\n  populateShopSelect();\n\n  $(\"gateShop\").addEventListener(\"change\", function(){\n    if(this.value === \"__custom__\"){\n      var name = prompt(\"Nh\u1eadp m\u00e3/t\u00ean c\u1eeda h\u00e0ng:\");\n      if(name){\n        var opt = document.createElement(\"option\");\n        opt.value = name.trim().toUpperCase();\n        opt.textContent = opt.value;\n        opt.selected = true;\n        this.insertBefore(opt, this.lastElementChild);\n      } else {\n        this.value = \"\";\n      }\n    }\n  });\n\n  async function initGate(){\n    var savedUser = localStorage.getItem(\"kiemke_username\");\n    var savedShop = localStorage.getItem(\"kiemke_lastshop\");\n    if(savedUser) $(\"gateName\").value = savedUser;\n    if(savedShop){\n      var exists = Array.from($(\"gateShop\").options).some(function(o){return o.value===savedShop;});\n      if(!exists){\n        var opt = document.createElement(\"option\");\n        opt.value = savedShop; opt.textContent = savedShop;\n        $(\"gateShop\").insertBefore(opt, $(\"gateShop\").lastElementChild);\n      }\n      $(\"gateShop\").value = savedShop;\n    }\n  }\n  initGate();\n\n  $(\"gateEnter\").addEventListener(\"click\", async function(){\n    ensureAudio();\n    var name = $(\"gateName\").value.trim();\n    var shop = $(\"gateShop\").value;\n    if(!name){ toast(\"Vui l\u00f2ng nh\u1eadp t\u00ean ng\u01b0\u1eddi ki\u1ec3m\"); return; }\n    if(!shop){ toast(\"Vui l\u00f2ng ch\u1ecdn c\u1eeda h\u00e0ng\"); return; }\n    state.user = name;\n    state.shop = shop;\n    localStorage.setItem(\"kiemke_username\", name);\n    localStorage.setItem(\"kiemke_lastshop\", shop);\n    $(\"gate\").classList.add(\"hide\");\n    updateCtxChip();\n    await loadSessionsForShop();\n    await loadStockForShop();\n  });\n\n  function updateCtxChip(){\n    var sessLabel = \"\";\n    var sess = state.sessions.find(function(s){ return s.id === state.activeSessionId; });\n    if(sess) sessLabel = \" \u00b7 \" + sess.label;\n    $(\"ctxText\").innerHTML = \"<b>\" + state.shop + \"</b> \u00b7 \" + state.user + sessLabel;\n    $(\"curUserLine\").textContent = state.user + \" \u00b7 c\u1eeda h\u00e0ng \" + state.shop;\n  }\n  $(\"ctxChip\").addEventListener(\"click\", function(){\n    requestManagerAccess(\"settings\");\n  });\n  $(\"btnChangeUser\").addEventListener(\"click\", function(){\n    $(\"gate\").classList.remove(\"hide\");\n  });\n\n  async function loadSessionsForShop(){\n    try{\n      var data = await ensureActiveSession(state.shop);\n      state.sessions = data.sessions;\n      state.activeSessionId = data.activeSessionId;\n          state.totalsCache = {};\n      state.summarySessionId = data.activeSessionId;\n      updateCtxChip();\n      renderSessionManager();\n    }catch(e){\n      console.error(e);\n      toast(\"Kh\u00f4ng t\u1ea3i \u0111\u01b0\u1ee3c \u0111\u1ee3t ki\u1ec3m k\u00ea. Ki\u1ec3m tra k\u1ebft n\u1ed1i m\u1ea1ng.\");\n    }\n    try{\n      var emails = await getReportEmails(state.shop);\n      $(\"reportEmailsInput\").value = emails;\n    }catch(e){ console.error(e); }\n  }\n\n  $(\"btnSaveReportEmails\").addEventListener(\"click\", async function(){\n    var emails = $(\"reportEmailsInput\").value.trim();\n    this.disabled = true;\n    try{\n      await saveReportEmails(state.shop, emails);\n      toast(\"\u0110\u00e3 l\u01b0u danh s\u00e1ch email nh\u1eadn bi\u00ean b\u1ea3n.\");\n    }catch(e){ console.error(e); toast(\"L\u01b0u th\u1ea5t b\u1ea1i, th\u1eed l\u1ea1i.\"); }\n    this.disabled = false;\n  });\n\n  /* ================= CONTINUOUS SCAN MODE TOGGLE ================= */\n  state.continuousMode = localStorage.getItem(\"kiemke_continuous\") === \"1\";\n  $(\"continuousToggle\").checked = state.continuousMode;\n  $(\"continuousToggle\").addEventListener(\"change\", function(){\n    state.continuousMode = this.checked;\n    localStorage.setItem(\"kiemke_continuous\", state.continuousMode ? \"1\" : \"0\");\n    toast(state.continuousMode ? \"\u0110\u00e3 b\u1eadt qu\u00e9t li\u00ean t\u1ee5c \u2014 m\u1ed7i l\u1ea7n qu\u00e9t t\u1ef1 ghi SL = 1\" : \"\u0110\u00e3 t\u1eaft qu\u00e9t li\u00ean t\u1ee5c\", 2200);\n  });\n\n  /* ================= MANAGER PIN GATE (deterrent-level access control for T\u1ed5ng h\u1ee3p / C\u00e0i \u0111\u1eb7t) ================= */\n  var MANAGER_PIN = \"2026\"; // \u0110\u1ed5i m\u00e3 n\u00e0y tr\u01b0\u1edbc khi t\u1ea3i file l\u00ean n\u1ebfu mu\u1ed1n d\u00f9ng PIN kh\u00e1c\n  state.managerUnlocked = sessionStorage.getItem(\"kiemke_mgr_unlocked\") === \"1\";\n  state.pendingView = null;\n\n  function requestManagerAccess(targetView){\n    if(state.managerUnlocked){\n      switchView(targetView);\n      return;\n    }\n    state.pendingView = targetView;\n    $(\"pinInput\").value = \"\";\n    $(\"pinGate\").classList.remove(\"hide\");\n    setTimeout(function(){ $(\"pinInput\").focus(); }, 60);\n  }\n  $(\"pinSubmit\").addEventListener(\"click\", function(){\n    if($(\"pinInput\").value.trim() === MANAGER_PIN){\n      state.managerUnlocked = true;\n      sessionStorage.setItem(\"kiemke_mgr_unlocked\", \"1\");\n      $(\"pinGate\").classList.add(\"hide\");\n      switchView(state.pendingView || \"summary\");\n    } else {\n      toast(\"M\u00e3 PIN kh\u00f4ng \u0111\u00fang\");\n    }\n  });\n  $(\"pinCancel\").addEventListener(\"click\", function(){\n    $(\"pinGate\").classList.add(\"hide\");\n  });\n  $(\"pinInput\").addEventListener(\"keydown\", function(e){\n    if(e.key === \"Enter\") $(\"pinSubmit\").click();\n  });\n\n  /* ================= NAV ================= */\n  function switchView(name){\n    [\"scan\",\"summary\",\"settings\"].forEach(function(v){\n      $(\"view-\"+v).classList.toggle(\"hide\", v!==name);\n    });\n    document.querySelectorAll(\".nav-btn\").forEach(function(b){\n      b.classList.toggle(\"active\", b.dataset.view===name);\n    });\n    if(name===\"summary\"){ renderSummary(); }\n  }\n  document.querySelectorAll(\".nav-btn\").forEach(function(b){\n    b.addEventListener(\"click\", function(){\n      var v = b.dataset.view;\n      if(v === \"summary\" || v === \"settings\"){\n        requestManagerAccess(v);\n      } else {\n        switchView(v);\n      }\n    });\n  });\n\n  /* ================= STOCK LOAD ================= */\n  async function loadStockForShop(){\n    try{\n      state.stock = await loadStockForSession(state.shop, state.activeSessionId);\n    }catch(e){\n      console.error(e);\n      state.stock = [];\n    }\n    if(!state.stock.length){\n      toast(\"C\u1eeda h\u00e0ng \" + state.shop + \" ch\u01b0a c\u00f3 file t\u1ed3n kho. V\u00e0o C\u00e0i \u0111\u1eb7t \u0111\u1ec3 t\u1ea3i l\u00ean.\", 3200);\n    }\n  }\n\n  /* ================= COLUMN DETECTION + EXCEL UPLOAD ================= */\n  var COL_KEYWORDS = {\n    code: [\"ma hang\",\"ma sp\",\"ma san pham\",\"ma\"],\n    name: [\"ten hang\",\"ten sp\",\"ten san pham\",\"ten\"],\n    unit: [\"dvt\",\"don vi tinh\",\"don vi\"],\n    stock: [\"ton\",\"so luong ton\",\"sl ton\",\"so luong\"]\n  };\n  function guessColumn(headers, field){\n    var norm = headers.map(function(h){ return removeDiacritics(String(h||\"\")).toLowerCase().trim(); });\n    var kws = COL_KEYWORDS[field];\n    for(var k=0;k<kws.length;k++){\n      for(var i=0;i<norm.length;i++){\n        if(norm[i] === kws[k]) return i;\n      }\n    }\n    for(var k2=0;k2<kws.length;k2++){\n      for(var i2=0;i2<norm.length;i2++){\n        if(norm[i2].indexOf(kws[k2]) !== -1) return i2;\n      }\n    }\n    return -1;\n  }\n\n  $(\"stockFile\").addEventListener(\"change\", function(){\n    $(\"btnUploadStock\").textContent = this.files.length ? \"T\u1ea3i l\u00ean & x\u1eed l\u00fd file\" : \"T\u1ea3i l\u00ean & x\u1eed l\u00fd file\";\n  });\n\n  $(\"btnUploadStock\").addEventListener(\"click\", function(){\n    var f = $(\"stockFile\").files[0];\n    if(!f){ toast(\"Ch\u1ecdn file Excel tr\u01b0\u1edbc\"); return; }\n    var reader = new FileReader();\n    reader.onload = function(e){\n      try{\n        var wb = XLSX.read(e.target.result, {type:\"array\"});\n        var sheet = wb.Sheets[wb.SheetNames[0]];\n        var rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:\"\"});\n        if(!rows.length){ toast(\"File r\u1ed7ng\"); return; }\n        var headers = rows[0];\n        var body = rows.slice(1).filter(function(r){ return r.some(function(c){return String(c).trim()!==\"\";}); });\n        state.stockRaw = {headers:headers, body:body};\n        showColumnMapper(headers);\n      }catch(err){\n        console.error(err);\n        toast(\"Kh\u00f4ng \u0111\u1ecdc \u0111\u01b0\u1ee3c file. Ki\u1ec3m tra \u0111\u1ecbnh d\u1ea1ng Excel.\");\n      }\n    };\n    reader.readAsArrayBuffer(f);\n  });\n\n  function showColumnMapper(headers){\n    var box = $(\"colMapBox\");\n    box.classList.remove(\"hide\");\n    var guessCode = guessColumn(headers,\"code\");\n    var guessName = guessColumn(headers,\"name\");\n    var guessUnit = guessColumn(headers,\"unit\");\n    var guessStock = guessColumn(headers,\"stock\");\n\n    function optionsHtml(sel){\n      return headers.map(function(h,i){\n        return '<option value=\"'+i+'\" '+(i===sel?\"selected\":\"\")+'>' + (h||(\"C\u1ed9t \"+(i+1))) + '</option>';\n      }).join(\"\");\n    }\n\n    box.innerHTML =\n      '<p class=\"sub\" style=\"margin-bottom:10px;\">X\u00e1c nh\u1eadn c\u1ed9t d\u1eef li\u1ec7u t\u01b0\u01a1ng \u1ee9ng trong file:</p>' +\n      '<div class=\"col-map-row\"><span>M\u00e3 s\u1ea3n ph\u1ea9m</span><select id=\"mapCode\">'+optionsHtml(guessCode)+'</select></div>' +\n      '<div class=\"col-map-row\"><span>T\u00ean s\u1ea3n ph\u1ea9m</span><select id=\"mapName\">'+optionsHtml(guessName)+'</select></div>' +\n      '<div class=\"col-map-row\"><span>\u0110\u01a1n v\u1ecb t\u00ednh</span><select id=\"mapUnit\">'+optionsHtml(guessUnit)+'</select></div>' +\n      '<div class=\"col-map-row\" style=\"border-bottom:none;\"><span>S\u1ed1 l\u01b0\u1ee3ng t\u1ed3n</span><select id=\"mapStock\">'+optionsHtml(guessStock)+'</select></div>' +\n      '<button class=\"btn btn-primary btn-sm\" id=\"btnConfirmMap\" style=\"margin-top:12px;\">X\u00e1c nh\u1eadn & l\u01b0u file t\u1ed3n</button>';\n\n    $(\"btnConfirmMap\").addEventListener(\"click\", confirmStockMapping);\n  }\n\n  async function confirmStockMapping(){\n    var ci = parseInt($(\"mapCode\").value,10);\n    var ni = parseInt($(\"mapName\").value,10);\n    var ui = parseInt($(\"mapUnit\").value,10);\n    var si = parseInt($(\"mapStock\").value,10);\n    var body = state.stockRaw.body;\n\n    // Group by product code \u2014 the source file often has multiple rows per barcode\n    // (same product split across different l\u00f4/h\u1ea1n d\u00f9ng), so sum their t\u1ed3n quantities\n    // into a single row instead of keeping duplicates.\n    var grouped = {};\n    var rawRowCount = 0;\n    body.forEach(function(r){\n      var code = String(r[ci]||\"\").trim();\n      if(!code) return;\n      rawRowCount++;\n      var name = String(r[ni]||\"\").trim();\n      var unit = String(r[ui]||\"\").trim();\n      var stockVal = Number(String(r[si]||\"0\").replace(/[^\\d\\.\\-]/g,\"\")) || 0;\n      if(!grouped[code]){\n        grouped[code] = {code: code, name: name, unit: unit, stock: 0};\n      }\n      grouped[code].stock += stockVal;\n      // Fill in name/unit if the first occurrence had them blank\n      if(!grouped[code].name && name) grouped[code].name = name;\n      if(!grouped[code].unit && unit) grouped[code].unit = unit;\n    });\n    var list = Object.keys(grouped).map(function(k){ return grouped[k]; });\n    var mergedCount = rawRowCount - list.length;\n\n    if(!list.length){ toast(\"Kh\u00f4ng c\u00f3 d\u00f2ng d\u1eef li\u1ec7u h\u1ee3p l\u1ec7\"); return; }\n\n    $(\"btnConfirmMap\").textContent = \"\u0110ang l\u01b0u...\";\n    try{\n      await saveStock(state.shop, state.activeSessionId, list);\n      state.stock = list;\n      $(\"stockStatus\").classList.remove(\"hide\");\n      $(\"stockStatus\").textContent = \"\u2713 \u0110\u00e3 l\u01b0u \" + list.length + \" s\u1ea3n ph\u1ea9m cho c\u1eeda h\u00e0ng \" + state.shop +\n        (mergedCount > 0 ? \" (\u0111\u00e3 g\u1ed9p \" + fmtNum(mergedCount) + \" d\u00f2ng tr\u00f9ng m\u00e3 do kh\u00e1c l\u00f4/h\u1ea1n d\u00f9ng, c\u1ed9ng d\u1ed3n t\u1ed3n kho)\" : \"\");\n      $(\"colMapBox\").classList.add(\"hide\");\n      $(\"colMapBox\").innerHTML = \"\";\n      toast(\"\u0110\u00e3 c\u1eadp nh\u1eadt file t\u1ed3n kho\" + (mergedCount > 0 ? \" \u2014 \u0111\u00e3 g\u1ed9p \" + fmtNum(mergedCount) + \" d\u00f2ng tr\u00f9ng m\u00e3\" : \"\"));\n    }catch(err){\n      console.error(err);\n      toast(\"L\u01b0u th\u1ea5t b\u1ea1i, th\u1eed l\u1ea1i. Ki\u1ec3m tra k\u1ebft n\u1ed1i m\u1ea1ng.\");\n      $(\"btnConfirmMap\").textContent = \"X\u00e1c nh\u1eadn & l\u01b0u file t\u1ed3n\";\n    }\n  }\n\n  /* ================= MATCHING LOGIC ================= */\n  function findMatches(scanValue){\n    var digits = extractDigits(scanValue);\n    var exact = state.stock.filter(function(p){\n      return p.code.toLowerCase() === scanValue.trim().toLowerCase();\n    });\n    if(exact.length === 1) return exact;\n\n    if(digits.length < 5) return exact;\n    var prefix5 = digits.slice(0,5);\n    var matches = state.stock.filter(function(p){\n      var pd = extractDigits(p.code);\n      return pd.slice(-5) === prefix5;\n    });\n    return matches;\n  }\n\n  async function handleScanResult(scanValue){\n    scanValue = (scanValue||\"\").trim();\n    if(!scanValue) return;\n    if(!state.stock.length){\n      toast(\"Ch\u01b0a c\u00f3 file t\u1ed3n kho cho c\u1eeda h\u00e0ng n\u00e0y. V\u00e0o C\u00e0i \u0111\u1eb7t \u0111\u1ec3 t\u1ea3i l\u00ean.\", 3000);\n      return;\n    }\n    var matches = findMatches(scanValue);\n    hideAllResultBlocks();\n    if(matches.length === 0){\n      beepNotFound();\n      $(\"noMatch\").classList.remove(\"hide\");\n    } else if(matches.length === 1){\n      await showProductCard(matches[0]);\n    } else {\n      showChooser(matches, \"manual\");\n    }\n  }\n\n  function showChooser(matches, context){\n    state.candidates = matches;\n    state.chooserContext = context || \"manual\";\n    $(\"matchChooser\").classList.remove(\"hide\");\n    $(\"matchList\").innerHTML = matches.slice(0,20).map(function(m,i){\n      return '<div class=\"match-item\" data-i=\"'+i+'\">' +\n        '<div><div class=\"mi-name\">'+escapeHtml(m.name)+'</div><div class=\"mi-code\">'+escapeHtml(m.code)+' \u00b7 '+escapeHtml(m.unit)+'</div></div>' +\n        '<button class=\"btn btn-outline btn-sm\" data-pick=\"'+i+'\">Ch\u1ecdn</button></div>';\n    }).join(\"\");\n    document.querySelectorAll(\"[data-pick]\").forEach(function(btn){\n      btn.addEventListener(\"click\", function(){\n        handleChooserPick(parseInt(this.dataset.pick,10));\n      });\n    });\n  }\n\n  function handleChooserPick(idx){\n    var prod = state.candidates[idx];\n    $(\"matchChooser\").classList.add(\"hide\");\n    if(state.chooserContext === \"continuous\"){\n      autoRecord(prod);\n      try{ if(quaggaRunning) Quagga.start(); }catch(e){}\n    } else {\n      showProductCard(prod);\n    }\n  }\n\n  function escapeHtml(s){\n    return String(s||\"\").replace(/[&<>\"']/g, function(c){\n      return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c];\n    });\n  }\n\n  function hideAllResultBlocks(){\n    $(\"matchChooser\").classList.add(\"hide\");\n    $(\"noMatch\").classList.add(\"hide\");\n    $(\"prodCard\").classList.add(\"hide\");\n  }\n\n  async function showProductCard(prod){\n    hideAllResultBlocks();\n    state.currentMatch = prod;\n    $(\"pcCode\").textContent = prod.code;\n    $(\"pcName\").textContent = prod.name;\n    $(\"pcUnit\").textContent = prod.unit || \"\u2014\";\n    $(\"qtyInput\").value = 1;\n    $(\"pcNote\").value = \"\";\n    $(\"pcStatusBanner\").classList.add(\"hide\");\n\n    var entries = await getEntries(state.shop, state.activeSessionId, prod.code);\n    var totalCounted = entries.reduce(function(s,e){return s+Number(e.qty||0);},0);\n    var yourCounted = entries.filter(function(e){return e.user===state.user;}).reduce(function(s,e){return s+Number(e.qty||0);},0);\n    state.totalsCache[prod.code] = totalCounted;\n\n    $(\"pcCounted\").textContent = fmtNum(totalCounted);\n    if(yourCounted > 0){\n      $(\"pcYouCounted\").classList.remove(\"hide\");\n      $(\"pcYouCounted\").textContent = \"B\u1ea1n (\" + state.user + \") \u0111\u00e3 ki\u1ec3m \" + fmtNum(yourCounted) + \" \" + (prod.unit||\"\") + \" cho m\u00e3 n\u00e0y tr\u01b0\u1edbc \u0111\u00f3\";\n    } else {\n      $(\"pcYouCounted\").classList.add(\"hide\");\n    }\n\n    updateStatusBanner(prod, totalCounted);\n    $(\"prodCard\").classList.remove(\"hide\");\n    $(\"prodCard\").scrollIntoView({behavior:\"smooth\", block:\"start\"});\n  }\n\n  function statusFor(prod, total){\n    if(total === prod.stock) return {cls:\"ok\", label:\"\u2713 \u0110\u00e3 kh\u1edbp t\u1ed3n h\u1ec7 th\u1ed1ng\"};\n    if(total < prod.stock) return {cls:\"under\", label:\"\u26a0 Ch\u01b0a \u0111\u1ee7 so v\u1edbi t\u1ed3n h\u1ec7 th\u1ed1ng\"};\n    return {cls:\"over\", label:\"\u2715 \u0110\u00e3 v\u01b0\u1ee3t t\u1ed3n h\u1ec7 th\u1ed1ng\"};\n  }\n\n  function updateStatusBanner(prod, projectedTotal){\n    var el = $(\"pcStatusBanner\");\n    var info = statusFor(prod, projectedTotal);\n    el.classList.remove(\"hide\",\"status-ok\",\"status-under\",\"status-over\");\n    el.classList.add(\"status-\"+info.cls);\n    el.textContent = info.label + (info.cls===\"under\" ? \" \u2014 ki\u1ec3m tra l\u1ea1i \u0111\u00e3 \u0111\u1ebfm h\u1ebft ch\u01b0a\" : info.cls===\"over\" ? \" \u2014 ki\u1ec3m tra l\u1ea1i s\u1ed1 l\u01b0\u1ee3ng v\u1eeba nh\u1eadp\" : \"\");\n  }\n\n  $(\"qtyInput\").addEventListener(\"input\", async function(){\n    if(!state.currentMatch) return;\n    var entries = await getEntries(state.shop, state.activeSessionId, state.currentMatch.code);\n    var existingTotal = entries.reduce(function(s,e){return s+Number(e.qty||0);},0);\n    var newQty = Number($(\"qtyInput\").value||0);\n    updateStatusBanner(state.currentMatch, existingTotal + newQty);\n  });\n  $(\"qtyPlus\").addEventListener(\"click\", function(){\n    $(\"qtyInput\").value = Math.max(0, Number($(\"qtyInput\").value||0) + 1);\n    $(\"qtyInput\").dispatchEvent(new Event(\"input\"));\n  });\n  $(\"qtyMinus\").addEventListener(\"click\", function(){\n    $(\"qtyInput\").value = Math.max(0, Number($(\"qtyInput\").value||0) - 1);\n    $(\"qtyInput\").dispatchEvent(new Event(\"input\"));\n  });\n\n  /* ---------------- ENTRIES (shared, per product \u2014 backed by Firestore) ---------------- */\n  async function getIndex(sessionId){\n    return await getIndexFs(state.shop, sessionId || state.activeSessionId);\n  }\n\n  async function getCachedTotal(code){\n    if(state.totalsCache.hasOwnProperty(code)) return state.totalsCache[code];\n    var entries = await getEntries(state.shop, state.activeSessionId, code);\n    var total = entries.reduce(function(s,e){ return s+Number(e.qty||0); }, 0);\n    state.totalsCache[code] = total;\n    return total;\n  }\n\n  $(\"btnConfirmCount\").addEventListener(\"click\", async function(){\n    if(!state.currentMatch) return;\n    var qty = Number($(\"qtyInput\").value||0);\n    if(qty <= 0){ toast(\"Nh\u1eadp s\u1ed1 l\u01b0\u1ee3ng l\u1edbn h\u01a1n 0\"); return; }\n    this.disabled = true;\n    this.textContent = \"\u0110ang l\u01b0u...\";\n    try{\n      var entry = {user: state.user, qty: Number(qty), note: $(\"pcNote\").value.trim(), ts: Date.now()};\n      var priorTotal;\n      if(state.totalsCache.hasOwnProperty(state.currentMatch.code)){\n        priorTotal = state.totalsCache[state.currentMatch.code];\n        await addEntryFs(state.shop, state.activeSessionId, state.currentMatch.code, entry);\n      } else {\n        priorTotal = await getCachedTotal(state.currentMatch.code);\n        await addEntryFs(state.shop, state.activeSessionId, state.currentMatch.code, entry);\n      }\n      var totalAfter = priorTotal + qty;\n      state.totalsCache[state.currentMatch.code] = totalAfter;\n      var statusInfo = statusFor(state.currentMatch, totalAfter);\n      pushRecentScan(state.currentMatch, entry, statusInfo);\n      beepSuccess();\n      toast(\"\u0110\u00e3 ghi nh\u1eadn \" + fmtNum(qty) + \" \" + (state.currentMatch.unit||\"\") + \" \u2014 \" + state.currentMatch.name + \" \u00b7 \" + statusInfo.label);\n      hideAllResultBlocks();\n      $(\"manualCode\").value = \"\";\n      $(\"manualCode\").focus();\n    }catch(err){\n      console.error(err);\n      toast(\"Kh\u00f4ng l\u01b0u \u0111\u01b0\u1ee3c, ki\u1ec3m tra k\u1ebft n\u1ed1i m\u1ea1ng v\u00e0 th\u1eed l\u1ea1i.\");\n    }\n    this.disabled = false;\n    this.textContent = \"\u2713 X\u00e1c nh\u1eadn c\u1ed9ng v\u00e0o ki\u1ec3m k\u00ea\";\n  });\n\n  $(\"btnCancelCount\").addEventListener(\"click\", function(){\n    hideAllResultBlocks();\n  });\n\n  $(\"btnManualSearch\").addEventListener(\"click\", function(){\n    handleScanResult($(\"manualCode\").value);\n  });\n  $(\"manualCode\").addEventListener(\"keydown\", function(e){\n    if(e.key === \"Enter\"){ handleScanResult(this.value); }\n  });\n\n  /* ================= CAMERA SCAN (Quagga2 \u2014 tuned for 1D retail barcodes: EAN/Code128) ================= */\n  var quaggaRunning = false;\n  var scanLocked = false;       // prevents a single physical scan from firing twice\n  var CONTINUOUS_COOLDOWN_MS = 1400; // ignore repeat frames of the same raw code within this window\n\n  function onQuaggaDetected(result){\n    if(scanLocked) return; // guards against Quagga firing twice for the same physical scan\n    var code = result && result.codeResult && result.codeResult.code;\n    if(!code) return;\n\n    if(state.continuousMode){\n      var now = Date.now();\n      if(state.lastCodeTime[code] && (now - state.lastCodeTime[code]) < CONTINUOUS_COOLDOWN_MS) return;\n      state.lastCodeTime[code] = now;\n\n      scanLocked = true;\n      setTimeout(function(){ scanLocked = false; }, CONTINUOUS_COOLDOWN_MS);\n\n      if(!state.stock.length){\n        toast(\"Ch\u01b0a c\u00f3 file t\u1ed3n kho cho c\u1eeda h\u00e0ng n\u00e0y.\", 2200);\n        return;\n      }\n      var matches = findMatches(code);\n      if(matches.length === 0){\n        if(navigator.vibrate) navigator.vibrate([40,60,40]);\n        beepNotFound();\n        toast(\"Kh\u00f4ng t\u00ecm th\u1ea5y m\u00e3: \" + code, 1600);\n      } else if(matches.length === 1){\n        if(navigator.vibrate) navigator.vibrate(50);\n        autoRecord(matches[0]);\n      } else {\n        try{ Quagga.pause(); }catch(e){}\n        showChooser(matches, \"continuous\");\n      }\n      // camera keeps running \u2014 no stop/restart between scans\n    } else {\n      scanLocked = true; // released in closeCamera()\n      if(navigator.vibrate) navigator.vibrate(80);\n      closeCamera();\n      handleScanResult(code);\n    }\n  }\n\n  async function autoRecord(prod){\n    var entry = {user: state.user, qty: 1, note: \"\", ts: Date.now()};\n    try{\n      var priorTotal;\n      if(state.totalsCache.hasOwnProperty(prod.code)){\n        // Cache already warm \u2014 total lookup is free, so just fire the write.\n        priorTotal = state.totalsCache[prod.code];\n        await addEntryFs(state.shop, state.activeSessionId, prod.code, entry);\n      } else {\n        // First touch this session: must read the real total before writing, to avoid a race\n        // where the read could see the in-flight write and double-count.\n        priorTotal = await getCachedTotal(prod.code);\n        await addEntryFs(state.shop, state.activeSessionId, prod.code, entry);\n      }\n      var totalAfter = priorTotal + 1;\n      state.totalsCache[prod.code] = totalAfter;\n      var statusInfo = statusFor(prod, totalAfter);\n      pushRecentScan(prod, entry, statusInfo);\n      beepSuccess();\n      toast(\"+1 \" + (prod.unit||\"\") + \" \u2014 \" + prod.name + \" \u00b7 \" + statusInfo.label, 2000);\n    }catch(err){\n      console.error(err);\n      beepNotFound();\n      toast(\"L\u1ed7i l\u01b0u, qu\u00e9t l\u1ea1i m\u00e3 n\u00e0y.\", 2000);\n    }\n  }\n\n  function pushRecentScan(prod, entry, statusInfo){\n    state.recentScans.unshift({product: prod, entry: entry, statusInfo: statusInfo || null});\n    if(state.recentScans.length > 12) state.recentScans.length = 12;\n    renderRecentFeed();\n  }\n\n  function renderRecentFeed(){\n    var box = $(\"recentFeed\");\n    var list = $(\"recentList\");\n    if(!state.recentScans.length){\n      box.classList.add(\"hide\");\n      return;\n    }\n    box.classList.remove(\"hide\");\n    var badgeCls = {ok:\"badge-ok\", under:\"badge-under\", over:\"badge-over\"};\n    list.innerHTML = state.recentScans.map(function(item, idx){\n      var badge = item.statusInfo ? '<span class=\"sum-badge '+(badgeCls[item.statusInfo.cls]||\"badge-none\")+'\" style=\"margin-top:4px; display:inline-block;\">'+item.statusInfo.label.replace(\"\u2713 \",\"\").replace(\"\u26a0 \",\"\").replace(\"\u2715 \",\"\")+'</span>' : '';\n      return '<div class=\"recent-row\" id=\"recent-row-'+idx+'\">' +\n        '<div style=\"flex:1; min-width:0;\">' +\n          '<div class=\"rn\">'+escapeHtml(item.product.name)+'</div>' +\n          '<div class=\"rc\">'+escapeHtml(item.product.code)+' \u00b7 '+escapeHtml(item.product.unit)+'</div>' +\n          badge +\n        '</div>' +\n        '<div class=\"rq\">'+fmtNum(item.entry.qty)+'</div>' +\n        '<div class=\"recent-actions\">' +\n          '<button data-edit=\"'+idx+'\">S\u1eeda</button>' +\n          '<button data-del=\"'+idx+'\">Xo\u00e1</button>' +\n        '</div>' +\n      '</div>';\n    }).join(\"\");\n    document.querySelectorAll(\"[data-edit]\").forEach(function(btn){\n      btn.addEventListener(\"click\", function(){ startEditRecent(parseInt(this.dataset.edit,10)); });\n    });\n    document.querySelectorAll(\"[data-del]\").forEach(function(btn){\n      btn.addEventListener(\"click\", function(){ deleteRecent(parseInt(this.dataset.del,10)); });\n    });\n  }\n\n  function startEditRecent(idx){\n    var item = state.recentScans[idx];\n    if(!item) return;\n    var row = document.getElementById(\"recent-row-\"+idx);\n    row.innerHTML =\n      '<div style=\"flex:1; min-width:0;\">' +\n        '<div class=\"rn\">'+escapeHtml(item.product.name)+'</div>' +\n        '<div class=\"rc\">'+escapeHtml(item.product.code)+' \u00b7 '+escapeHtml(item.product.unit)+'</div>' +\n      '</div>' +\n      '<div class=\"recent-edit\">' +\n        '<input type=\"number\" min=\"0\" inputmode=\"numeric\" id=\"edit-qty-'+idx+'\" value=\"'+item.entry.qty+'\">' +\n        '<button class=\"btn btn-primary btn-sm\" data-save=\"'+idx+'\">L\u01b0u</button>' +\n      '</div>';\n    document.querySelector('[data-save=\"'+idx+'\"]').addEventListener(\"click\", function(){\n      saveEditRecent(idx);\n    });\n  }\n\n  async function saveEditRecent(idx){\n    var item = state.recentScans[idx];\n    if(!item) return;\n    var newQty = Number(document.getElementById(\"edit-qty-\"+idx).value || 0);\n    if(newQty < 0) newQty = 0;\n    var oldEntry = item.entry;\n    var newEntry = {user: oldEntry.user, qty: newQty, note: oldEntry.note||\"\", ts: oldEntry.ts};\n    try{\n      var ref = colEntries.doc(entryDocId(state.shop, state.activeSessionId, item.product.code));\n      await ref.update({entries: firebase.firestore.FieldValue.arrayRemove(oldEntry)});\n      await ref.update({entries: firebase.firestore.FieldValue.arrayUnion(newEntry)});\n      item.entry = newEntry;\n      renderRecentFeed();\n      toast(\"\u0110\u00e3 c\u1eadp nh\u1eadt s\u1ed1 l\u01b0\u1ee3ng\");\n    }catch(err){\n      console.error(err);\n      toast(\"C\u1eadp nh\u1eadt th\u1ea5t b\u1ea1i, th\u1eed l\u1ea1i.\");\n      renderRecentFeed();\n    }\n  }\n\n  async function deleteRecent(idx){\n    var item = state.recentScans[idx];\n    if(!item)  \"\u0110\u1ee3t ki\u1ec3m k\u00ea\");\n  }\n  function currentSessionLabelSlug(){\n    return state.summarySessionId === \"__all__\" ? \"TongHopTatCaDot\" :\n      (currentSessionLabel().replace(/[^\\w]+/g,\"\") || \"Dot\");\n  }\n\n  function buildReportWorkbookBlob(rows){\n    var ws = XLSX.utils.json_to_sheet(rows);\n    var wb = XLSX.utils.book_new();\n    XLSX.utils.book_append_sheet(wb, ws, \"Kiem ke\");\n    var wbout = XLSX.write(wb, {bookType:\"xlsx\", type:\"array\"});\n    return new Blob([wbout], {type:\"application/octet-stream\"});\n  }\n\n  $(\"btnExportExcel\").addEventListener(\"click\", function(){\n    var rows = buildReportRows();\n    var wb = XLSX.utils.book_new();\n    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), \"Kiem ke\");\n    var fname = \"KiemKe_\" + state.shop + \"_\" + currentSessionLabelSlug() + \"_\" + new Date().toISOString().slice(0,10) + \".xlsx\";\n    XLSX.writeFile(wb, fname);\n  });\n\n  /* ================= CH\u1ed0T KI\u1ec2M K\u00ca & G\u1eecI BI\u00caN B\u1ea2N QUA EMAIL ================= */\n  $(\"btnFinalizeReport\").addEventListener(\"click\", async function(){\n    var btn = this;\n    if(!state.summaryRows || !state.summaryRows.length){\n      toast(\"Ch\u01b0a c\u00f3 d\u1eef li\u1ec7u t\u1ed5ng h\u1ee3p. V\u00e0o tab T\u1ed5ng h\u1ee3p v\u00e0 \u0111\u1ee3i t\u1ea3i xong tr\u01b0\u1edbc khi ch\u1ed1t.\");\n      return;\n    }\n    if(!EMAILJS_SERVICE_ID || !EMAILJS_TEMPLATE_ID || !EMAILJS_PUBLIC_KEY){\n      toast(\"Ch\u01b0a c\u1ea5u h\u00ecnh EmailJS trong app. Li\u00ean h\u1ec7 ng\u01b0\u1eddi ph\u00e1t tri\u1ec3n \u0111\u1ec3 ho\u00e0n t\u1ea5t k\u1ebft n\u1ed1i.\", 3600);\n      return;\n    }\n    var emails = await getReportEmails(state.shop);\n    if(!emails.trim()){\n      toast(\"Ch\u01b0a c\u00f3 email ng\u01b0\u1eddi nh\u1eadn. V\u00e0o C\u00e0i \u0111\u1eb7t \u0111\u1ec3 th\u00eam danh s\u00e1ch email.\", 3200);\n      return;\n    }\n    if(!confirm(\"Ch\u1ed1t ki\u1ec3m k\u00ea
