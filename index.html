<script>

// Email được coi là tài khoản QUẢN LÝ — thấy được dữ liệu tất cả cửa hàng.

const ADMIN_EMAILS = ["mongdu83@gmail.com"];

// ================= EMAILJS (thông báo tặng sao qua email) =================
// Đăng ký miễn phí tại https://www.emailjs.com — điền 3 giá trị bên dưới sau khi tạo
// Service (kết nối hộp mail gửi đi) và Template (mẫu nội dung email) trên trang EmailJS.
const EMAILJS_PUBLIC_KEY = "4WPi-IxXoCf500SQm";
const EMAILJS_SERVICE_ID = "service_jgbizfp";
const EMAILJS_TEMPLATE_ID = "template_jmmydtk";
const EMAILJS_READY = EMAILJS_PUBLIC_KEY !== "YOUR_EMAILJS_PUBLIC_KEY" && window.emailjs;
if(EMAILJS_READY) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
async function sendNotifyEmail(toEmails, params){
  if(!EMAILJS_READY || !toEmails || toEmails.length===0) return;
  // Gửi riêng từng email một (thay vì gộp chung 1 lần) để đảm bảo TẤT CẢ
  // địa chỉ trong danh sách đều chắc chắn nhận được, không phụ thuộc việc
  // dịch vụ email có hỗ trợ nhiều người nhận trong 1 lần gửi hay không.
  const results = await Promise.allSettled(
    toEmails.map(email => emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email:email, ...params }))
  );
  results.forEach((r, i) => { if(r.status==="rejected") console.error(`Gửi email tới ${toEmails[i]} lỗi:`, r.reason); });
}

async function compressImage(file, maxDim, quality){
  // Thu nhỏ & nén ảnh trước khi tải lên. Lấy kích thước gốc qua thẻ <img> trước
  // (rẻ hơn giải mã toàn bộ ảnh), rồi yêu cầu trình duyệt tự giải mã kèm thu nhỏ
  // luôn (createImageBitmap resize) — nhanh hơn nhiều so với giải mã full-size
  // rồi mới vẽ thu nhỏ, đặc biệt trên điện thoại đời thấp.
  const dim = maxDim || 1280;
  const q = quality || 0.65;
  try{
    const { w, h } = await new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => { const r = { w:img.naturalWidth, h:img.naturalHeight }; URL.revokeObjectURL(url); resolve(r); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
    let targetW = w, targetH = h;
    if(w > dim || h > dim){
      const scale = dim / Math.max(w, h);
      targetW = Math.max(1, Math.round(w * scale));
      targetH = Math.max(1, Math.round(h * scale));
    }
    let bitmap;
    try{ bitmap = await createImageBitmap(file, { resizeWidth:targetW, resizeHeight:targetH, resizeQuality:"medium" }); }
    catch(e){ bitmap = await createImageBitmap(file); }
    const canvas = document.createElement("canvas");
    canvas.width = targetW; canvas.height = targetH;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, targetW, targetH);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", q));
    return blob || file;
  } catch(err){
    console.error("Nén ảnh lỗi, dùng ảnh gốc:", err);
    return file;
  }
}
async function uploadImageFile(file, path, onProgress){
  const toUpload = (file.type && file.type.startsWith("image/")) ? await compressImage(file) : file;
  const ref = storage.ref().child(path);
  const task = ref.put(toUpload, { contentType:"image/jpeg" });
  await new Promise((resolve, reject) => {
    task.on("state_changed",
      snap => { if(onProgress && snap.totalBytes) onProgress(Math.round(snap.bytesTransferred/snap.totalBytes*100)); },
      reject,
      resolve
    );
  });
  return await ref.getDownloadURL();
}
async function uploadTaskAttachmentFile(file, path, onProgress){
  // Giống uploadImageFile nhưng giữ nguyên loại tệp (ảnh sẽ được nén,
  // các tệp khác như PDF/Word/Excel được tải lên nguyên bản).
  const isImage = file.type && file.type.startsWith("image/");
  const toUpload = isImage ? await compressImage(file) : file;
  const ref = storage.ref().child(path);
  const task = ref.put(toUpload, { contentType: isImage ? "image/jpeg" : (file.type || "application/octet-stream") });
  await new Promise((resolve, reject) => {
    task.on("state_changed",
      snap => { if(onProgress && snap.totalBytes) onProgress(Math.round(snap.bytesTransferred/snap.totalBytes*100)); },
      reject,
      resolve
    );
  });
  const url = await ref.getDownloadURL();
  return { url, name:file.name, type: isImage ? "image" : "file" };
}

// Ghi/xoá field lồng nhau (dạng "a.b.c") một cách CHẮC CHẮN: update() đảm bảo field-path
// kèm FieldValue.delete() hoạt động đúng (set()+merge với key dạng dot-path không đáng tin
// cậy cho việc xoá — đây là nguyên nhân khiến bỏ tick trước đây không có tác dụng thật sự).
// Nếu tài liệu chưa tồn tại (lần ghi đầu tiên trong ngày/tuần), update() sẽ báo lỗi not-found,
// lúc đó tạo mới bằng set() bình thường (không cần xoá gì vì tài liệu mới toanh).
async function mergeDotFields(collectionName, docId, dotFields, createExtras){
  const ref = db.collection(collectionName).doc(docId);
  try{ await ref.update(dotFields); }
  catch(err){ await ref.set({ ...(createExtras||{}), ...dotFields }, { merge:true }); }
}
// Định dạng 1 sheet Excel cho dễ đọc: tự giãn độ rộng cột theo nội dung dài nhất, tô đậm +
// đổ màu dòng tiêu đề, kẻ viền toàn bảng, căn giữa tiêu đề, số căn phải/chữ căn trái, so le
// màu dòng cho dễ dò — dùng chung cho MỌI file Excel xuất ra.
function styleExportSheet(ws, rows){
  if(!rows || rows.length===0) return;
  const headers = Object.keys(rows[0]);
  // Độ rộng cột tính theo NỘI DUNG DỮ LIỆU (không theo độ dài tiêu đề) — tiêu đề dài sẽ tự
  // xuống dòng trong ô nhờ wrapText + dòng tiêu đề cao hơn, thay vì kéo cột rộng lê thê.
  ws["!cols"] = headers.map(h => {
    let maxLen = 8;
    rows.forEach(r => { const v = r[h]; if(v!=null){ const len = String(v).length; if(len>maxLen) maxLen = len; } });
    return { wch: Math.max(9, Math.min(22, maxLen + 2)) };
  });
  ws["!rows"] = [{ hpt: 48 }];
  const thinBorder = { style:"thin", color:{ rgb:"D9D6C8" } };
  const headerStyle = {
    font: { bold:true, sz:10.5, color:{ rgb:"FFFFFF" } },
    fill: { fgColor:{ rgb:"1F6E52" } },
    alignment: { horizontal:"center", vertical:"center", wrapText:true },
    border: { top:thinBorder, bottom:thinBorder, left:thinBorder, right:thinBorder },
  };
  const range = XLSX.utils.decode_range(ws["!ref"]);
  for(let C = range.s.c; C <= range.e.c; C++){
    const headAddr = XLSX.utils.encode_cell({ r:0, c:C });
    if(ws[headAddr]) ws[headAddr].s = headerStyle;
    for(let R = 1; R <= range.e.r; R++){
      const addr = XLSX.utils.encode_cell({ r:R, c:C });
      const cell = ws[addr];
      if(!cell) continue;
      const isNum = typeof cell.v === "number";
      cell.s = {
        font: { sz:11 },
        alignment: { vertical:"center", horizontal: isNum ? "right" : "left", wrapText:false },
        border: { top:thinBorder, bottom:thinBorder, left:thinBorder, right:thinBorder },
        fill: R % 2 === 0 ? { fgColor:{ rgb:"F7F5EE" } } : undefined,
      };
    }
  }
}

  // ngay lập tức thay vì chờ vòng lặp ghi lên Firestore, và tự khôi phục nếu lỗi.
  const [pendingDone, setPendingDone] = useState({});

    const u3 = subscribeCol("dailyReports", rows => { const map = {}; rows.forEach(r => map[r.id] = r); setReports(map); });
    return ()=>{ u1(); u2(); u3(); };
  }, []);

  const today = todayISO();
  const selfStaff = staff.find(s => s.id===selfId);
  const templateTasks = selfStaff ? (templates[selfStaff.role] || []) : [];
  const selfReportId = selfStaff ? dailyReportId(selfStaff.id, today) : null;
  const selfReport = selfReportId ? reports[selfReportId] : null;
  const customTasksMap = selfReport ? (selfReport.customTasks || {}) : {};

  // trong chính báo cáo của ngày hôm đó (không ảnh hưởng tới checklist mẫu chung).
  const customTasksList = Object.keys(customTasksMap).map(id => ({ id, label:customTasksMap[id], custom:true }));
  const selfTasks = [...templateTasks, ...customTasksList];
  const doneMap = selfReport ? (selfReport.doneIds || {}) : {};

  // để đếm số việc đã hoàn thành phản ánh đúng những gì người dùng vừa bấm.
  const effectiveDoneMap = { ...doneMap };
  Object.keys(pendingDone).forEach(k => { if(pendingDone[k]) effectiveDoneMap[k]=true; else delete effectiveDoneMap[k]; });
  const doneCount = Object.keys(effectiveDoneMap).filter(k => effectiveDoneMap[k]).length;
  const pct = selfTasks.length ? Math.round(doneCount/selfTasks.length*100) : 0;
  const taskDetailsMap = selfReport ? (selfReport.taskDetails || {}) : {};

  useEffect(()=>{ setNote(selfReport ? (selfReport.ghiChu || "") : ""); }, [selfReportId, selfReport && selfReport.ghiChu]);

  // để giao diện quay lại theo dõi trạng thái thật từ Firestore.
  useEffect(()=>{
    setPendingDone(prev => {
      const keys = Object.keys(prev);
      if(keys.length===0) return prev;
      let changed = false;
      const next = { ...prev };
      keys.forEach(k => { if(!!doneMap[k] === !!prev[k]){ delete next[k]; changed = true; } });
      return changed ? next : prev;
    });
  }, [doneMap]);

  async function toggleTask(taskId, checked){

    // Cập nhật giao diện ngay lập tức (lạc quan) để tick/bỏ tick luôn phản hồi tức thì,
    // không phụ thuộc độ trễ mạng hay vòng lặp ghi lên Firestore.
    setPendingDone(prev => ({ ...prev, [taskId]:checked }));

      staffId:selfStaff.id, staffName:selfStaff.name, shop:selfStaff.shop, role:selfStaff.role,
      ngay:today, trangThai: selfReport ? (selfReport.trangThai || "Nháp") : "Nháp",
      updatedAtTs: firebase.firestore.FieldValue.serverTimestamp(),
    };
    // Dùng field path dạng "doneIds.taskId" để chỉ thêm/xoá đúng 1 mục —
    // gửi cả object doneIds rồi merge sẽ KHÔNG xoá được key vắng mặt,
    // đây là lý do bỏ tick trước đây không có tác dụng.
    payload[`doneIds.${taskId}`] = checked ? true : firebase.firestore.FieldValue.delete();
    try{
      await mergeDotFields("dailyReports", selfReportId, payload);
    } catch(err){
      console.error("toggleTask lỗi:", err);
      // Ghi lỗi — khôi phục lại trạng thái tick trước đó và báo cho người dùng.
      setPendingDone(prev => { const n = { ...prev }; delete n[taskId]; return n; });

        const entry = { nguoiSua: myStaff.name, hanhDong:"Sửa thông tin", thoiGian:`${today} ${nowHM()}` };

function mondayOf(iso){
  const d = new Date(iso + "T00:00:00");
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

function monthOf(iso){ return iso.slice(0,7); }
function dayNumOf(iso){ return Number(iso.slice(8,10)); }
function daysInMonthOf(iso){ const y=Number(iso.slice(0,4)), m=Number(iso.slice(5,7)); return new Date(y,m,0).getDate(); }
function lastDayOfMonthOf(iso){ return iso.slice(0,8) + String(daysInMonthOf(iso)).padStart(2,"0"); }
// Ngày mốc để tính luỹ kế dự kiến: nếu là tuần hiện tại thì lấy hôm nay, nếu là tuần đã qua thì lấy Chủ nhật
// cuối tuần đó — nếu ngày mốc lệch sang tháng khác thì chốt ở ngày cuối cùng của tháng báo cáo (tháng của thứ Hai).
function weekProgressRefDate(tuanNgay, isCurrentWeek){
  const cand = isCurrentWeek ? todayISO() : addDays(tuanNgay, 6);
  return monthOf(cand)===monthOf(tuanNgay) ? cand : lastDayOfMonthOf(tuanNgay);
}
// Luỹ kế dự kiến = chỉ tiêu tháng * (số ngày đã qua trong tháng tính đến ngày mốc / tổng số ngày của tháng đó).
// Với chỉ tiêu dạng "trung bình" (VD: trung bình bill) thì không cộng dồn theo ngày — chỉ tiêu chính là mốc so sánh.
function expectedCumulative(target, refIso, agg){
  const t = Number(target) || 0;
  if(!t) return 0;
  if(agg==="avg") return t;
  const total = daysInMonthOf(refIso);
  const elapsed = Math.min(dayNumOf(refIso), total);
  return t * elapsed / total;
}
// Cộng dồn "thực tế đạt được trong tuần" của tất cả các tuần thuộc cùng 1 tháng báo cáo (tính đến & bao gồm tuần
// đang xét). Với chỉ tiêu dạng "trung bình" thì lấy TRUNG BÌNH các tuần đã nhập thay vì cộng dồn (vì cộng dồn
// nhiều giá trị trung bình bill của từng tuần lại không có ý nghĩa).
function monthActualCumulative(allReports, shop, monthStr, uptoMonday, key, agg){
  const rows = allReports.filter(r => r.shop===shop && r.tuanNgay<=uptoMonday && monthOf(r.tuanNgay)===monthStr);
  if(agg==="avg"){
    const withVal = rows.filter(r => r[key] && Number(r[key].actualWeek));
    if(withVal.length===0) return 0;
    return withVal.reduce((sum,r) => sum + Number(r[key].actualWeek), 0) / withVal.length;
  }
  return rows.reduce((sum,r) => sum + (Number(r[key] && r[key].actualWeek) || 0), 0);
}
// Chỉ tiêu tháng chỉ cần nhập 1 lần đầu tháng — các tuần sau tự kế thừa chỉ tiêu gần nhất trong cùng tháng.
function latestMonthTarget(allReports, shop, monthStr, beforeMonday, key){
  const list = allReports
    .filter(r => r.shop===shop && monthOf(r.tuanNgay)===monthStr && r.tuanNgay<beforeMonday && r[key] && Number(r[key].target))
    .sort((a,b)=> a.tuanNgay<b.tuanNgay?1:-1);
  return list.length>0 ? list[0][key].target : "";
}

function AutoGrowTextarea({ className, value, onChange, ...rest }){
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }, [value]);
  return React.createElement("textarea", {
    ...rest, ref, rows:1, value, onChange,
    className: (className || "") + " autoGrow",
    onInput: e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; },
  });
}

function TaskAssignView({ isAdmin, myStaff }){
  const [tasks, setTasks] = useState([]);
  const [staffList, setStaffList] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ scope:"one", shop:DEFAULT_SHOPS[0], staffId:"", title:"", mota:"", deadline:addDays(todayISO(),3), hanGio:"17:00" });
  const [adminShop, setAdminShop] = useState("Tất cả");
  const [adminStatus, setAdminStatus] = useState("Tất cả");
  const [reportingId, setReportingId] = useState(null);
  const [resultText, setResultText] = useState("");
  const [uploadingResult, setUploadingResult] = useState({});
  const [viewTask, setViewTask] = useState(null);

  useEffect(()=>{
    const u1 = subscribeCol("tasks", setTasks);
    const u2 = subscribeCol("staff", setStaffList);
    return ()=>{ u1(); u2(); };
  }, []);

  const today = todayISO();
  function deadlineTs(t){ return `${t.deadline}T${t.hanGio || "23:59"}`; }
  function isOverdue(t){ return t.trangThai==="Đang giao" && deadlineTs(t) < `${today}T${nowHM()}`; }
  function deadlineLabel(t){ return t.hanGio ? `${t.deadline} ${t.hanGio}` : t.deadline; }
  const staffOptions = staffList.map(s => ({ value:s.id, label:`${s.name} · ${s.shop} · ${s.role}` }));

  async function submitAssign(e){
    e.preventDefault();
    if(!form.title.trim()) return;
    const base = { title:form.title.trim(), mota:form.mota.trim(), deadline:form.deadline, hanGio:form.hanGio||"", trangThai:"Đang giao", ketQua:"", nguoiBaoCao:"", ngayGiao:today };
    if(form.scope==="staffOne"){
      if(!form.staffId) return;
      const s = staffList.find(x=>x.id===form.staffId);
      await addDoc("tasks", { ...base, assignType:"staff", staffId:form.staffId, staffName:s?s.name:"", shop:s?s.shop:"" });
    } else {
      const shops = form.scope==="all" ? DEFAULT_SHOPS : [form.shop];
      await Promise.all(shops.map(shop => addDoc("tasks", { ...base, assignType:"shop", shop, staffId:null, staffName:"" })));
    }
    setForm({ ...form, title:"", mota:"", staffId:"" }); setShowForm(false);
  }
  async function submitResult(taskId){
    if(!resultText.trim()) return;
    await updateDoc("tasks", taskId, {
      trangThai:"Đã hoàn thành", ketQua:resultText.trim(), ngayHoanThanh:today,
      nguoiBaoCao: myStaff ? myStaff.name : "",
    });
    setReportingId(null); setResultText("");
  }
  async function uploadResultFiles(taskId, files){
    setUploadingResult(prev => ({ ...prev, [taskId]:true }));
    try{
      for(const file of files){

function currentMonthStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
// Tính điểm KPI thực tế cho 1 chỉ tiêu, theo đúng công thức từng loại cách chấm.
function kpiCalcItemScore(item, target, actual){
  const diem = item.diem;
  if(item.cachCham==="nhi_phan"){
    return actual==="Đạt" ? diem : 0;
  }
  if(item.cachCham==="ty_le_truc_tiep"){
    const pct = Number(actual)||0;
    return Math.max(0, Math.min(1, pct/100)) * diem;
  }
  // nguong60 / nguong60_max120
  const t = Number(target)||0, a = Number(actual);
  if(!t || actual===""||actual==null||isNaN(a)) return null; // chưa đủ dữ liệu để tính
  let pct = a / t;
  if(pct < 0.6) return 0;
  if(item.cachCham==="nguong60_max120") pct = Math.min(pct, 1.2);
  return pct * diem;
}
function kpiTotalPlan(groups){ return groups.reduce((s,g)=> s + g.items.reduce((s2,it)=>s2+it.diem,0), 0); }
function kpiTotalActual(groups, targets, actuals){
  let sum = 0, hasAny = false;
  groups.forEach(g => g.items.forEach(it => {
    const sc = kpiCalcItemScore(it, targets[it.id], actuals[it.id]);
    if(sc!=null){ sum += sc; hasAny = true; }
  }));
  return hasAny ? sum : null;
}
function kpiXepLoai(pct){ if(pct==null) return "—"; return pct>=0.85 ? "Đạt thưởng" : "Chưa đạt"; }
function kpiCtahId(staffId, thang){ return staffId + "_" + thang; }
// Tính điểm cộng/trừ từ "Các tiêu chí ảnh hưởng" (CTAH) — đào tạo, tác phong, chuyên cần...
// theo đúng quy tắc trong file mẫu. Trả về { adj, khongXet } — khongXet = true khi vi phạm
// tác phong/thái độ lần thứ 3 trở lên, nghĩa là tháng đó KHÔNG được xét KPI (không tính %).
function kpiCtahCalc(doc){
  if(!doc) return { adj:0, khongXet:false };
  let adj = 0, khongXet = false;
  // Đào tạo
  if(doc.baiKiemTra!=null && doc.baiKiemTra!==""){
    const d = Number(doc.baiKiemTra);
    if(d < 60) adj -= 50; else if(d >= 99) adj += 50;
  }
  adj -= 20 * (Number(doc.hopNhomThieu)||0);
  if(doc.rolePlay==="Không đạt") adj -= 50;
  if(doc.tuHocLoTrinh==="Không đạt") adj -= 50;
  adj -= 20 * (Number(doc.coachingThieu)||0); // chỉ áp dụng CHT/Phụ trách cửa hàng
  // Tác phong & vận hành — cùng quy tắc "số lần vi phạm": lần 1: -5, lần 2: -10, lần 3 trở lên: không xét KPI
  ["dongPhucLan","thaiDoLan","bangGiaoCaLan","veSinhLan","kiemKeLan","congViecKhacLan"].forEach(f => {
    const n = Number(doc[f])||0;
    if(n===1) adj -= 5;
    else if(n===2) adj -= 10;
    else if(n>=3) khongXet = true;
  });
  // Chuyên cần — riêng: lần 1 (nghỉ đúng phép/có xin phép) không trừ, lần 2: -5, lần 3: -10, lần 4 trở lên: không xét KPI
  const cc = Number(doc.chuyenCanLan)||0;
  if(cc===2) adj -= 5;
  else if(cc===3) adj -= 10;
  else if(cc>=4) khongXet = true;
  // Phát hiện kiểm kê không trung thực: không tính điểm KPI phần này (xử lý lương tách riêng, ngoài KPI)
  if(doc.kiemKeGianLan) khongXet = true;
  return { adj, khongXet };
}
// CTAH riêng cho Quản lý địa bàn (QLKV) — công thức khác với NVBH/CHT theo đúng file mẫu:
// bài kiểm tra không có mức thưởng +50, role play có 3 mức, tự học LMS trừ 20 (không phải 50),
// và có thêm mục "duyệt kế hoạch web NVBH" tính theo số NVBH bị ảnh hưởng.
function kpiCtahQlkvCalc(doc){
  if(!doc) return { adj:0 };
  let adj = 0;
  if(doc.baiKiemTra!=null && doc.baiKiemTra!==""){
    if(Number(doc.baiKiemTra) < 60) adj -= 50;
  }
  adj -= 20 * (Number(doc.hopNhomThieu)||0);
  if(doc.rolePlay==="Không đạt") adj -= 10;
  else if(doc.rolePlay==="Không thực hiện") adj -= 20;
  if(doc.tuHocLMS==="Không đạt") adj -= 20;
  adj -= 20 * (Number(doc.soNvbhKhongDuyet)||0);
  return { adj };
}

function stripAccents(str){
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D");
}
function suggestEmail(name){
  const slug = stripAccents(name).toLowerCase().trim().replace(/[^a-z0-9\s]/g,"").split(/\s+/).join(".");
  return slug + "@upharma.local";
}
function randomPassword(){
  return Math.random().toString(36).slice(-4) + Math.random().toString(36).slice(-4);
}

function TaskReminderBanner({ myStaff, onOpenTasks }){
  const [tasks, setTasks] = useState([]);
  useEffect(()=>{
    if(!myStaff) return undefined;
    const u = subscribeCol("tasks", setTasks);
    return u;
  }, [myStaff && myStaff.id]);
  if(!myStaff) return null;

  const today = todayISO();
  const nowStamp = `${today}T${nowHM()}`;
  function ts(t){ return `${t.deadline}T${t.hanGio || "23:59"}`; }
  function label(t){ return t.hanGio ? `${t.deadline} ${t.hanGio}` : t.deadline; }

  const isShopManager = myStaff.role==="Cửa hàng trưởng";
  const myPending = tasks.filter(t =>
    (isShopManager ? t.shop===myStaff.shop : (t.assignType==="staff" ? t.staffId===myStaff.id : t.shop===myStaff.shop))
    && t.trangThai==="Đang giao"
  );
  // Nhắc việc đã quá hạn, hoặc sắp đến hạn trong vòng 24 giờ tới —
  // hiện ngay khi mở app, không cần bấm vào tab "Giao việc" mới thấy.
  const overdue = myPending.filter(t => ts(t) < nowStamp).sort((a,b)=> ts(a)<ts(b)?-1:1);
  const dueSoon = myPending.filter(t => ts(t) >= nowStamp && ts(t) <= `${addDays(today,1)}T${nowHM()}`).sort((a,b)=> ts(a)<ts(b)?-1:1);
  const alertTasks = [...overdue, ...dueSoon];
  if(alertTasks.length===0) return null;

  return React.createElement("div", { className:"card", style:{ maxWidth:1100, margin:"16px auto 0", borderColor:"var(--claySoft)", background:"var(--claySoft)" } }, [
    React.createElement("div", { key:"t", style:{ fontWeight:700, fontSize:13.5, marginBottom:8, color:"var(--clay)" } },
      `🔔 Bạn có ${alertTasks.length} việc được giao ${overdue.length>0 ? "quá hạn hoặc " : ""}sắp đến hạn`),
    React.createElement("div", { key:"list", style:{ display:"flex", flexDirection:"column", gap:6, marginBottom:10 } }, alertTasks.slice(0,5).map(t =>
      React.createElement("div", { key:t.id, style:{ fontSize:12.5 } }, [
        React.createElement("span", { key:"n", style:{ fontWeight:600 } }, t.title),
        (isShopManager && t.assignType==="staff" && t.staffId!==myStaff.id) && React.createElement("span", { key:"who", style:{ color:"var(--inkSoft)" } }, ` (${t.staffName})`),
        React.createElement("span", { key:"d", style:{ color: ts(t)<nowStamp ? "var(--clay)" : "var(--inkSoft)" } }, ` — hạn ${label(t)}${ts(t)<nowStamp ? " (quá hạn)" : ""}`),
      ])
    )),
    React.createElement("button", { key:"b", type:"button", className:"btn btnAmber", style:{padding:"7px 13px",fontSize:12.5}, onClick:onOpenTasks }, "Xem & báo cáo kết quả"),
  ]);
}

function Dashboard({ user, isAdmin, myStaff }){
  const visibleTabs = isAdmin ? OPS_TABS : OPS_TABS.filter(t => STAFF_TABS.includes(t.id));
  const [activeTab, setActiveTab] = useState(visibleTabs[0].id);
  const whoLabel = isAdmin ? "Quản lý" : (myStaff ? `${myStaff.name} · ${myStaff.shop}` : "");
  return React.createElement(React.Fragment, null, [
    React.createElement("div", { key:"nav", className:"topnav" }, React.createElement("div", { className:"topnavInner" }, [
      React.createElement("div", { key:"brand", className:"brandRow" }, [
        React.createElement("div", { key:"b", className:"brand" }, [
          React.createElement("span", { key:"m", className:"mark" }),
          React.createElement("div", { key:"t" }, [
            React.createElement("h1", { key:"h" }, "Upharma Ops"),
            React.createElement("small", { key:"s" }, "Vận hành & Nhân sự"),
          ]),
        ]),
        React.createElement("button", { key:"logout", className:"logoutBtn", onClick:()=>auth.signOut() }, `${whoLabel} · Đăng xuất`),
      ]),
      React.createElement("div", { key:"tabs", className:"tabs" }, visibleTabs.map(t =>
        React.createElement("button", { key:t.id, className:activeTab===t.id?"active":"", onClick:()=>setActiveTab(t.id) }, t.label)
      )),
    ])),
    !isAdmin && React.createElement(TaskReminderBanner, { key:"reminder", myStaff, onOpenTasks:()=>setActiveTab("tasks") }),
    !isAdmin && React.createElement(CustomerOrderReminderBanner, { key:"custreminder", myStaff, onOpen:()=>setActiveTab("customerOrders") }),
    React.createElement("div", { key:"wrap", className:"wrap" }, [
      activeTab==="checklist" && React.createElement(DailyChecklistView, { key:"v", isAdmin, myStaff }),
      activeTab==="photos" && React.createElement(ImageReportView, { key:"v", isAdmin, myStaff }),
      activeTab==="customerOrders" && React.createElement(CustomerOrderView, { key:"v", isAdmin, myStaff }),
      activeTab==="weekly" && React.createElement(WeeklyReportView, { key:"v", isAdmin, myStaff }),
      activeTab==="tasks" && React.createElement(TaskAssignView, { key:"v", isAdmin, myStaff }),
      activeTab==="kpi" && React.createElement(KpiView, { key:"v", isAdmin, myStaff }),
      activeTab==="performance" && isAdmin && React.createElement(PerformanceView, { key:"v" }),
      activeTab==="training" && React.createElement(TrainingView, { key:"v", isAdmin, myStaff }),
      activeTab==="kudos" && React.createElement(KudosView, { key:"v", isAdmin, myStaff }),
      activeTab==="staff" && isAdmin && React.createElement(StaffView, { key:"v" }),
    ]),
  ]);
}

function App(){
  const [authState, setAuthState] = useState({ status:"loading" }); // loading | out | in
  const [staff, setStaff] = useState([]);
  const [staffLoaded, setStaffLoaded] = useState(false);

  useEffect(()=>{
    const unsub = auth.onAuthStateChanged(user => {
      setAuthState(user ? { status:"in", user } : { status:"out" });
    });
    return unsub;
  }, []);

  useEffect(()=>{
    if(authState.status!=="in") return;
    const isAdmin = ADMIN_EMAILS.includes(authState.user.email);
    if(isAdmin){ setStaffLoaded(true); return; } // admin không cần danh sách staff để vào app
    const unsub = subscribeCol("staff", rows => { setStaff(rows); setStaffLoaded(true); });
    return unsub;
  }, [authState.status, authState.user && authState.user.uid]);

  if(authState.status==="loading") return React.createElement("div", { style:{ padding:40, textAlign:"center", color:"var(--inkSoft)" } }, "Đang tải...");
  if(authState.status==="out") return React.createElement(LoginScreen, null);

  const user = authState.user;
  const isAdmin = ADMIN_EMAILS.includes(user.email);
  if(!isAdmin && !staffLoaded) return React.createElement("div", { style:{ padding:40, textAlign:"center", color:"var(--inkSoft)" } }, "Đang tải...");
  const myStaff = isAdmin ? null : staff.find(s => s.uid===user.uid);
  if(!isAdmin && !myStaff) return React.createElement(NoStaffLinkedScreen, { user });
  return React.createElement(Dashboard, { user, isAdmin, myStaff });
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>
</body>
</html>
