<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Upharma Ops — Vận hành &amp; Nhân sự</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Upharma Ops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --ink:#233129; --inkSoft:#6B7A70; --paper:#F7F5EE; --card:#FFFFFF; --line:#E1DFD2;
    --pine:#1F6E52; --pineSoft:#DCEFE5; --amber:#D98A1F; --amberSoft:#FBE9CC;
    --clay:#B0483A; --claySoft:#F3DAD5; --gold:#C9A227; --goldSoft:#F6EDCB;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Be Vietnam Pro', system-ui, sans-serif; background:var(--paper); color:var(--ink); }
  #root{ min-height:100vh; }
  .brandFont{ font-family:'Fraunces', serif; }
  input, select, textarea, button{ font-family:inherit; }
  ::-webkit-scrollbar{ height:6px; width:6px; }

  .topnav{ background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  @media (min-width:721px){ .topnav{ display:none; } }
  .topnavInner{ max-width:1280px; margin:0 auto; padding:0 24px; }
  .brandRow{ display:flex; align-items:center; gap:10px; padding:12px 0; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand .mark{ width:24px; height:24px; border-radius:6px; object-fit:contain; flex:none; }
  .brand h1{ font-family:'Fraunces', serif; font-weight:700; font-size:19px; margin:0; }
  .brand small{ display:block; font-size:10.5px; color:var(--inkSoft); letter-spacing:.06em; text-transform:uppercase; margin-top:-2px; }
  .logoutBtn{ font-size:12.5px; color:var(--inkSoft); background:none; border:1px solid var(--line); border-radius:7px; padding:6px 11px; cursor:pointer; }

  .tabs{ display:flex; gap:2px; flex-wrap:wrap; overflow-x:auto; padding-bottom:2px; }
  .tabs button{
    font-family:inherit; font-size:13px; font-weight:700; color:var(--inkSoft);
    background:none; border:none; border-bottom:3px solid transparent; white-space:nowrap;
    padding:10px 13px; cursor:pointer; flex:none; position:relative;
  }
  .tabs button.active{ color:var(--pine); border-bottom-color:var(--pine); }

  .mobileHomeGrid{ display:none; } /* chỉ hiện trên mobile, bật lại trong @media bên dưới */
  .mobileTile{ display:flex; flex-direction:column; align-items:center; gap:7px; background:none; border:none; cursor:pointer; padding:4px 2px; font-family:inherit; }
  .mobileTileIcon{
    width:56px; height:56px; border-radius:17px; display:flex; align-items:center; justify-content:center;
    font-size:24px; color:#fff; box-shadow:0 2px 7px rgba(0,0,0,0.16); position:relative;
  }
  .mobileTileBadge{
    position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 4px; border-radius:9px;
    background:#fff; color:var(--clay,#c0392b); font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
    border:2px solid currentColor; line-height:1;
  }
  .mobileTileLabel{ font-size:11px; font-weight:700; color:var(--ink); text-align:center; line-height:1.25; }
  .mobileBackBar{
    display:none; align-items:center; gap:8px; margin:-14px -12px 14px; padding:13px 12px;
    border-bottom:1px solid var(--line); font-weight:700; font-size:14.5px; color:var(--pine);
    background:#fff; cursor:pointer; position:sticky; top:0; z-index:5;
  }
  .mobileBackBar .arrow{ font-size:17px; line-height:1; }
  .unreadBadge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:17px; height:17px; padding:0 4px; border-radius:9px;
    background:var(--clay, #c0392b); color:#fff; font-size:10.5px; font-weight:800;
    line-height:1; margin-left:6px; vertical-align:middle;
  }

  .wrap{ max-width:1280px; margin:0 auto; padding:20px 24px 90px; }
  .pagetitle{ font-family:'Fraunces', serif; font-size:24px; font-weight:700; margin:0 0 4px; }
  .pagesub{ color:var(--inkSoft); font-size:13px; margin:0 0 18px; }

  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .cardTitle{ font-size:13.5px; font-weight:700; margin-bottom:10px; }

  .btn{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:9px 15px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .btn:hover{ border-color:var(--pine); }
  .btnPrimary{ background:var(--pine); border-color:var(--pine); color:#fff; }
  .btnPrimary:hover{ background:#175a42; }
  .btnAmber{ background:var(--amber); border-color:var(--amber); color:#fff; }
  .btnGhost{ background:transparent; }
  .btnDanger{ background:#fff; border-color:var(--claySoft); color:var(--clay); }
  .btnRow{ display:flex; gap:8px; flex-wrap:wrap; }

  .field label{ display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:#4A4A40; }
  .field input, .field select, .field textarea{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; }

  .metrics{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px; }
  .metric{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
  .metric .label{ font-size:10.5px; font-weight:700; color:var(--inkSoft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px; }
  .metric .value{ font-family:'Fraunces',serif; font-size:21px; font-weight:700; }
  .metric.warn .value{ color:var(--clay); }
  .metric.good .value{ color:var(--pine); }
  .metric.gold .value{ color:var(--gold); }

  .revBoard{ border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:18px; box-shadow:0 3px 14px rgba(35,49,41,.08); }
  .revBoardGrid{ display:grid; grid-template-columns:1fr 1fr; }
  @media (max-width:720px){ .revBoardGrid{ grid-template-columns:1fr; } }
  .revCol + .revCol{ border-left:2px solid var(--line); }
  @media (max-width:720px){ .revCol + .revCol{ border-left:none; border-top:2px solid var(--line); } }
  .revColHead{ color:#fff; font-weight:800; font-size:14px; text-align:center; padding:12px 8px; letter-spacing:.03em; text-transform:uppercase; text-shadow:0 1px 2px rgba(0,0,0,.15); }
  .revColHead.left{ background:linear-gradient(135deg, var(--pine), #12523d); }
  .revColHead.right{ background:linear-gradient(135deg, var(--amber), #b56f10); }
  .revRow{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 14px; font-size:13.5px; border-bottom:1px solid #EFEDE0; }
  .revRow:last-child{ border-bottom:none; }
  .revCol:first-child .revRow.stripe{ background:var(--pineSoft); }
  .revCol:last-child .revRow.stripe{ background:var(--amberSoft); }
  .revRow .revLabel{ color:var(--ink); font-weight:700; }
  .revRow.derived .revLabel{ color:var(--clay); font-weight:800; }
  .revRow .revValue{ font-weight:800; font-size:14.5px; white-space:nowrap; }
  .revRow.derived .revValue{ color:var(--clay); font-size:15.5px; }
  .revRow.good{ background:var(--pineSoft) !important; }
  .revRow.good .revValue{ color:var(--pine); font-size:16px; }
  .revRow.warn{ background:var(--claySoft) !important; }
  .revRow.warn .revValue{ color:var(--clay); font-size:16px; }
  .revMetaBar{ display:flex; flex-wrap:wrap; gap:14px; padding:10px 14px; background:#233129; font-size:12.5px; color:#D9E4DC; border-bottom:1px solid var(--line); }
  .revMetaBar b{ color:#fff; }

  .tableWrap{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:20px; }
  table.data{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px; }
  table.data th{ text-align:left; background:#F5F2E7; padding:9px 10px; font-weight:700; color:#5A5748; border-bottom:1px solid var(--line); white-space:nowrap; font-size:11px; text-transform:uppercase; }
  table.data td{ padding:8px 10px; border-bottom:1px solid #F0EEE2; vertical-align:middle; }
  table.data tr:last-child td{ border-bottom:none; }
  table.data input, table.data select{ width:100%; border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:5px; font-size:12.5px; }
  table.data input:hover, table.data select:hover{ border-color:var(--line); }
  .pill{ display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; }
  .emptyState{ text-align:center; padding:34px 16px; color:var(--inkSoft); font-size:13px; }
  .salesGridRow{ cursor:pointer; }
  .salesGridRow:hover td{ background:var(--paper); }

  .modalOverlay{ position:fixed; inset:0; background:rgba(35,49,41,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal{ background:#fff; border-radius:14px; width:520px; max-width:100%; max-height:88vh; overflow-y:auto; padding:22px 22px 18px; }
  .modalWide{ width:640px; }
  .modalFull{ width:min(96vw, 1180px); max-height:94vh; }
  .reviewRow{ display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:10px 0; border-bottom:1px solid #F0EEE2; }
  .reviewRow .lbl{ font-size:10.5; font-weight:700; color:var(--inkSoft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px; }
  @media (max-width:720px){ .reviewRow{ grid-template-columns:1fr; } }

  .progressOuter{ background:#EFEDE0; border-radius:20px; height:8px; overflow:hidden; flex:1; }
  .progressInner{ height:100%; border-radius:20px; background:var(--pine); transition:width .25s; }
  .whoBar{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
  .whoBar select{ padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; }
  .checkItem{ display:flex; align-items:flex-start; gap:9px; padding:9px 4px; border-bottom:1px solid #F0EEE2; font-size:13px; cursor:pointer; }
  .checkItem:last-child{ border-bottom:none; }
  .checkItem input{ margin-top:2px; }
  .checkItem.done span.lbl{ color:var(--inkSoft); text-decoration:line-through; }
  .starBtns{ display:flex; gap:4px; }
  .starBtns button{ border:none; background:none; cursor:pointer; font-size:18px; padding:2px; opacity:.35; }
  .starBtns button.on{ opacity:1; }
  .shopBadge{ font-size:10.5px; font-weight:700; color:var(--inkSoft); background:#F0EEE2; padding:2px 8px; border-radius:20px; }
  .photoGrid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .photoThumb{ position:relative; width:78px; height:78px; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .photoThumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photoThumb .rm{ position:absolute; top:2px; right:2px; background:rgba(35,49,41,.7); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; line-height:18px; text-align:center; cursor:pointer; padding:0; }
  .uploadBtn{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:8px 13px; border-radius:8px; border:1px dashed var(--line); background:#fff; color:var(--inkSoft); cursor:pointer; }
  .uploadBtn input{ display:none; }

  .taskExtra{ margin-left:28px; margin-top:6px; margin-bottom:4px; display:flex; flex-direction:column; gap:8px; max-width:460px; }
  .taskTimeRow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .taskTimeItem{ display:flex; align-items:center; gap:8px; }
  .taskTimeRow .taskTimeLbl{ font-size:11.5px; color:var(--inkSoft); white-space:nowrap; }
  .taskTimeRow input[type=time]{ padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  .taskResultInput{ padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; width:100%; resize:vertical; font-family:inherit; min-height:34px; }
  .taskAttachRow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .taskAttachBtn{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:7px; border:1px dashed var(--line); background:#fff; color:var(--inkSoft); cursor:pointer; white-space:nowrap; }
  .taskAttachBtn input{ display:none; }
  .autoGrow{ resize:none; overflow:hidden; min-height:38px; line-height:1.4; }
  .taskLinkInput{ padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; width:100%; }
  .taskFileList{ display:flex; flex-wrap:wrap; gap:7px; }
  .taskFileChip{ position:relative; display:flex; align-items:center; }
  .taskFileChip img{ width:56px; height:56px; object-fit:cover; border-radius:7px; border:1px solid var(--line); display:block; }
  .taskFileChip .docChip{ display:flex; align-items:center; gap:5px; max-width:150px; padding:6px 9px; border:1px solid var(--line); border-radius:7px; background:var(--paper); font-size:11.5px; color:var(--ink); text-decoration:none; }
  .taskFileChip .docChip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .taskFileChip .rmFile{ position:absolute; top:-6px; right:-6px; background:var(--clay); color:#fff; border:none; border-radius:50%; width:17px; height:17px; font-size:10px; line-height:17px; text-align:center; cursor:pointer; padding:0; }

  .weeklyCatBlock{ margin-bottom:20px; }
  .weeklyCatTitle{ font-weight:700; font-size:13.5px; margin-bottom:9px; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .weeklyCatTitle .dot{ width:8px; height:8px; border-radius:50%; background:var(--pine); flex:none; }
  .weeklyRow{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; background:#fff; }
  .weeklyRowGrid{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .weeklyRowGrid > div{ flex:1 1 220px; min-width:0; }
  .weeklyRowLbl{ font-size:11px; font-weight:600; color:var(--inkSoft); margin-bottom:4px; display:block; }
  .weeklyReadonly{ font-size:13px; color:var(--ink); background:var(--paper); border-radius:6px; padding:8px 9px; min-height:20px; white-space:pre-wrap; }
  .weeklyRowRemove{ border:none; background:none; color:var(--clay); cursor:pointer; font-size:11.5px; font-weight:600; padding:2px 4px; }
  .weeklySectionHead{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .weeklySectionHint{ font-size:12px; color:var(--inkSoft); margin-bottom:14px; }

  .progressGrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin-bottom:6px; }
  .progressBlock{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:var(--paper); }
  .progressBlockTitle{ font-weight:700; font-size:13.5px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .progressBlockTitle .dot{ width:8px; height:8px; border-radius:50%; background:var(--amber); flex:none; }
  .progressInputRow{ display:flex; gap:10px; margin-bottom:12px; }
  .progressInputRow .field{ flex:1 1 0; }
  .progressStats{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .progressStatRow{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; padding:3px 0; }
  .progressStatRow .k{ color:var(--inkSoft); }
  .progressStatRow .v{ font-weight:700; }
  .progressBarRow{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .progressBarPct{ font-size:12px; font-weight:700; white-space:nowrap; min-width:38px; text-align:right; }
  .readonlyBox{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:12.5px; color:var(--ink); white-space:pre-wrap; min-height:38px; }
  .pickerWrap{ position:relative; }
  .pickerList{ position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:8px; max-height:220px; overflow-y:auto; z-index:30; box-shadow:0 6px 18px rgba(35,49,41,.12); }
  .pickerItem{ padding:9px 11px; font-size:13px; cursor:pointer; }
  .pickerItem:hover{ background:var(--pineSoft); }
  .pickerEmpty{ padding:9px 11px; font-size:12.5px; color:var(--inkSoft); }
  .pickerSelected{ display:flex; align-items:center; justify-content:space-between; gap:8px; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:13.5px; background:#fff; }
  .pickerChange{ font-size:11.5px; font-weight:600; color:var(--pine); background:none; border:none; cursor:pointer; padding:2px 4px; white-space:nowrap; }
  .fieldRow{ display:flex; }

  /* ===== Sidebar layout (giao diện kiểu Hệ thống Upharma) — chỉ áp dụng từ 721px trở lên ===== */
  .sidebar{ display:none; }
  .topbarDesktop{ display:none; }
  @media (min-width:721px){
    .sidebar{
      display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; width:236px;
      background:linear-gradient(180deg, #1B5E42, #123F2C); color:#EAF3EE; z-index:30; overflow-y:auto;
    }
    .sidebarBrand{ display:flex; align-items:center; gap:10px; padding:18px 18px 16px; border-bottom:1px solid rgba(255,255,255,.12); }
    .sidebarBrand .mark{ width:38px; height:38px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; padding:5px; flex:none; overflow:hidden; }
    .sidebarBrand .mark img{ width:100%; height:100%; object-fit:contain; }
    .sidebarBrand h1{ font-family:'Fraunces',serif; font-size:15.5px; font-weight:700; margin:0; color:#fff; line-height:1.2; }
    .sidebarBrand small{ display:block; font-size:10px; color:#9FC4AE; text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
    .sidebarNav{ flex:1; padding:12px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
    .sidebarItem{
      display:flex; align-items:center; gap:11px; width:100%; text-align:left; font-family:inherit;
      font-size:13.5px; font-weight:600; color:#CFE4D9; background:none; border:none; border-radius:9px;
      padding:10px 12px; cursor:pointer; position:relative;
    }
    .sidebarItem .sIcon{ width:20px; display:inline-flex; align-items:center; justify-content:center; flex:none; }
    .sidebarItem .sLabel{ flex:1; }
    .sidebarItem:hover{ background:rgba(255,255,255,.08); color:#fff; }
    .sidebarItem.active{ background:rgba(255,255,255,.16); color:#fff; }
    .sidebarItem.active::before{ content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:2px; background:var(--gold); }
    .sidebarBadge{
      min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--clay); color:#fff;
      font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none;
    }
    .sidebarFoot{ padding:12px 16px 16px; border-top:1px solid rgba(255,255,255,.12); }
    .sidebarLogout{ width:100%; font-size:12px; font-weight:600; color:#CFE4D9; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:8px 10px; cursor:pointer; }
    .sidebarLogout:hover{ background:rgba(255,255,255,.12); color:#fff; }

    .topbarDesktop{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      position:fixed; top:0; left:236px; right:0; height:64px; background:#fff;
      border-bottom:1px solid var(--line); z-index:25; padding:0 26px;
    }
    .topbarTitle{ display:flex; flex-direction:column; gap:1px; min-width:0; }
    .topbarTitle .t{ font-family:'Fraunces',serif; font-weight:700; font-size:17.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .topbarTitle .s{ font-size:11.5px; color:var(--inkSoft); }
    .topbarRight{ display:flex; align-items:center; gap:16px; flex:none; }
    .topbarBell{ position:relative; width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:default; }
    .topbarBellBadge{ position:absolute; top:-6px; right:-6px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--clay); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }

async function compressImage(file, maxDim, quality){
  // Thu nhỏ & nén ảnh trước khi tải lên. Lấy kích thước gốc qua thẻ <img> trước
  // (rẻ hơn giải mã toàn bộ ảnh), rồi yêu cầu trình duyệt tự giải mã kèm thu nhỏ
  // luôn (createImageBitmap resize) — nhanh hơn nhiều so với giải mã full-size
  // rồi mới vẽ thu nhỏ, đặc biệt trên điện thoại đời thấp.
  const dim = maxDim || 1280;
  const q = quality || 0.65;
  try{
    const { w, h } = await new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => { const r = { w:img.naturalWidth, h:img.naturalHeight }; URL.revokeObjectURL(url); resolve(r); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
    let targetW = w, targetH = h;
    if(w > dim || h > dim){
      const scale = dim / Math.max(w, h);
      targetW = Math.max(1, Math.round(w * scale));
      targetH = Math.max(1, Math.round(h * scale));
    }
    let bitmap;
    try{ bitmap = await createImageBitmap(file, { resizeWidth:targetW, resizeHeight:targetH, resizeQuality:"medium" }); }
    catch(e){ bitmap = await createImageBitmap(file); }
    const canvas = document.createElement("canvas");
    canvas.width = targetW; canvas.height = targetH;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, targetW, targetH);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", q));
    return blob || file;
  } catch(err){
    console.error("Nén ảnh lỗi, dùng ảnh gốc:", err);
    return file;
  }
}
async function uploadImageFile(file, path, onProgress){
  const toUpload = (file.type && file.type.startsWith("image/")) ? await compressImage(file) : file;
  const ref = storage.ref().child(path);
  const task = ref.put(toUpload, { contentType:"image/jpeg" });
  await new Promise((resolve, reject) => {
    task.on("state_changed",
      snap => { if(onProgress && snap.totalBytes) onProgress(Math.round(snap.bytesTransferred/snap.totalBytes*100)); },
      reject,
      resolve
    );
  });
  return await ref.getDownloadURL();
}
async function uploadTaskAttachmentFile(file, path, onProgress){
  // Giống uploadImageFile nhưng giữ nguyên loại tệp (ảnh sẽ được nén,
  // các tệp khác như PDF/Word/Excel được tải lên nguyên bản).
  const isImage = file.type && file.type.startsWith("image/");
  const toUpload = isImage ? await compressImage(file) : file;
  const ref = storage.ref().child(path);
  const task = ref.put(toUpload, { contentType: isImage ? "image/jpeg" : (file.type || "application/octet-stream") });

    task.on("state_changed",
      snap => { if(onProgress && snap.totalBytes) onProgress(Math.round(snap.bytesTransferred/snap.totalBytes*100)); },
      reject,
      resolve
    );
  });
  const url = await ref.getDownloadURL();
  return { url, name:file.name, type: isImage ? "image" : "file" };
}

// ================= FIRESTORE HELPERS =================
// Ghi lại 1 lỗi hệ thống (Firestore listener lỗi, JS lỗi không bắt được, promise bị reject...) vào
// collection "systemErrors" để Quản lý nhận được thông báo đẩy (qua SystemError listener trong
// TaskLiveNotifier) ngay cả khi không đang mở đúng màn hình xảy ra lỗi.
// Các lỗi vô hại/đã biết, không đáng để làm phiền Quản lý bằng thông báo — chỉ log ra console
// để debug khi cần, không ghi vào systemErrors.
const IGNORED_ERROR_PATTERNS = [
  "Attempt to get records from database without an in-progress transaction", // Firestore mở nhiều tab cùng lúc
];
async function logSystemError(source, err){
  console.error(source, err);
  const msg = (err && err.message) ? String(err.message) : String(err || "");
  if(IGNORED_ERROR_PATTERNS.some(p => msg.includes(p))) return;
  try{
    await db.collection("systemErrors").add({
      source: String(source),
      message: msg || "Lỗi không rõ",
      code: (err && err.code) ? String(err.code) : "",
      stack: (err && err.stack) ? String(err.stack).slice(0, 1500) : "",
      url: (typeof location!=="undefined" ? location.href : ""),
      userEmail: (typeof auth!=="undefined" && auth.currentUser && auth.currentUser.email) || "",
      createdAtTs: firebase.firestore.FieldValue.serverTimestamp(),
    });
  } catch(e){ console.error("Không ghi được systemErrors:", e); }
}
function subscribeCol(name, cb, orderField){
  let q = db.collection(name);
  if(orderField) q = q.orderBy(orderField, "desc");
  return q.onSnapshot(snap => cb(snap.docs.map(d => ({ id:d.id, ...d.data() }))), err => logSystemError(name, err));
}
// Bắt lỗi JS không được try/catch xử lý và promise bị reject nhưng không .catch — để không
// còn lỗi "ngầm" nào lọt lưới, tất cả đều được ghi vào systemErrors cho Quản lý.
window.addEventListener("error", e => logSystemError("window.onerror", e.error || e.message));
window.addEventListener("unhandledrejection", e => logSystemError("unhandledrejection", e.reason));

// Ghi/xoá field lồng nhau (dạng "a.b.c") một cách CHẮC CHẮN: update() đảm bảo field-path
// kèm FieldValue.delete() hoạt động đúng (set()+merge với key dạng dot-path không đáng tin
// cậy cho việc xoá — đây là nguyên nhân khiến bỏ tick trước đây không có tác dụng thật sự).
// Nếu tài liệu chưa tồn tại (lần ghi đầu tiên trong ngày/tuần), update() sẽ báo lỗi not-found,
// lúc đó tạo mới bằng set() bình thường (không cần xoá gì vì tài liệu mới toanh).
async function mergeDotFields(collectionName, docId, dotFields, createExtras){
  const ref = db.collection(collectionName).doc(docId);
  try{ await ref.update(dotFields); }
  catch(err){ await ref.set({ ...(createExtras||{}), ...dotFields }, { merge:true }); }
}
// Định dạng 1 sheet Excel cho dễ đọc: tự giãn độ rộng cột theo nội dung dài nhất, tô đậm +
// đổ màu dòng tiêu đề, kẻ viền toàn bảng, căn giữa tiêu đề, số căn phải/chữ căn trái, so le
// màu dòng cho dễ dò — dùng chung cho MỌI file Excel xuất ra.
function styleExportSheet(ws, rows){
  if(!rows || rows.length===0) return;
  const headers = Object.keys(rows[0]);
  // Độ rộng cột tính theo NỘI DUNG DỮ LIỆU (không theo độ dài tiêu đề) — tiêu đề dài sẽ tự
  // xuống dòng trong ô nhờ wrapText + dòng tiêu đề cao hơn, thay vì kéo cột rộng lê thê.
  ws["!cols"] = headers.map(h => {
    let maxLen = 8;
    rows.forEach(r => { const v = r[h]; if(v!=null){ const len = String(v).length; if(len>maxLen) maxLen = len; } });
    return { wch: Math.max(9, Math.min(22, maxLen + 2)) };
  });
  ws["!rows"] = [{ hpt: 48 }];
  const thinBorder = { style:"thin", color:{ rgb:"D9D6C8" } };
  const headerStyle = {
    font: { bold:true, sz:10.5, color:{ rgb:"FFFFFF" } },
    fill: { fgColor:{ rgb:"1F6E52" } },
    alignment: { horizontal:"center", vertical:"center", wrapText:true },
    border: { top:thinBorder, bottom:thinBorder, left:thinBorder, right:thinBorder },
  };
  const range = XLSX.utils.decode_range(ws["!ref"]);
  for(let C = range.s.c; C <= range.e.c; C++){
    const headAddr = XLSX.utils.encode_cell({ r:0, c:C });
    if(ws[headAddr]) ws[headAddr].s = headerStyle;
    for(let R = 1; R <= range.e.r; R++){
      const addr = XLSX.utils.encode_cell({ r:R, c:C });
      const cell = ws[addr];
      if(!cell) continue;
      const isNum = typeof cell.v === "number";
      cell.s = {
        font: { sz:11 },
        alignment: { vertical:"center", horizontal: isNum ? "right" : "left", wrapText:false },
        border: { top:thinBorder, bottom:thinBorder, left:thinBorder, right:thinBorder },
        fill: R % 2 === 0 ? { fgColor:{ rgb:"F7F5EE" } } : undefined,
      };
    }
  }
}

function DailyChecklistView({ isAdmin, myStaff }){
  const [staff, setStaff] = useState([]);
  const [templates, setTemplates] = useState(DEFAULT_DAILY_CHECKLISTS);
  const [reports, setReports] = useState({});
  const [selfId] = useState(myStaff ? myStaff.id : "");
  const [note, setNote] = useState("");
  const [showTplEditor, setShowTplEditor] = useState(false);
  // Cửa hàng trưởng được xem checklist ngày của nhân viên CÙNG cửa hàng mình
  // (không phải toàn hệ thống như quản lý khu vực/admin).
  const isShopManager = !isAdmin && !!myStaff && myStaff.role==="Cửa hàng trưởng";
  const [adminOpen, setAdminOpen] = useState(isAdmin || isShopManager);
  const [adminShop, setAdminShop] = useState(isShopManager && myStaff ? myStaff.shop : "Tất cả");
  const [adminDate, setAdminDate] = useState(todayISO());
  const [reviewReportId, setReviewReportId] = useState(null);
  // Ghi đè lạc quan (optimistic) cho ô tick — giúp UI phản hồi tick/bỏ tick
  // ngay lập tức thay vì chờ vòng lặp ghi lên Firestore, và tự khôi phục nếu lỗi.
  const [pendingDone, setPendingDone] = useState({});
  const [uploadingTask, setUploadingTask] = useState({});
  const [newTaskLabel, setNewTaskLabel] = useState("");
  const [addingTask, setAddingTask] = useState(false);

  useEffect(()=>{
    const u1 = subscribeCol("staff", setStaff);
    const u2 = subscribeConfigDoc("dailyChecklist", d => setTemplates(d && d.byRole ? d.byRole : DEFAULT_DAILY_CHECKLISTS));
    const u3 = subscribeCol("dailyReports", rows => { const map = {}; rows.forEach(r => map[r.id] = r); setReports(map); });
    return ()=>{ u1(); u2(); u3(); };
  }, []);

  const today = todayISO();
  const selfStaff = staff.find(s => s.id===selfId);
  const templateTasks = selfStaff ? (templates[selfStaff.role] || []) : [];
  const selfReportId = selfStaff ? dailyReportId(selfStaff.id, today) : null;
  const selfReport = selfReportId ? reports[selfReportId] : null;
  const customTasksMap = selfReport ? (selfReport.customTasks || {}) : {};
  // Việc do nhân viên tự thêm ngoài checklist chuẩn của vai trò, được lưu riêng
  // trong chính báo cáo của ngày hôm đó (không ảnh hưởng tới checklist mẫu chung).
  const customTasksList = Object.keys(customTasksMap).map(id => ({ id, label:customTasksMap[id], custom:true }));
  const selfTasks = [...templateTasks, ...customTasksList];
  const doneMap = selfReport ? (selfReport.doneIds || {}) : {};
  // Kết hợp dữ liệu từ máy chủ với các ghi đè lạc quan còn treo (chưa xác nhận xong)
  // để đếm số việc đã hoàn thành phản ánh đúng những gì người dùng vừa bấm.
  const effectiveDoneMap = { ...doneMap };
  Object.keys(pendingDone).forEach(k => { if(pendingDone[k]) effectiveDoneMap[k]=true; else delete effectiveDoneMap[k]; });
  const doneCount = Object.keys(effectiveDoneMap).filter(k => effectiveDoneMap[k]).length;
  const pct = selfTasks.length ? Math.round(doneCount/selfTasks.length*100) : 0;
  const taskDetailsMap = selfReport ? (selfReport.taskDetails || {}) : {};

  useEffect(()=>{ setNote(selfReport ? (selfReport.ghiChu || "") : ""); }, [selfReportId, selfReport && selfReport.ghiChu]);

  // Một khi dữ liệu máy chủ đã khớp với ghi đè lạc quan, bỏ ghi đè đó đi
  // để giao diện quay lại theo dõi trạng thái thật từ Firestore.
  useEffect(()=>{
    setPendingDone(prev => {
      const keys = Object.keys(prev);
      if(keys.length===0) return prev;
      let changed = false;
      const next = { ...prev };
      keys.forEach(k => { if(!!doneMap[k] === !!prev[k]){ delete next[k]; changed = true; } });
      return changed ? next : prev;
    });
  }, [doneMap]);

  async function toggleTask(taskId, checked){
    if(!selfStaff) return;
    // Cập nhật giao diện ngay lập tức (lạc quan) để tick/bỏ tick luôn phản hồi tức thì,
    // không phụ thuộc độ trễ mạng hay vòng lặp ghi lên Firestore.
    setPendingDone(prev => ({ ...prev, [taskId]:checked }));
    const payload = {
      staffId:selfStaff.id, staffName:selfStaff.name, shop:selfStaff.shop, role:selfStaff.role,
      ngay:today, trangThai: selfReport ? (selfReport.trangThai || "Nháp") : "Nháp",
      updatedAtTs: firebase.firestore.FieldValue.serverTimestamp(),
    };
    // Dùng field path dạng "doneIds.taskId" để chỉ thêm/xoá đúng 1 mục —
    // gửi cả object doneIds rồi merge sẽ KHÔNG xoá được key vắng mặt,
    // đây là lý do bỏ tick trước đây không có tác dụng.
    payload[`doneIds.${taskId}`] = checked ? true : firebase.firestore.FieldValue.delete();
    try{
      await mergeDotFields("dailyReports", selfReportId, payload);
    } catch(err){
      console.error("toggleTask lỗi:", err);
      // Ghi lỗi — khôi phục lại trạng thái tick trước đó và báo cho người dùng.
      setPendingDone(prev => { const n = { ...prev }; delete n[taskId]; return n; });
      window.alert("Không thể lưu thay đổi (kiểm tra kết nối mạng) — vui lòng thử lại.");
    }
  }
  async function saveTaskHours(taskId, soGio){
    if(!selfStaff) return;
    await mergeDotFields("dailyReports", selfReportId, {
      staffId:selfStaff.id, staffName:selfStaff.name, shop:selfStaff.shop, role:selfStaff.role, ngay:today,
      [`taskDetails.${taskId}.soGio`]: soGio===""? "" : Number(soGio),
      updatedAtTs: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }
  async function addCustomTask(){
    const label = newTaskLabel.trim();
    if(!label || !selfStaff) return;
    const id = "custom_" + uid();
    setAddingTask(true);
    try{
      await mergeDotFields("dailyReports", selfReportId, {
        staffId:selfStaff.id, staffName:selfStaff.name, shop:selfStaff.shop, role:selfStaff.role,
        ngay:today, trangThai: selfReport ? (selfReport.trangThai || "Nháp") : "Nháp",
        [`customTasks.${id}`]: label,
        updatedAtTs: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setNewTaskLabel("");
    } catch(err){
      console.error("addCustomTask lỗi:", err);
      window.alert("Không thể thêm việc mới — vui lòng thử lại.");
    } finally {
      setAddingTask(false);
    }
  }
  async function removeCustomTask(taskId){
    if(!selfStaff) return;
    if(!window.confirm("Xoá đầu việc tự thêm này khỏi báo cáo hôm nay?")) return;

function mondayOf(iso){
  const d = new Date(iso + "T00:00:00");
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

function monthOf(iso){ return iso.slice(0,7); }
function dayNumOf(iso){ return Number(iso.slice(8,10)); }
function daysInMonthOf(iso){ const y=Number(iso.slice(0,4)), m=Number(iso.slice(5,7)); return new Date(y,m,0).getDate(); }
function lastDayOfMonthOf(iso){ return iso.slice(0,8) + String(daysInMonthOf(iso)).padStart(2,"0"); }
// Ngày mốc để tính luỹ kế dự kiến: nếu là tuần hiện tại thì lấy hôm nay, nếu là tuần đã qua thì lấy Chủ nhật
// cuối tuần đó — nếu ngày mốc lệch sang tháng khác thì chốt ở ngày cuối cùng của tháng báo cáo (tháng của thứ Hai).
function weekProgressRefDate(tuanNgay, isCurrentWeek){
  const cand = isCurrentWeek ? todayISO() : addDays(tuanNgay, 6);
  return monthOf(cand)===monthOf(tuanNgay) ? cand : lastDayOfMonthOf(tuanNgay);
}
// Luỹ kế dự kiến = chỉ tiêu tháng * (số ngày đã qua trong tháng tính đến ngày mốc / tổng số ngày của tháng đó).
// Với chỉ tiêu dạng "trung bình" (VD: trung bình bill) thì không cộng dồn theo ngày — chỉ tiêu chính là mốc so sánh.
function expectedCumulative(target, refIso, agg){
  const t = Number(target) || 0;
  if(!t) return 0;
  if(agg==="avg") return t;
  const total = daysInMonthOf(refIso);
  const elapsed = Math.min(dayNumOf(refIso), total);
  return t * elapsed / total;
}
// Cộng dồn "thực tế đạt được trong tuần" của tất cả các tuần thuộc cùng 1 tháng báo cáo (tính đến & bao gồm tuần
// đang xét). Với chỉ tiêu dạng "trung bình" thì lấy TRUNG BÌNH các tuần đã nhập thay vì cộng dồn (vì cộng dồn
// nhiều giá trị trung bình bill của từng tuần lại không có ý nghĩa).
function monthActualCumulative(allReports, shop, monthStr, uptoMonday, key, agg){
  const rows = allReports.filter(r => r.shop===shop && r.tuanNgay<=uptoMonday && monthOf(r.tuanNgay)===monthStr);
  if(agg==="avg"){
    const withVal = rows.filter(r => r[key] && Number(r[key].actualWeek));
    if(withVal.length===0) return 0;
    return withVal.reduce((sum,r) => sum + Number(r[key].actualWeek), 0) / withVal.length;
  }
  return rows.reduce((sum,r) => sum + (Number(r[key] && r[key].actualWeek) || 0), 0);
}
// Chỉ tiêu tháng chỉ cần nhập 1 lần đầu tháng — các tuần sau tự kế thừa chỉ tiêu gần nhất trong cùng tháng.
function latestMonthTarget(allReports, shop, monthStr, beforeMonday, key){
  const list = allReports
    .filter(r => r.shop===shop && monthOf(r.tuanNgay)===monthStr && r.tuanNgay<beforeMonday && r[key] && Number(r[key].target))
    .sort((a,b)=> a.tuanNgay<b.tuanNgay?1:-1);
  return list.length>0 ? list[0][key].target : "";
}

function AutoGrowTextarea({ className, value, onChange, ...rest }){
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }, [value]);
  return React.createElement("textarea", {
    ...rest, ref, rows:1, value, onChange,
    className: (className || "") + " autoGrow",
    onInput: e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; },
  });
}

function kpiRoleKey(staffRole){ return staffRole==="Cửa hàng trưởng" ? "CHT" : "NVBH"; }

// Tính điểm KPI thực tế cho 1 chỉ tiêu, theo đúng công thức từng loại cách chấm.
function kpiCalcItemScore(item, target, actual){
  const diem = item.diem;
  if(item.cachCham==="nhi_phan"){
    return actual==="Đạt" ? diem : 0;
  }
  if(item.cachCham==="ty_le_truc_tiep"){
    const pct = Number(actual)||0;
    return Math.max(0, Math.min(1, pct/100)) * diem;
  }
  // nguong60 / nguong60_max120
  const t = Number(target)||0, a = Number(actual);
  if(!t || actual===""||actual==null||isNaN(a)) return null; // chưa đủ dữ liệu để tính
  let pct = a / t;
  if(pct < 0.6) return 0;
  if(item.cachCham==="nguong60_max120") pct = Math.min(pct, 1.2);
  return pct * diem;
}
function kpiTotalPlan(groups){ return groups.reduce((s,g)=> s + g.items.reduce((s2,it)=>s2+it.diem,0), 0); }
function kpiTotalActual(groups, targets, actuals){
  let sum = 0, hasAny = false;
  groups.forEach(g => g.items.forEach(it => {
    const sc = kpiCalcItemScore(it, targets[it.id], actuals[it.id]);
    if(sc!=null){ sum += sc; hasAny = true; }
  }));
  return hasAny ? sum : null;
}
function kpiXepLoai(pct){ if(pct==null) return "—"; return pct>=0.85 ? "Đạt thưởng" : "Chưa đạt"; }
function kpiCtahId(staffId, thang){ return staffId + "_" + thang; }
// Tính điểm cộng/trừ từ "Các tiêu chí ảnh hưởng" (CTAH) — đào tạo, tác phong, chuyên cần...
// theo đúng quy tắc trong file mẫu. Trả về { adj, khongXet } — khongXet = true khi vi phạm
// tác phong/thái độ lần thứ 3 trở lên, nghĩa là tháng đó KHÔNG được xét KPI (không tính %).
function kpiCtahCalc(doc){
  if(!doc) return { adj:0, khongXet:false };
  let adj = 0, khongXet = false;
  // Đào tạo
  if(doc.baiKiemTra!=null && doc.baiKiemTra!==""){
    const d = Number(doc.baiKiemTra);
    if(d < 60) adj -= 50; else if(d >= 99) adj += 50;
  }
  adj -= 20 * (Number(doc.hopNhomThieu)||0);
  if(doc.rolePlay==="Không đạt") adj -= 50;
  if(doc.tuHocLoTrinh==="Không đạt") adj -= 50;
  adj -= 20 * (Number(doc.coachingThieu)||0); // chỉ áp dụng CHT/Phụ trách cửa hàng
  // Tác phong & vận hành — cùng quy tắc "số lần vi phạm": lần 1: -5, lần 2: -10, lần 3 trở lên: không xét KPI
  ["dongPhucLan","thaiDoLan","bangGiaoCaLan","veSinhLan","kiemKeLan","congViecKhacLan"].forEach(f => {
    const n = Number(doc[f])||0;
    if(n===1) adj -= 5;
    else if(n===2) adj -= 10;
    else if(n>=3) khongXet = true;
  });
  // Chuyên cần — riêng: lần 1 (nghỉ đúng phép/có xin phép) không trừ, lần 2: -5, lần 3: -10, lần 4 trở lên: không xét KPI
  const cc = Number(doc.chuyenCanLan)||0;
  if(cc===2) adj -= 5;
  else if(cc===3) adj -= 10;
  else if(cc>=4) khongXet = true;
  // Phát hiện kiểm kê không trung thực: không tính điểm KPI phần này (xử lý lương tách riêng, ngoài KPI)
  if(doc.kiemKeGianLan) khongXet = true;
  return { adj, khongXet };
}
// CTAH riêng cho Quản lý địa bàn (QLKV) — công thức khác với NVBH/CHT theo đúng file mẫu:
// bài kiểm tra không có mức thưởng +50, role play có 3 mức, tự học LMS trừ 20 (không phải 50),
// và có thêm mục "duyệt kế hoạch web NVBH" tính theo số NVBH bị ảnh hưởng.
function kpiCtahQlkvCalc(doc){
  if(!doc) return { adj:0 };
  let adj = 0;
  if(doc.baiKiemTra!=null && doc.baiKiemTra!==""){
    if(Number(doc.baiKiemTra) < 60) adj -= 50;
  }
  adj -= 20 * (Number(doc.hopNhomThieu)||0);
  if(doc.rolePlay==="Không đạt") adj -= 10;
  else if(doc.rolePlay==="Không thực hiện") adj -= 20;
  if(doc.tuHocLMS==="Không đạt") adj -= 20;
  adj -= 20 * (Number(doc.soNvbhKhongDuyet)||0);
  return { adj };
}

  async function importKpiExcel(file){
    setImporting(true); setImportMsg(null);
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array" });
      let matched = 0, unmatched = [];
      for(const sheetName of wb.SheetNames){
        const roleKey = sheetName.toUpperCase().includes("CHT") ? "CHT" : "NVBH";
        const groups = templates[roleKey];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval:"" });
        for(const row of rows){
          const ten = (row["Tên nhân viên"]||row["Tên NV"]||"").toString().trim();
          const shop = (row["Cửa hàng"]||row["Nhà thuốc"]||"").toString().trim();
          if(!ten) continue;
          const s = staff.find(x => x.name.trim()===ten && (!shop || x.shop===shop));
          if(!s){ unmatched.push(ten); continue; }
          const payload = { staffId:s.id, staffName:s.name, shop:s.shop, role:s.role, thang };
          let any = false;
          groups.forEach(it0 => it0.items.forEach(it => {
            const key = Object.keys(row).find(k => k.startsWith(it.label) && k.includes("Mục tiêu"));
            if(key && row[key]!==""){ payload[`targets.${it.id}`] = Number(row[key]); any = true; }
          }));
          if(any){ await mergeDotFields("kpiAssignments", kpiAssignmentId(s.id, thang), payload); matched++; }
        }
      }
      setImportMsg(`Đã nhập chỉ tiêu cho ${matched} nhân viên.${unmatched.length? " Không khớp tên: "+unmatched.join(", ") : ""}`);
    } catch(err){
      console.error("Nhập Excel lỗi:", err);
      setImportMsg("Đọc file lỗi — kiểm tra đúng định dạng file đã tải xuống trước đó.");
    } finally { setImporting(false); }
  }

function PerformanceView(){
  const [staff, setStaff] = useState([]);
  const [dailyReports, setDailyReports] = useState([]);
  const [weeklyReports, setWeeklyReports] = useState([]);
  useEffect(()=>{
    const u1 = subscribeCol("staff", setStaff);

    const u3 = subscribeCol("weeklyReports", setWeeklyReports);
    return ()=>{ u1(); u2(); u3(); };
  }, []);

  const today = todayISO();
  const currentMonday = mondayOf(today);

  const shopStats = DEFAULT_SHOPS.map(shop => {
    const shopStaff = staff.filter(s => s.shop===shop);
    const todaySubmitted = shopStaff.filter(s => dailyReports.some(r => r.staffId===s.id && r.ngay===today && r.trangThai==="Đã nộp")).length;
    const weekSubmitted = weeklyReports.some(r => r.shop===shop && r.tuanNgay===currentMonday);
    const scores = dailyReports.filter(r => r.shop===shop && r.diemChu!=null).map(r => r.diemChu);
    const avgScore = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length) : null;
    return { shop, staffCount:shopStaff.length, todaySubmitted, weekSubmitted, avgScore, hasManager: shopStaff.some(s => s.role==="Cửa hàng trưởng") };
  });

  const noManagerShops = shopStats.filter(s => !s.hasManager && s.staffCount>0);
  const noReportTodayShops = shopStats.filter(s => s.staffCount>0 && s.todaySubmitted===0);
  const noWeeklyShops = shopStats.filter(s => !s.weekSubmitted);
  const totalStaff = staff.length;
  const totalSubmittedToday = shopStats.reduce((s,x)=>s+x.todaySubmitted,0);
  const shopsSubmittedWeekly = shopStats.filter(s => s.weekSubmitted).length;
  const combinedScores = [
    ...dailyReports.filter(r=>r.diemChu!=null).map(r=>r.diemChu),
    ...weeklyReports.filter(r=>r.diemChu!=null).map(r=>r.diemChu),

    React.createElement("div", { key:"3", className:"metric warn" }, [ React.createElement("div",{key:"l",className:"label"},"Cửa hàng chưa ai báo cáo hôm nay"), React.createElement("div",{key:"v",className:"value"}, fmtNum(noReportTodayShops.length)) ]),

  ]);

  const alertCard = (noManagerShops.length>0 || noReportTodayShops.length>0 || noWeeklyShops.length>0) && React.createElement("div", { className:"card", style:{ marginBottom:20, borderColor:"var(--claySoft)" } }, [
    React.createElement("div", { key:"t", className:"cardTitle", style:{ color:"var(--clay)" } }, "Cần chú ý"),
    React.createElement("div", { key:"list", style:{ display:"flex", flexDirection:"column", gap:6, fontSize:12.5 } }, [
      noReportTodayShops.length>0 && React.createElement("div", {key:"a"}, `Chưa có báo cáo hôm nay: ${noReportTodayShops.map(s=>s.shop).join(", ")}`),
      noWeeklyShops.length>0 && React.createElement("div", {key:"c"}, `Chưa gửi báo cáo tuần này: ${noWeeklyShops.map(s=>s.shop).join(", ")}`),

    ]),

  const table = React.createElement("div", { className:"tableWrap" }, React.createElement("table",{className:"data"}, [
    React.createElement("thead",{key:"h"}, React.createElement("tr",null, ["Cửa hàng","Số NV","Cửa hàng trưởng","Đã nộp hôm nay","Báo cáo tuần này","Điểm TB"].map((h,i)=>React.createElement("th",{key:i},h)))),
    React.createElement("tbody",{key:"b"}, shopStats.map(s => React.createElement("tr",{key:s.shop}, [
      React.createElement("td",{key:"sh"}, s.shop),
      React.createElement("td",{key:"c"}, fmtNum(s.staffCount)),

    ]))),
  ]));

  return str.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D");
}
function suggestEmail(name){
  const slug = stripAccents(name).toLowerCase().trim().replace(/[^a-z0-9\s]/g,"").split(/\s+/).join(".");
  return slug + "@upharma.local";
}
function randomPassword(){
  return Math.random().toString(36).slice(-4) + Math.random().toString(36).slice(-4);
}

function CleanupTokensButton(){
  const [running, setRunning] = useState(false);
  const [result, setResult] = useState(null);
  async function run(){
    if(!window.confirm("Dọn token thông báo trùng cho TẤT CẢ tài khoản? Mỗi tài khoản sẽ chỉ giữ lại đúng 1 token mới nhất, các token cũ (nếu có) sẽ bị xoá.")) return;
    setRunning(true); setResult(null);
    try{
      const snap = await db.collection("fcmTokens").get();
      let cleaned = 0, checked = 0;
      for(const doc of snap.docs){
        checked++;
        const tokens = doc.data().tokens || [];
        if(tokens.length > 1){
          await doc.ref.set({ tokens: [tokens[tokens.length-1]] }, { merge:true });
          cleaned++;
        }
      }
      setResult(`Đã kiểm tra ${checked} tài khoản, dọn ${cleaned} tài khoản có token trùng.`);
    } catch(err){
      console.error("Dọn token lỗi:", err);
      setResult("Có lỗi xảy ra: " + (err && err.message ? err.message : String(err)));
    } finally{ setRunning(false); }
  }
  return React.createElement("div", { className:"card", style:{ marginBottom:20 } }, [
    React.createElement("div", { key:"t", style:{ fontWeight:700, fontSize:15, marginBottom:4 } }, "Dọn token thông báo trùng lặp"),

// ================= MODULE: BÁO CÁO DOANH SỐ THEO NGÀY =================
const WEEKDAY_LABELS = ["CN","T2","T3","T4","T5","T6","T7"];
function weekdayLabel(iso){ return WEEKDAY_LABELS[new Date(iso + "T00:00:00").getDay()]; }
function salesReportId(shop, iso){ return shop + "_" + iso; }
const DEFAULT_SALES_CHECKPOINTS = [
  { id:"cp1", label:"15h", time:"15:00" },
  { id:"cp2", label:"22h", time:"22:00" },
];
function salesCheckpointEmpty(){ return { luotKhach:"", khachMoi:"", soBill:"" }; }
// Cộng dồn 1 trường số liệu (lượt khách/khách mới/số bill) qua tất cả các khung giờ chốt trong ngày —
// tương ứng cột "TỔNG" trong file mẫu (15h + 22h, hoặc bao nhiêu khung giờ tuỳ cấu hình).
function salesSumField(doc, checkpoints, field){
  return checkpoints.reduce((s,cp) => s + (Number(doc && doc.checkpoints && doc.checkpoints[cp.id] && doc.checkpoints[cp.id][field]) || 0), 0);
}
// Chỉ tiêu tháng chỉ cần nhập 1 lần đầu tháng — các ngày sau tự kế thừa chỉ tiêu tháng gần nhất
// đã nhập trong cùng tháng cho cùng cửa hàng (giống cơ chế của báo cáo tuần).
function salesLatestMonthTarget(allReports, shop, monthStr, beforeIso, key){
  const list = allReports
    .filter(r => r.shop===shop && monthOf(r.ngay)===monthStr && r.ngay<beforeIso && Number(r[key]))
    .sort((a,b)=> a.ngay<b.ngay?1:-1);
  return list.length>0 ? list[0][key] : "";
}
// Chỉ tiêu ngày = chỉ tiêu tháng chia đều cho số ngày thực tế của tháng đó (đúng cách tính trong file mẫu gốc).
function salesDayTarget(monthlyTarget, iso){
  const t = Number(monthlyTarget) || 0;
  return t>0 ? t/daysInMonthOf(iso) : 0;
}
function dayOfMonthNum(iso){ return Number(iso.slice(8,10)); }
// Doanh số/hệ số luỹ kế trong tháng của 1 cửa hàng, cộng dồn các báo cáo có ngày <= uptoIso (cùng tháng).
function salesMonthAchieved(allReports, shop, monthStr, uptoIso, key){
  return allReports
    .filter(r => r.shop===shop && monthOf(r.ngay)===monthStr && r.ngay<=uptoIso && Number(r[key]))
    .reduce((s,r)=> s + Number(r[key]), 0);
}
// Target ngày = phần chỉ tiêu tháng CÒN LẠI (chỉ tiêu tháng trừ đi luỹ kế đã đạt các ngày TRƯỚC ngày này)
// chia đều cho số ngày CÒN LẠI của tháng (tính từ ngày này đến hết tháng, bao gồm cả ngày này).
// => Target ngày tự tăng nếu những ngày trước bán chậm hơn kế hoạch, tự giảm nếu bán nhanh hơn kế hoạch.
function salesDayTargetDynamic(monthlyTarget, achievedBeforeToday, iso){
  const t = Number(monthlyTarget) || 0;
  if(t<=0) return 0;
  const totalDays = daysInMonthOf(iso);
  const dayNum = dayOfMonthNum(iso);
  const remainingDays = Math.max(1, totalDays - dayNum + 1);
  return (t - achievedBeforeToday) / remainingDays;
}

// Dựng đúng bộ cột như file mẫu gốc (Thứ, Ngày, Target HS, Thực đạt HS, Target ngày, Doanh số đạt theo
// ngày, so sánh tuần trước, chi tiết từng khung giờ, TỔNG, Trung bình giá trị bill) + dòng TỔNG THÁNG,
// dùng chung cho cả xem trên app (objRowsToTable) và xuất Excel.
function buildSalesExportRows(shop, monthStr, reportsMap, checkpoints){
  const daysInM = new Date(Number(monthStr.slice(0,4)), Number(monthStr.slice(5,7)), 0).getDate();
  const rows = [];
  let totalTargetHS=0, totalThucHS=0, totalTargetNgay=0, totalDoanhSo=0, totalDoanhSoTuanTruoc=0, totalBillTuanTruoc=0;
  let totalTongKhach=0, totalTongMoi=0, totalTongBill=0;
  const cpTotals = {}; checkpoints.forEach(cp => cpTotals[cp.id] = { luotKhach:0, khachMoi:0, soBill:0 });
  for(let d=1; d<=daysInM; d++){
    const iso = `${monthStr}-${String(d).padStart(2,"0")}`;
    const doc = reportsMap[salesReportId(shop, iso)];
    if(!doc) continue;
    const targetNgay = salesDayTarget(doc.targetThangDoanhSo, iso);
    const targetHsNgay = salesDayTarget(doc.targetThangHeSo, iso);
    const prevDoc = reportsMap[salesReportId(shop, addDays(iso,-7))];
    const row = {
      "Thứ": weekdayLabel(iso), "Ngày": iso,
      "Target HS": targetHsNgay ? Math.round(targetHsNgay) : "",
      "Thực đạt HS": doc.heSoDat!=null && doc.heSoDat!=="" ? Number(doc.heSoDat) : "",
      "Target ngày": targetNgay ? Math.round(targetNgay) : "",
      "Doanh số đạt theo ngày": doc.doanhSoDat!=null && doc.doanhSoDat!=="" ? Number(doc.doanhSoDat) : "",
      "Doanh số cùng ngày tuần trước": prevDoc && prevDoc.doanhSoDat!=null ? Number(prevDoc.doanhSoDat) : "",
      "Số lượt bill tuần trước": prevDoc ? salesSumField(prevDoc, checkpoints, "soBill") : "",
    };
    checkpoints.forEach(cp => {
      const c = (doc.checkpoints && doc.checkpoints[cp.id]) || {};
      row[`${cp.label} - Số lượt khách`] = c.luotKhach || "";
      row[`${cp.label} - Số khách mới`] = c.khachMoi || "";
      row[`${cp.label} - Số bill`] = c.soBill || "";
      cpTotals[cp.id].luotKhach += Number(c.luotKhach)||0;
      cpTotals[cp.id].khachMoi += Number(c.khachMoi)||0;
      cpTotals[cp.id].soBill += Number(c.soBill)||0;
    });
    const tongKhach = salesSumField(doc, checkpoints, "luotKhach");
    const tongMoi = salesSumField(doc, checkpoints, "khachMoi");
    const tongBill = salesSumField(doc, checkpoints, "soBill");
    row["TỔNG - Số lượt khách"] = tongKhach;
    row["TỔNG - Số khách mới"] = tongMoi;
    row["TỔNG - Số bill"] = tongBill;
    row["Trung bình giá trị bill"] = tongBill>0 ? Math.round((Number(doc.doanhSoDat)||0)/tongBill) : "";
    rows.push(row);
    totalTargetHS += targetHsNgay; totalThucHS += Number(doc.heSoDat)||0;
    totalTargetNgay += targetNgay; totalDoanhSo += Number(doc.doanhSoDat)||0;
    totalDoanhSoTuanTruoc += prevDoc ? (Number(prevDoc.doanhSoDat)||0) : 0;
    totalBillTuanTruoc += prevDoc ? salesSumField(prevDoc, checkpoints, "soBill") : 0;
    totalTongKhach += tongKhach; totalTongMoi += tongMoi; totalTongBill += tongBill;
  }
  if(rows.length>0){
    const totalRow = {
      "Thứ": "TỔNG THÁNG", "Ngày": "",
      "Target HS": Math.round(totalTargetHS), "Thực đạt HS": Math.round(totalThucHS),
      "Target ngày": Math.round(totalTargetNgay), "Doanh số đạt theo ngày": Math.round(totalDoanhSo),
      "Doanh số cùng ngày tuần trước": Math.round(totalDoanhSoTuanTruoc), "Số lượt bill tuần trước": totalBillTuanTruoc,
    };
    checkpoints.forEach(cp => {
      totalRow[`${cp.label} - Số lượt khách`] = cpTotals[cp.id].luotKhach;
      totalRow[`${cp.label} - Số khách mới`] = cpTotals[cp.id].khachMoi;
      totalRow[`${cp.label} - Số bill`] = cpTotals[cp.id].soBill;
    });
    totalRow["TỔNG - Số lượt khách"] = totalTongKhach;
    totalRow["TỔNG - Số khách mới"] = totalTongMoi;
    totalRow["TỔNG - Số bill"] = totalTongBill;
    totalRow["Trung bình giá trị bill"] = totalTongBill>0 ? Math.round(totalDoanhSo/totalTongBill) : "";
    rows.push(totalRow);
  }
  return rows;
}
function exportSalesExcel(shops, monthStr, reportsMap, checkpoints){
  const wb = XLSX.utils.book_new();
  let any = false;
  shops.forEach(shop => {
    const rows = buildSalesExportRows(shop, monthStr, reportsMap, checkpoints);
    if(rows.length===0) return;
    any = true;
    const ws = XLSX.utils.json_to_sheet(rows);
    styleExportSheet(ws, rows);
    XLSX.utils.book_append_sheet(wb, ws, shop.slice(0,31));
  });
  if(!any){ window.alert("Chưa có báo cáo nào trong tháng này để xuất."); return; }
  XLSX.writeFile(wb, `BaoCaoDoanhSo_${monthStr}.xlsx`);
}

// ================= HOOK: SỐ TIN CHƯA ĐỌC TRÊN TỪNG TAB =================
// Với mỗi tab, tính danh sách "khoá từng mục" hiện tại (mỗi phần tử đại diện 1 tin/1 thay đổi
// đáng chú ý). So với danh sách khoá đã lưu lúc nhân viên mở tab đó ra xem lần gần nhất (lưu
// trong localStorage của máy) — khoá nào hiện có mà chưa từng "seen" thì tính là 1 tin chưa đọc.
// Cách này vẫn đúng cả khi tin xuất hiện lúc nhân viên đang tắt app, không chỉ lúc đang mở sẵn.
function useUnreadTabs(myStaff){
  const itemsRef = useRef({});
  const seenRef = useRef({});
  const [, forceRender] = useState(0);
  const storageKey = myStaff ? "unreadSeen_"+myStaff.id : null;

  useEffect(()=>{
    if(!storageKey){ seenRef.current = {}; return; }
    try{ seenRef.current = JSON.parse(localStorage.getItem(storageKey) || "{}"); }catch(e){ seenRef.current = {}; }
    forceRender(n=>n+1);
  }, [storageKey]);

  function updateItems(tabId, items){
    const key = items.slice().sort().join("|");
    const prevKey = (itemsRef.current[tabId]||[]).slice().sort().join("|");
    if(key===prevKey) return;
    itemsRef.current = { ...itemsRef.current, [tabId]:items };
    forceRender(n=>n+1);
  }
  function markSeen(tabId){
    const items = itemsRef.current[tabId] || [];
    seenRef.current = { ...seenRef.current, [tabId]:items };
    if(storageKey){ try{ localStorage.setItem(storageKey, JSON.stringify(seenRef.current)); }catch(e){} }
    forceRender(n=>n+1);
  }

  useEffect(()=>{
    if(!myStaff) return undefined;
    const unsub = db.collection("tasks").onSnapshot(snap => {
      const mine = snap.docs.map(d=>({id:d.id, ...d.data()}))
        .filter(t => t.assignType==="staff" ? t.staffId===myStaff.id : t.shop===myStaff.shop);
      updateItems("tasks", mine.map(t=>`${t.id}:${t.trangThai}:${t.nhanXetQuanLy||""}`));
    }, err => console.error("useUnreadTabs (tasks) lỗi:", err));
    return unsub;
  }, [myStaff && myStaff.id]);

  useEffect(()=>{
    if(!myStaff) return undefined;
    const unsub = db.collection("kudos").where("toId","==",myStaff.id).onSnapshot(snap => {
      updateItems("kudos", snap.docs.map(d=>d.id));
    }, err => console.error("useUnreadTabs (kudos) lỗi:", err));
    return unsub;
  }, [myStaff && myStaff.id]);

  useEffect(()=>{
    if(!myStaff) return undefined;
    const unsub = db.collection("dailyReports").where("staffId","==",myStaff.id).onSnapshot(snap => {
      updateItems("checklist", snap.docs.map(d=>{ const r=d.data(); return `${d.id}:${r.diemChu}:${r.nhanXetChu||""}`; }));
    }, err => console.error("useUnreadTabs (dailyReports) lỗi:", err));
    return unsub;
  }, [myStaff && myStaff.id]);

  useEffect(()=>{
    if(!myStaff) return undefined;
    const unsub = db.collection("weeklyReports").where("shop","==",myStaff.shop).onSnapshot(snap => {
      const items = [];
      snap.docs.forEach(d => {
        const r = d.data();
        items.push(`review:${d.id}:${r.diemChu}:${r.nhanXetChu||""}`);
        const tagged = [];
        Object.keys(r.keHoach||{}).forEach(k=>(r.keHoach[k]||[]).forEach(row=>{
          if((row.nguoiThucHienIds||[]).includes(myStaff.id)) tagged.push(`${row.id}:${row.deadline||""}`);
        }));
        if(tagged.length>0) items.push(`tags:${d.id}:${tagged.sort().join(",")}`);
      });
      updateItems("weekly", items);
    }, err => console.error("useUnreadTabs (weeklyReports) lỗi:", err));
    return unsub;
  }, [myStaff && myStaff.id, myStaff && myStaff.shop]);

  useEffect(()=>{
    if(!myStaff) return undefined;
    const unsub = db.collection("kpiAssignments").where("staffId","==",myStaff.id).onSnapshot(snap => {
      updateItems("kpi", snap.docs.map(d=>{ const r=d.data(); return `${d.id}:${r.trangThaiDuyet||""}:${r.nhanXetCHT||""}`; }));
    }, err => console.error("useUnreadTabs (kpiAssignments) lỗi:", err));
    return unsub;
  }, [myStaff && myStaff.id]);

  // Lưu ý: KHÔNG theo dõi tab "Đào tạo & Buddy" ở đây — nhân viên thường không có quyền đọc
  // trực tiếp collection newHires/buddyReports theo Security Rules hiện tại (chỉ Admin/CHT
  // được đọc), nên bỏ qua để tránh lỗi "permission-denied".

  useEffect(()=>{
    if(!myStaff) return undefined;
    const unsub = db.collection("imageReports").where("shop","==",myStaff.shop).onSnapshot(snap => {
      updateItems("photos", snap.docs.map(d=>{ const r=d.data(); return `${d.id}:${r.trangThaiDuyet||""}:${r.nhanXetDuyet||""}`; }));
    }, err => console.error("useUnreadTabs (imageReports) lỗi:", err));
    return unsub;
  }, [myStaff && myStaff.id, myStaff && myStaff.shop]);

  const unreadCount = {};
  Object.keys(itemsRef.current).forEach(tabId => {
    const items = itemsRef.current[tabId] || [];
    const seenSet = new Set(seenRef.current[tabId] || []);
    unreadCount[tabId] = items.filter(k => !seenSet.has(k)).length;
  });
  return { unreadCount, markSeen };
}

function TaskLiveNotifier({ myStaff, isAdmin }){
  const [toast, setToast] = useState(null);
  const [notifPerm, setNotifPerm] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
  const [notifErr, setNotifErr] = useState(null);
  const seenIds = useRef(new Set());
  const isFirstSnap = useRef(true);
  const seenKudos = useRef(new Set());
  const isFirstKudos = useRef(true);
  const prevDaily = useRef({});
  const prevWeekly = useRef({});
  const prevTaskFeedback = useRef({});
  const seenSysErr = useRef(new Set());
  const isFirstSysErr = useRef(true);
  // Quản lý không có myStaff — dùng khoá cố định "admin" để vẫn đăng ký được token thông báo đẩy.
  const notifKey = myStaff ? myStaff.id : (isAdmin ? "admin" : null);
  const notifName = myStaff ? myStaff.name : "Quản lý";
  const notifShop = myStaff ? myStaff.shop : "Tất cả";

  function fireLocalNotif(title, body){
    setToast({ title, body });
    if(typeof Notification !== "undefined" && Notification.permission==="granted"){
      try{ new Notification(title, { body }); } catch(err){}
    }
  }

  // Việc mới được giao
  useEffect(()=>{
    if(!myStaff) return undefined;
    seenIds.current = new Set();
    isFirstSnap.current = true;
    const unsub = db.collection("tasks").onSnapshot(snap => {
      if(isFirstSnap.current){
        // Lần tải đầu tiên: chỉ ghi nhớ các việc đã có sẵn từ trước, không báo cho việc cũ.
        snap.docs.forEach(d => { seenIds.current.add(d.id); prevTaskFeedback.current[d.id] = d.data().nhanXetQuanLy || ""; });
        isFirstSnap.current = false;
        return;
      }
      snap.docChanges().forEach(change => {
        const t = { id:change.doc.id, ...change.doc.data() };
        const isMine = (t.assignType==="staff" && t.staffId===myStaff.id) || (t.assignType==="shop" && t.shop===myStaff.shop);
        if(!isMine) return;
        if(change.type==="added" && !seenIds.current.has(t.id)){
          seenIds.current.add(t.id);
          // Không bắn thông báo cục bộ ở đây nữa — hàm onTaskCreated bên server đã gửi push thật
          // cho việc mới giao, tránh bị nhận trùng 2 tin cho cùng 1 việc.
        }
        if(change.type==="modified"){
          // Không bắn thông báo cục bộ ở đây nữa — Cloud Function "notifyTaskFeedback" đã lo phần
          // gửi push thật (hoạt động cả khi tắt app), tránh bị nhận trùng 2 tin cho cùng 1 việc.
          prevTaskFeedback.current[t.id] = t.nhanXetQuanLy || "";
        }
        if(change.type!=="removed") seenIds.current.add(t.id);      });
    }, err => console.error("TaskLiveNotifier (tasks) lỗi:", err));
    return unsub;
  }, [myStaff && myStaff.id]);

  // Được tặng sao
  useEffect(()=>{
    if(!myStaff) return undefined;
    seenKudos.current = new Set();
    isFirstKudos.current = true;
    const unsub = db.collection("kudos").onSnapshot(snap => {
      if(isFirstKudos.current){
        snap.docs.forEach(d => seenKudos.current.add(d.id));
        isFirstKudos.current = false;
        return;
      }
      snap.docChanges().forEach(change => {
        if(change.type!=="added") return;
        const k = { id:change.doc.id, ...change.doc.data() };
        if(seenKudos.current.has(k.id)) return;
        seenKudos.current.add(k.id);
        // Không bắn thông báo cục bộ ở đây nữa — Cloud Function "notifyKudosGiven" đã lo phần
        // gửi push thật cho toàn bộ nhân viên, tránh người được tặng sao nhận trùng 2 tin.
      });
    }, err => console.error("TaskLiveNotifier (kudos) lỗi:", err));
    return unsub;
  }, [myStaff && myStaff.id]);

  // Quản lý chấm checklist ngày
  useEffect(()=>{
    if(!myStaff) return undefined;
    prevDaily.current = {};
    let first = true;
    const unsub = db.collection("dailyReports").where("staffId","==",myStaff.id).onSnapshot(snap => {
      if(first){ snap.docs.forEach(d => prevDaily.current[d.id] = { diem:d.data().diemChu, nx:d.data().nhanXetChu||"" }); first = false; return; }
      snap.docChanges().forEach(change => {
        if(change.type!=="modified") return;
        const r = change.doc.data();
        // Không bắn thông báo cục bộ ở đây nữa — Cloud Function "notifyDailyReportReview" đã lo
        // phần gửi push thật, tránh bị nhận trùng 2 tin cho cùng 1 lượt chấm.
        prevDaily.current[change.doc.id] = { diem:r.diemChu, nx:r.nhanXetChu||"" };
      });
    }, err => console.error("TaskLiveNotifier (dailyReports) lỗi:", err));
    return unsub;
  }, [myStaff && myStaff.id]);

  // Quản lý chấm báo cáo tuần (theo cửa hàng — cả cửa hàng đều nhận)
  useEffect(()=>{
    if(!myStaff) return undefined;
    prevWeekly.current = {};
    let first = true;
    const unsub = db.collection("weeklyReports").where("shop","==",myStaff.shop).onSnapshot(snap => {
      if(first){ snap.docs.forEach(d => prevWeekly.current[d.id] = { diem:d.data().diemChu, nx:d.data().nhanXetChu||"" }); first = false; return; }
      snap.docChanges().forEach(change => {
        if(change.type!=="modified") return;
        const r = change.doc.data();
        // Không bắn thông báo cục bộ ở đây nữa — Cloud Function "notifyWeeklyReportReview" đã lo
        // phần gửi push thật, tránh bị nhận trùng 2 tin cho cùng 1 lượt chấm.
        prevWeekly.current[change.doc.id] = { diem:r.diemChu, nx:r.nhanXetChu||"" };
      });
    }, err => console.error("TaskLiveNotifier (weeklyReports) lỗi:", err));
    return unsub;
  }, [myStaff && myStaff.id, myStaff && myStaff.shop]);

  // Hệ thống gặp lỗi ngầm (Firestore listener lỗi, JS lỗi không bắt được...) — chỉ Quản lý nhận,
  // dùng chính collection "systemErrors" do logSystemError() ghi vào (xem FIRESTORE HELPERS).
  // Lỗi ở đây KHÔNG gọi logSystemError để tránh vòng lặp lỗi tự sinh ra lỗi.
  useEffect(()=>{
    if(!isAdmin) return undefined;
    seenSysErr.current = new Set();
    isFirstSysErr.current = true;
    const unsub = db.collection("systemErrors").orderBy("createdAtTs","desc").limit(20).onSnapshot(snap => {
      if(isFirstSysErr.current){
        snap.docs.forEach(d => seenSysErr.current.add(d.id));
        isFirstSysErr.current = false;
        return;
      }
      snap.docChanges().forEach(change => {
        if(change.type!=="added" || seenSysErr.current.has(change.doc.id)) return;
        seenSysErr.current.add(change.doc.id);
        const e = change.doc.data();
        fireLocalNotif("⚠️ Hệ thống gặp lỗi", `${e.source || "?"}: ${e.message || "Lỗi không rõ"}`.slice(0,180));
      });
    }, err => console.error("TaskLiveNotifier (systemErrors) lỗi:", err));
    return unsub;
  }, [isAdmin]);

  useEffect(()=>{
    if(!toast) return undefined;
    const t = setTimeout(()=>setToast(null), 9000);
    return ()=>clearTimeout(t);
  }, [toast]);

  async function enableNotif(silent){
    if(typeof Notification === "undefined") return;
    const perm = silent ? Notification.permission : await Notification.requestPermission();
    setNotifPerm(perm);
    if(perm!=="granted" || !notifKey) return;
    if(!silent) setNotifErr(null);
    // Đăng ký nhận thông báo đẩy thật (hoạt động cả khi tắt hẳn trình duyệt) — cần Service
    // Worker + khoá VAPID (FCM_VAPID_KEY) + Cloud Function đứng giữa gửi đi (xem hướng dẫn deploy).
    // Mở trực tiếp bằng file:// (origin "null") hoặc http thường (không phải https/localhost) thì
    // trình duyệt luôn từ chối đăng ký Service Worker — đây là giới hạn bảo mật của trình duyệt,
    // không phải lỗi của app, nên bỏ qua êm chứ không cần thử và không hiện banner đỏ.
    const originOk = location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1";
    if(!originOk){
      console.warn("Bỏ qua đăng ký thông báo đẩy: cần mở app qua địa chỉ https:// (hiện đang mở qua", location.protocol, ")");
      if(!silent) setNotifErr("Chỉ bật được thông báo khi truy cập app qua địa chỉ web (https://...), không hoạt động khi mở trực tiếp file trên máy.");
      return;
    }
    try{
      if(!("serviceWorker" in navigator)) { if(!silent) setNotifErr("Trình duyệt này không hỗ trợ Service Worker."); return; }
      const reg = await navigator.serviceWorker.register("/firebase-messaging-sw.js");
      const messaging = firebase.messaging();
      const token = await messaging.getToken({ vapidKey:FCM_VAPID_KEY, serviceWorkerRegistration:reg });
      if(token){
        // Chỉ giữ ĐÚNG 1 token cho tài khoản này (ghi đè, không cộng dồn) — tránh tình trạng
        // token cũ (từ lần bật thông báo trước, ví dụ sau khi xoá cache/cài lại app) vẫn còn
        // nằm trong danh sách, khiến mỗi thông báo bị gửi lặp lại nhiều lần trên cùng 1 máy.
        await db.collection("fcmTokens").doc(notifKey).set({
          tokens: [token],
          staffName: notifName, shop: notifShop, isAdmin: !!isAdmin,
          updatedAtTs: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge:true });
        try{ localStorage.setItem("fcmOk_"+notifKey, "1"); } catch(e){}
        setNotifErr("__OK__");
      } else if(!silent){
        setNotifErr("Không lấy được token (getToken trả về rỗng) — thường do khoá VAPID sai hoặc chưa đúng.");
      }
    } catch(err){
      console.error("Đăng ký thông báo đẩy lỗi:", err);
      // Lần thử NGẦM (silent, tự động khi tải trang) thất bại thì chỉ log ra console, không làm
      // phiền người dùng bằng banner đỏ — họ có thể tự bấm "Bật thông báo" nếu thật sự cần.
      if(!silent) setNotifErr((err && err.code ? `[${err.code}] ` : "") + (err && err.message ? err.message : String(err)));
    }
  }

  // Nếu đã từng cho phép (granted) nhưng thiết bị này chưa được xác nhận đăng ký thành công
  // (chưa đánh dấu trong localStorage), tự động thử đăng ký NGẦM 1 lần khi tải trang —
  // không cần bấm gì cả, đỡ phải hỏi lại "Thử đăng ký lại" mỗi lần vào app.
  useEffect(()=>{
    if(!notifKey) return;
    if(notifPerm!=="granted") return;
    let already = false;
    try{ already = localStorage.getItem("fcmOk_"+notifKey)==="1"; } catch(e){}
    if(!already) enableNotif(true);
  }, [notifKey, notifPerm]);

  useEffect(()=>{
    if(notifErr!=="__OK__") return undefined;
    const t = setTimeout(()=>setNotifErr(null), 6000);
    return ()=>clearTimeout(t);
  }, [notifErr]);

  return React.createElement(React.Fragment, null, [
    notifErr && notifErr!=="__OK__" && React.createElement("div", { key:"errbanner", style:{ background:"var(--claySoft)", padding:"9px 16px", fontSize:12, display:"flex", justifyContent:"center", alignItems:"center", gap:10, flexWrap:"wrap", color:"var(--clay)", fontWeight:600 } }, [
      `Đăng ký thông báo lỗi: ${notifErr}`,
      React.createElement("button",{key:"b", type:"button", className:"btn", style:{padding:"4px 10px",fontSize:11.5}, onClick:()=>enableNotif(false)}, "Thử lại"),
    ]),
    notifErr==="__OK__" && React.createElement("div", { key:"okbanner", style:{ background:"var(--pineSoft)", padding:"9px 16px", fontSize:12.5, textAlign:"center", color:"var(--pine)", fontWeight:600 } },
      "Đã đăng ký nhận thông báo thành công cho thiết bị này."),
    notifPerm==="default" && React.createElement("div", { key:"banner", style:{ background:"var(--goldSoft)", padding:"9px 16px", fontSize:12.5, display:"flex", justifyContent:"center", alignItems:"center", gap:12, flexWrap:"wrap" } }, [
      isAdmin ? "Bật thông báo để biết ngay khi hệ thống gặp lỗi — kể cả khi đã tắt hẳn trình duyệt." : "Bật thông báo để biết ngay khi có việc mới được giao — kể cả khi đã tắt hẳn trình duyệt.",
      React.createElement("button", { key:"b", type:"button", className:"btn btnPrimary", style:{padding:"5px 12px",fontSize:12}, onClick:()=>enableNotif(false) }, "Bật thông báo"),
    ]),
    notifPerm==="unsupported" && isIOSNotInstalled() && React.createElement("div", { key:"iosbanner", style:{ background:"var(--claySoft)", padding:"9px 16px", fontSize:12.5, textAlign:"center" } },
      "Trên iPhone, cần \"Thêm vào Màn hình chính\" (nút Chia sẻ trong Safari → Add to Home Screen) rồi mở lại app từ biểu tượng đó mới bật được thông báo."),
    toast && React.createElement("div", { key:"toast", style:{ position:"fixed", top:16, right:16, left:16, maxWidth:340, marginLeft:"auto", zIndex:100, background:"var(--pine)", color:"#fff", borderRadius:10, padding:"14px 18px", boxShadow:"0 6px 20px rgba(0,0,0,.25)" } }, [
      React.createElement("div", { key:"t", style:{ fontWeight:700, marginBottom:4 } }, toast.title),
      React.createElement("div", { key:"b", style:{ fontSize:12.5 } }, toast.body),
    ]),
  ]);
}

function TaskReminderBanner({ myStaff, onOpenTasks }){
  const [tasks, setTasks] = useState([]);
  useEffect(()=>{
    if(!myStaff) return undefined;
    const u = subscribeCol("tasks", setTasks);
    return u;
  }, [myStaff && myStaff.id]);
  if(!myStaff) return null;

  const today = todayISO();
  const nowStamp = `${today}T${nowHM()}`;
  function ts(t){ return `${t.deadline}T${t.hanGio || "23:59"}`; }
  function label(t){ return t.hanGio ? `${t.deadline} ${t.hanGio}` : t.deadline; }

  const isShopManager = myStaff.role==="Cửa hàng trưởng";
  const myPending = tasks.filter(t =>
    (isShopManager ? t.shop===myStaff.shop : (t.assignType==="staff" ? t.staffId===myStaff.id : t.shop===myStaff.shop))
    && t.trangThai==="Đang giao"
  );
  // Nhắc việc đã quá hạn, hoặc sắp đến hạn trong vòng 24 giờ tới —
  // hiện ngay khi mở app, không cần bấm vào tab "Giao việc" mới thấy.
  const overdue = myPending.filter(t => ts(t) < nowStamp).sort((a,b)=> ts(a)<ts(b)?-1:1);
  const dueSoon = myPending.filter(t => ts(t) >= nowStamp && ts(t) <= `${addDays(today,1)}T${nowHM()}`).sort((a,b)=> ts(a)<ts(b)?-1:1);
  const alertTasks = [...overdue, ...dueSoon];
  if(alertTasks.length===0) return null;

  return React.createElement("div", { className:"card", style:{ maxWidth:1280, margin:"16px auto 0", borderColor:"var(--claySoft)", background:"var(--claySoft)" } }, [
    React.createElement("div", { key:"t", style:{ fontWeight:700, fontSize:13.5, marginBottom:8, color:"var(--clay)" } },
      `🔔 Bạn có ${alertTasks.length} việc được giao ${overdue.length>0 ? "quá hạn hoặc " : ""}sắp đến hạn`),
    React.createElement("div", { key:"list", style:{ display:"flex", flexDirection:"column", gap:6, marginBottom:10 } }, alertTasks.slice(0,5).map(t =>
      React.createElement("div", { key:t.id, style:{ fontSize:12.5 } }, [
        React.createElement("span", { key:"n", style:{ fontWeight:600 } }, t.title),
        (isShopManager && t.assignType==="staff" && t.staffId!==myStaff.id) && React.createElement("span", { key:"who", style:{ color:"var(--inkSoft)" } }, ` (${t.staffName})`),
        React.createElement("span", { key:"d", style:{ color: ts(t)<nowStamp ? "var(--clay)" : "var(--inkSoft)" } }, ` — hạn ${label(t)}${ts(t)<nowStamp ? " (quá hạn)" : ""}`),
      ])
    )),
    React.createElement("button", { key:"b", type:"button", className:"btn btnAmber", style:{padding:"7px 13px",fontSize:12.5}, onClick:onOpenTasks }, "Xem & báo cáo kết quả"),
  ]);
}
