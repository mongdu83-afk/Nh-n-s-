# TẠM THỜI — chạy 1 lần để đọc thống kê POS theo nhà thuốc cho chỉ tiêu KPI T11, xoá ngay sau đó.
name: tmp kpi pull
on:
  push:
    branches: [claude/project-thread-wi6qtv]
    paths: [scripts/tmp-kpi/**, .github/workflows/tmp-kpi-pull.yml]
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/tmp-kpi/pull.js
