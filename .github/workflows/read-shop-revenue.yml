name: Doc doanh thu shop (chia khoan)
on:
  push:
    branches: [claude/project-thread-bodzb3]
    paths: [scripts/read-shop-revenue.js, .github/workflows/read-shop-revenue.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/read-shop-revenue.js
